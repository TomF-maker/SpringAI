spring:
  application:
    name: SpringAI
  ai:
    ollama:
      base-url: http://localhost:11434  # Ollama默认服务地址
      chat:
        model: deepseek-r1:1.5b  # 模型名称，与终端启动的模型一致
        options:
          temperature: 0.7
          num-predict: 2048  # 最大输出长度
  thymeleaf:
    cache: false   # 开发时关闭缓存，修改页面后刷新即可生效
    encoding: UTF-8
