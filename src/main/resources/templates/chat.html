﻿<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购智能助手</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=5">
    <style>
        /* 聊天页专属：主内容区做成竖向 flex，让聊天框自适应填满视口高度。 */
        .main-content {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            /* 聊天页去掉网格纹理，避免干扰气泡阅读 */
            background-image: none;
        }
        /* 游客提示条 */
        .guest-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--pa-warning-soft, #FFF5E0);
            border: 1px solid rgba(181, 116, 0, 0.16);
            color: var(--pa-warning, #B57400);
            border-radius: var(--pa-radius);
            padding: 10px 16px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: 500;
        }
        .guest-banner i { font-size: 16px; color: var(--pa-warning); }
        .guest-banner .btn { font-size: 12px; padding: 4px 12px; }
        .chat-container {
            width: 100%;
            max-width: 100%;
            background: var(--pa-surface, #fff);
            border-radius: var(--pa-radius-lg);
            box-shadow:
                0 4px 12px rgba(10, 37, 64, 0.06),
                0 1px 3px rgba(10, 37, 64, 0.04);
            border: 1px solid var(--pa-border, #E5E7EB);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        /* Stripe 风：header 白底 + 1px 底边，不再用深色渐变 */
        .chat-header {
            background: var(--pa-surface, #fff);
            color: var(--pa-ink, #0A2540);
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            letter-spacing: -0.2px;
            border-bottom: 1px solid var(--pa-border, #E5E7EB);
        }
        .chat-header .header-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: linear-gradient(135deg, #635BFF 0%, #4F47D6 100%);
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(99, 91, 255, 0.28);
        }
        .new-chat-btn {
            margin-left: auto;
            background: var(--pa-primary-soft, #F0EFFF);
            border: 1px solid var(--pa-primary-tint, #E6E1FF);
            color: var(--pa-primary-700, #4F47D6);
            font-size: 13px;
            font-weight: 600;
            padding: 7px 14px;
            border-radius: var(--pa-radius);
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all .18s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .new-chat-btn:hover {
            background: var(--pa-primary, #635BFF);
            border-color: var(--pa-primary, #635BFF);
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(99, 91, 255, 0.28);
        }
        @media (max-width: 991.98px) {
            .new-chat-btn .btn-text { display: none; }
            .new-chat-btn { padding: 7px 10px; }
        }
        .chat-header .badge {
            background: var(--pa-bg-mute, #F4F6F8);
            border: 1px solid var(--pa-border, #E5E7EB);
            color: var(--pa-text-soft, #425466);
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 999px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: var(--pa-bg-soft, #FAFBFC);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 78%;
            padding: 14px 18px;
            border-radius: var(--pa-radius-lg);
            line-height: 1.65;
            word-wrap: break-word;
            animation: fadeIn 0.28s ease;
            font-size: 14px;
        }
        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #635BFF 0%, #4F47D6 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow:
                0 4px 12px rgba(99, 91, 255, 0.20),
                0 1px 3px rgba(99, 91, 255, 0.10);
        }
        .message.ai {
            align-self: flex-start;
            background: var(--pa-surface, #fff);
            color: var(--pa-ink, #0A2540);
            border: 1px solid var(--pa-border, #E5E7EB);
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(10, 37, 64, 0.04);
        }
        .message .role-tag {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.8;
            margin-bottom: 6px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .message.ai .role-tag { color: var(--pa-primary, #635BFF); }
        .message.user .role-tag { color: rgba(255,255,255,0.85); }
        .message .content { white-space: pre-wrap; }
        .message .time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 6px;
            text-align: right;
        }
        .message.user .time { color: rgba(255,255,255,0.85); }
        .message.ai .time { color: var(--pa-text-faint, #B0BCC8); }
        .chat-input-area {
            padding: 14px 20px;
            border-top: 1px solid var(--pa-border, #E5E7EB);
            background: var(--pa-surface, #fff);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid var(--pa-border-strong, #D1D5DB);
            border-radius: 999px;
            font-size: 14px;
            outline: none;
            background: var(--pa-surface-2, #FAFBFC);
            color: var(--pa-ink, #0A2540);
            transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
        }
        .chat-input-area input::placeholder { color: var(--pa-text-faint, #B0BCC8); }
        .chat-input-area input:focus {
            border-color: var(--pa-primary, #635BFF);
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.14);
            background: #fff;
        }
        .chat-input-area button {
            padding: 12px 26px;
            background: var(--pa-primary, #635BFF);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all .18s cubic-bezier(0.2, 0.7, 0.2, 1);
            box-shadow:
                0 4px 12px rgba(99, 91, 255, 0.28),
                0 1px 3px rgba(99, 91, 255, 0.16);
        }
        .chat-input-area button:hover {
            background: var(--pa-primary-600, #5A52E0);
            transform: translateY(-1px);
            box-shadow:
                0 8px 18px rgba(99, 91, 255, 0.36),
                0 2px 6px rgba(99, 91, 255, 0.20);
        }
        .chat-input-area button:active { transform: translateY(0); }
        .chat-input-area button:disabled {
            background: var(--pa-text-faint, #B0BCC8);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .chat-input-area #cancelBtn {
            background: #fff;
            color: var(--pa-danger, #D6483D);
            border: 1px solid rgba(214, 72, 61, 0.24);
            box-shadow: none;
        }
        .chat-input-area #cancelBtn:hover {
            background: var(--pa-danger-soft, #FDECEA);
            border-color: rgba(214, 72, 61, 0.4);
            color: var(--pa-danger, #D6483D);
            box-shadow: none;
        }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--pa-surface, #fff);
            padding: 14px 18px;
            border-radius: var(--pa-radius-lg);
            border: 1px solid var(--pa-border, #E5E7EB);
            color: var(--pa-text-muted, #8898AA);
            font-size: 14px;
        }
        .typing-indicator.active { display: block; }
        .thinking {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--pa-text-faint, #B0BCC8);
            font-size: 14px;
        }
        .thinking .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--pa-primary-tint, #E6E1FF);
            animation: thinking-bounce 1.2s infinite ease-in-out;
        }
        .thinking .dot:nth-child(2) { animation-delay: .15s; }
        .thinking .dot:nth-child(3) { animation-delay: .3s; }
        @keyframes thinking-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: .45; }
            30% { transform: translateY(-4px); opacity: 1; }
        }
        .answer-feedback {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--pa-border, #E5E7EB);
        }
        .answer-feedback .fb-ask {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--pa-text-muted, #8898AA);
        }
        .answer-feedback .fb-ask.fb-error { color: var(--pa-danger, #D6483D); }
        .answer-feedback .fb-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
        .answer-feedback .fb-btn {
            border: 1px solid var(--pa-border, #E5E7EB);
            background: #fff;
            color: var(--pa-text-soft, #425466);
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 999px;
            cursor: pointer;
            transition: all .15s ease;
        }
        .answer-feedback .fb-btn:hover {
            border-color: var(--pa-primary, #635BFF);
            color: var(--pa-primary-700, #4F47D6);
            background: var(--pa-primary-soft, #F0EFFF);
        }
        /* 答案来源标注：AI 气泡末尾可展开看命中的文档片段 */
        .answer-sources {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(99, 91, 255, 0.12);
        }
        .src-header {
            font-size: 12px;
            color: var(--pa-primary, #635BFF);
            cursor: pointer;
            user-select: none;
            font-weight: 600;
        }
        .src-header:hover { opacity: 0.75; }
        .src-header::before { content: '📎 '; }
        .src-header::after { content: ' ▸'; font-size: 10px; }
        .src-header.src-expanded::after { content: ' ▾'; font-size: 10px; }
        .src-list { margin-top: 6px; display: none; }
        .src-item {
            margin-bottom: 6px;
            padding: 6px 8px;
            background: var(--pa-primary-soft, #F0EFFF);
            border-radius: 6px;
            font-size: 12px;
        }
        .src-title {
            color: var(--pa-text, #0A2540);
            font-weight: 600;
        }
        .src-score {
            margin-left: 8px;
            color: var(--pa-text-muted, #8898AA);
            font-weight: 400;
            font-size: 11px;
        }
        .src-chunk {
            margin-top: 4px;
            color: var(--pa-text-soft, #425466);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 991.98px) {
            .chat-header { padding: 12px 16px; font-size: 15px; }
            .chat-messages { padding: 16px; gap: 12px; }
            .chat-input-area { padding: 10px 14px; gap: 8px; }
            .chat-input-area button { padding: 12px 18px; }
            .message { max-width: 88%; padding: 11px 15px; }
        }
        @media (max-width: 575.98px) {
            .chat-input-area input { padding: 13px 18px; font-size: 15px; }
            .chat-input-area button { padding: 12px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('chat')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部栏 -->
        <div th:replace="~{fragments/layout :: topbar('💬 智能问答')}"></div>

        <!-- 配额提示：游客与「已登录非会员」共用一条，文案由 JS 区分；会员不显示 -->
        <div id="quotaBanner" class="guest-banner d-none">
            <i class="bi bi-info-circle"></i>
            <span id="quotaText">--</span>
            <a id="quotaLink" href="/login" class="btn btn-sm btn-primary ms-auto">登录后不限次数</a>
        </div>

        <!-- 聊天容器 -->
        <div class="chat-container">
            <div class="chat-header">
                🛒 采购智能助手
                <span class="badge">RAG · 天气 · 新闻</span>
                <button type="button" class="new-chat-btn" id="newChatBtn"
                        title="清空当前对话，重新开始">
                    <i class="bi bi-plus-lg"></i><span class="btn-text"> 发起新会话</span>
                </button>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="role-tag">🤖 助手</div>
                    <div class="content">您好！我是采购智能助手，支持文档上传、智能问答，还可以查询天气和AI新闻。试试问我：“深圳天气怎么样？”或“最近AI有什么新闻？”</div>
                    <div class="time" id="welcomeTime"></div>
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <span>🤖 正在思考...</span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="输入您的问题..." />
                <!-- 只在提问进行中出现。点它会中断本次请求 —— 服务端那条 SSE 链被取消后
                     会断开与 Ollama 的连接，模型真的停止生成，不只是前端不等了。 -->
                <button type="button" id="cancelBtn" class="d-none">取消</button>
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>
</div>

<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=5"></script>
<script>
    // ================================================================
    // 1. 认证：允许未登录使用（游客模式，按 IP 每日限额）
    // ================================================================
    const token = localStorage.getItem('token');
    // 没有 token 不再跳登录，改为游客模式；后端会在超限时返回提示
    const isGuest = !token;

    // 覆盖 fetch：有 token 才带 Authorization 头
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && (url.includes('/api/auth/') || url.includes('/login') || url.includes('/register'))) {
            return originalFetch.apply(this, args);
        }
        if (!token) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // 配额提示条。
    //
    // 三种人三种待遇（以前这里第一行是 `if (!isGuest) return;`，
    // 导致**已登录的非会员根本看不到自己还剩几次**）：
    //   游客            → 「游客模式 · 今日还可提问 N 次」+ 去登录
    //   已登录非会员    → 「非会员 · 今日还剩 N 次免费提问」+ 去开通会员
    //   有效会员        → 不显示（不限次，不打扰）
    async function refreshQuotaBanner() {
        const banner = document.getElementById('quotaBanner');
        if (!banner) return;
        try {
            const resp = await fetch('/api/rag/chat/quota');
            const data = await resp.json();
            if (!data.success) {
                banner.classList.add('d-none');
                return;
            }
            const q = data.data;

            // 会员不限次；免登录提问被关掉时也不显示
            if ((!q.anonymous && q.member) || !q.enabled) {
                banner.classList.add('d-none');
                return;
            }

            document.getElementById('quotaText').textContent = q.anonymous
                ? '游客模式 · 今日还可提问 ' + q.remaining + ' 次'
                : '非会员 · 今日还剩 ' + q.remaining + ' 次免费提问';

            const link = document.getElementById('quotaLink');
            if (q.anonymous) {
                link.textContent = '登录后不限次数';
                link.href = '/login';
            } else {
                link.textContent = '开通会员不限次';
                link.href = '/profile';
            }
            banner.classList.remove('d-none');
        } catch (err) {
            console.error('获取配额失败', err);
            banner.classList.add('d-none');
        }
    }
    refreshQuotaBanner();

    // ================================================================
    // 2. 工具函数（提前定义，供后续使用）
    // ================================================================
    function getCurrentTime() {
        return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setTyping(visible) {
        typingIndicator.classList.toggle('active', visible);
        scrollToBottom();
    }

    // ================================================================
    // 3. 消息操作（提前定义）
    // ================================================================
    function addMessage(role, content, sources) {
        const messagesContainer = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMsg = messagesContainer.querySelector('.message.ai:first-child');
        if (welcomeMsg && messagesContainer.children.length <= 2) {
            welcomeMsg.remove();
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;

        const roleTag = document.createElement('div');
        roleTag.className = 'role-tag';
        roleTag.textContent = role === 'user' ? '👤 我' : '🤖 助手';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.textContent = content;

        messageDiv.appendChild(roleTag);
        messageDiv.appendChild(contentDiv);

        // 答案来源标注：只在 AI 回答且有命中片段时渲染。兜底/工具调用等无检索路径
        // 不带 sources（undefined/null/空数组都跳过），前端就不会出现空的「来源」区。
        if (role === 'ai' && sources && sources.length) {
            messageDiv.appendChild(buildSourceBox(sources));
        }

        const timeDiv = document.createElement('div');
        timeDiv.className = 'time';
        timeDiv.textContent = getCurrentTime();

        messageDiv.appendChild(timeDiv);

        messagesContainer.insertBefore(messageDiv, typingIndicator);
        scrollToBottom();
        // 返回外层 .message 元素：评价控件要挂在它上面，不只是内容区
        return messageDiv;
    }

    /**
     * 构建答案来源标注区块：默认折叠，点击展开看每个命中片段的标题 + 相关度 + 原文。
     * 全程用 textContent 赋值，避免文档片段里的 HTML 被当成真的 HTML 执行（XSS）。
     */
    function buildSourceBox(sources) {
        const box = document.createElement('div');
        box.className = 'answer-sources';

        const header = document.createElement('div');
        header.className = 'src-header';
        header.textContent = '来源（' + sources.length + '）';

        const list = document.createElement('div');
        list.className = 'src-list';

        sources.forEach(function (s) {
            const item = document.createElement('div');
            item.className = 'src-item';

            const titleRow = document.createElement('div');
            titleRow.className = 'src-title';
            titleRow.textContent = '《' + (s.documentTitle || '未知文档') + '》';
            if (s.score != null) {
                const scoreSpan = document.createElement('span');
                scoreSpan.className = 'src-score';
                scoreSpan.textContent = '相关度 ' + (s.score * 100).toFixed(0) + '%';
                titleRow.appendChild(scoreSpan);
            }
            item.appendChild(titleRow);

            if (s.chunkText) {
                const chunkDiv = document.createElement('div');
                chunkDiv.className = 'src-chunk';
                chunkDiv.textContent = s.chunkText;
                item.appendChild(chunkDiv);
            }
            list.appendChild(item);
        });

        header.addEventListener('click', function () {
            const expanded = list.style.display === 'block';
            list.style.display = expanded ? 'none' : 'block';
            header.classList.toggle('src-expanded', !expanded);
        });

        box.appendChild(header);
        box.appendChild(list);
        return box;
    }

    // ================================================================
    // 答案评价
    // ================================================================
    let ratingOptions = null;   // 五档选项，首次加载后缓存

    async function loadRatingOptions() {
        if (isGuest || ratingOptions) return;
        try {
            const resp = await fetch('/api/feedback/options');
            const data = await resp.json();
            if (data.success) ratingOptions = data.data;
        } catch (err) {
            console.error('加载评价选项失败', err);
        }
    }
    loadRatingOptions();

    /**
     * 给一条 AI 回答挂上评价控件。
     *
     * 游客不挂：后端 /api/feedback 要求登录，挂上去点一下只会报错，
     * 不如干脆不显示。
     */
    function attachFeedbackWidget(messageDiv, question, answer, questionLogId) {
        if (isGuest || !messageDiv || !ratingOptions || !ratingOptions.length) return;
        if (messageDiv.querySelector('.answer-feedback')) return;   // 防重复挂

        const box = document.createElement('div');
        box.className = 'answer-feedback';

        const ask = document.createElement('span');
        ask.className = 'fb-ask';
        ask.textContent = '这个回答帮到你了吗？';
        box.appendChild(ask);

        const btnRow = document.createElement('div');
        btnRow.className = 'fb-buttons';
        ratingOptions.forEach(function (opt) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'fb-btn';
            btn.textContent = opt.label;
            btn.addEventListener('click', function () {
                submitRating(box, opt, question, answer, questionLogId);
            });
            btnRow.appendChild(btn);
        });
        box.appendChild(btnRow);

        messageDiv.appendChild(box);
        scrollToBottom();
    }

    async function submitRating(box, option, question, answer, questionLogId) {
        // 先收起按钮，避免重复点击
        box.innerHTML = '<span class="fb-ask">正在提交…</span>';

        // 低分档才追问原因 —— 打了"很有帮助"还弹框问哪里能改进是打扰
        let suggestion = null;
        if (option.needsSuggestion) {
            const r = await Swal.fire({
                title: '哪里可以做得更好？',
                input: 'textarea',
                inputPlaceholder: '比如：答非所问 / 信息过时 / 不够具体 / 有事实错误…\n（最多 800 字）',
                // 800 是产品定的上限。**前端的 maxlength 只是体验**：
                // 绕过它（改 JS、直接打接口）很容易，所以后端还有一道同样的校验。
                // DB 列是 VARCHAR(1000)，装得下，不需要 DDL。
                inputAttributes: { maxlength: 800 },
                showCancelButton: true,
                confirmButtonText: '提交',
                cancelButtonText: '跳过',
                inputValidator: function (v) {
                    if (!v || v.trim().length < 5) {
                        return '请至少写 5 个字，方便我们定位问题';
                    }
                    if (v.trim().length > 800) {
                        return '最多 800 字，请精简一下';
                    }
                    return undefined;
                }
            });
            if (r.isConfirmed && r.value) suggestion = r.value.trim();
        }

        try {
            const resp = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    questionLogId: questionLogId,
                    question: question,
                    answer: answer,
                    rating: option.value,
                    suggestion: suggestion
                })
            });
            const data = await resp.json();
            if (!data.success) {
                box.innerHTML = '<span class="fb-ask fb-error"></span>';
                box.firstChild.textContent = data.errMessage || '提交失败';
                return;
            }
            box.innerHTML = '<span class="fb-ask"></span>';
            box.firstChild.textContent = suggestion
                ? '已提交，感谢你的意见！被采纳后会获得积分奖励 🎁'
                : '已提交，谢谢！';
        } catch (err) {
            box.innerHTML = '<span class="fb-ask fb-error">提交失败，请稍后重试</span>';
        }
        scrollToBottom();
    }

    // ================================================================
    // 4. DOM 引用（在函数定义后）
    // ================================================================
    const messagesContainer = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // ================================================================
    // 5. 会话管理（全局变量）
    // ================================================================
    const urlParams = new URLSearchParams(window.location.search);
    let conversationId = urlParams.get('conversationId') || null;
    console.log('📌 初始 conversationId:', conversationId);

    /**
     * 记住服务端返回的会话 id。
     *
     * 两条路都要调：流式从 meta 帧拿、非流式从响应体的 conversationId 拿。
     * 之前**只有流式那条调了**，于是走工具/含 "AI" 的提问永远学不到会话 id，
     * 下一次提问会另起一个会话 —— 历史记录里就散成一堆。
     */
    function rememberConversationId(id) {
        if (!id) return;
        conversationId = id;
        // 同步到地址栏：刷新后仍能回到同一个会话
        const newUrl = new URL(window.location);
        newUrl.searchParams.set('conversationId', id);
        window.history.replaceState({}, '', newUrl);
        console.log('📌 获取到 conversationId:', id);
    }

    // ================================================================
    // 6. 加载历史消息（此时 addMessage 已定义）
    // ================================================================
    if (conversationId) {
        loadHistoryMessages(conversationId);
    }

    async function loadHistoryMessages(id) {
        try {
            const resp = await fetch(`/api/conversations/${id}`);
            if (!resp.ok) throw new Error('加载历史消息失败');
            const envelope = await resp.json();
            // 统一信封：会话实体在 data.data 里（以前整个 body 就是实体）
            const conv = envelope.data;
            if (conv && conv.messages) {
                conv.messages.forEach(msg => {
                    addMessage(msg.role === 'user' ? 'user' : 'ai', msg.content, msg.sources);
                });
            }
        } catch (err) {
            console.error('加载历史消息失败', err);
        }
    }

    // ================================================================
    // 7. 管理员菜单显示、当前用户、退出登录
    //    均由 /js/app.js 统一处理
    // ================================================================

    // ================================================================
    // 8. 聊天功能（发送消息等）
    // ================================================================
    let isProcessing = false;

    /**
     * 当前进行中请求的取消句柄。
     *
     * <p>两条提问路径（流式 / 非流式）都会在发起前换一个新的 AbortController。
     * abort() 之后 fetch 会以 AbortError 拒绝，同时浏览器断开连接 ——
     * 服务端那条 Flux 链随之被取消，WebClient 断开与 Ollama 的连接，模型真的停止生成。
     * 这才是"取消"能减轻服务器负载的原因，不只是前端不等了。
     */
    let currentAbort = null;

    function shouldUseTool(message) {
        const keywords = ['天气', '新闻', '热点', '气温', '预报', 'AI', '人工智能'];
        return keywords.some(k => message.includes(k));
    }

    async function sendBlocking(message) {
        let url = `/api/rag/chat?question=${encodeURIComponent(message)}`;
        if (conversationId) {
            url += `&conversationId=${conversationId}`;
        }
        // 这条路径（天气/新闻走工具调用）要等**两次**大模型往返，比流式还慢，
        // 但之前什么提示都没有 —— 用户点完发送就是干等。
        // 这里用独立的 typing-indicator（而不是气泡内占位）：本路径要拿到完整答案
        // 才建气泡，等待期间根本没有气泡可以放占位。
        setTyping(true);
        currentAbort = new AbortController();
        try {
            const response = await fetch(url, { signal: currentAbort.signal });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            // 统一信封：成功取 data.data.answer，失败取 errMessage
            if (data.success) {
                // 非流式路径也要接住会话 id（流式那条是从 meta 帧拿的）。
                // 不然走这条路的提问学不到会话 id，下一问会另起一个会话。
                rememberConversationId(data.data.conversationId);
                const aiDiv = addMessage('ai', data.data.answer, data.data.sources);
                attachFeedbackWidget(aiDiv, message, data.data.answer, data.data.questionLogId);
            } else {
                addMessage('ai', `❌ 出错了：${data.errMessage || '未知错误'}`);
            }
        } catch (error) {
            if (error.name === 'AbortError') {
                // 这条路径要拿到完整答案才建气泡，取消时什么都没有 ——
                // 补一句说明，否则用户点了取消屏幕上一点反应都没有
                console.log('🚫 用户取消了本次提问（非流式路径）');
                addMessage('ai', '（已取消）');
                return;
            }
            console.error('Blocking error:', error);
            addMessage('ai', `❌ 请求失败：${error.message}`);
        } finally {
            // 放 finally：中途抛异常时提示不能留在那里转
            setTyping(false);
        }
    }

    // ================================================================
    // 核心：流式发送 + meta 消息解析
    // ================================================================
    async function sendStreaming(message) {
        let url = `/api/rag/chat/stream?question=${encodeURIComponent(message)}`;
        if (conversationId) {
            url += `&conversationId=${conversationId}`;
        }
        console.log('📤 请求 URL:', url);

        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai';
        const roleTag = document.createElement('div');
        roleTag.className = 'role-tag';
        roleTag.textContent = '🤖 助手';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        // 先放"思考中"占位，第一个内容 chunk 会把它整块顶掉
        // （下面用的是 contentDiv.textContent = fullText，会覆盖所有子节点）。
        // 这一步是修"用户干等"的关键：从气泡出现到第一个字之间不能再是空白。
        contentDiv.innerHTML = '<span class="thinking">'
            + '<span class="dot"></span><span class="dot"></span><span class="dot"></span>'
            + '正在检索知识库并思考…</span>';
        const timeDiv = document.createElement('div');
        timeDiv.className = 'time';
        timeDiv.textContent = '';
        aiMessageDiv.appendChild(roleTag);
        aiMessageDiv.appendChild(contentDiv);
        aiMessageDiv.appendChild(timeDiv);
        messagesContainer.insertBefore(aiMessageDiv, typingIndicator);

        // 这里**不调 setTyping** —— 等待提示已经放在气泡内部了。
        // 两个同时开会让用户看到一个独立的"正在思考"加一个带占位的气泡，重复。
        // 那个独立指示器留给 sendBlocking 用（那条路没有提前建气泡）。
        // fullText 提到 try 外面：catch 里要用它把已收到的部分保住 ——
        // 用户取消时那份半截答案是唯一能给他看的东西
        let fullText = '';
        currentAbort = new AbortController();
        try {
            const response = await fetch(url, { signal: currentAbort.signal });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let hasReceivedData = false;
            // 由 meta 帧带回来，评价时用它关联这次提问
            let currentQuestionLogId = null;
            // 由 meta 帧带回来，答案来源标注。流结束后渲染到气泡末尾 ——
            // 流式过程中插入会打断逐字效果，等流完了再挂上去。
            let currentSources = null;
            const startTime = new Date();

            // 按 SSE 规范解析：事件以空行分隔，同一事件内的多个 data: 行用 \n 连接。
            // 关键：只去掉 data: 之后的一个前导空格，绝不能 trim() —— 那会吃掉 token
            // 的首尾空格（英文会出现 helloworld 连字），并把纯空白 chunk 整个丢掉。
            // 内容里的换行会被服务端转义成额外的 data: 行，靠上面的 \n 连接还原。
            const handleEvent = (rawEvent) => {
                const dataLines = [];
                for (const line of rawEvent.split('\n')) {
                    if (!line.startsWith('data:')) continue;
                    let v = line.substring(5);
                    if (v.startsWith(' ')) v = v.substring(1);
                    dataLines.push(v);
                }
                if (dataLines.length === 0) return;

                const data = dataLines.join('\n');
                if (data === '[DONE]') return;

                // meta 帧：只用来取元信息，绝不显示在聊天界面
                if (data.startsWith('{')) {
                    try {
                        const parsed = JSON.parse(data);
                        // 判定条件只看 type。以前还要求 conversationId 非空，
                        // 而匿名提问时它是 null —— 于是 meta 帧会掉到下面当正文渲染，
                        // 用户就会看到一坨 JSON。
                        if (parsed.type === 'meta') {
                            if (parsed.conversationId) {
                                rememberConversationId(parsed.conversationId);
                            }
                            // 评价要挂到这次提问上，靠它关联
                            if (parsed.questionLogId) {
                                currentQuestionLogId = parsed.questionLogId;
                            }
                            // 答案来源标注：meta 帧在回答流之前发出，先存着
                            if (parsed.sources && parsed.sources.length) {
                                currentSources = parsed.sources;
                            }
                            return;
                        }
                    } catch (_) {
                        // 不是合法 JSON，按普通文本处理
                    }
                }

                if (!hasReceivedData) {
                    hasReceivedData = true;
                    timeDiv.textContent = startTime.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                }
                fullText += data;
                contentDiv.textContent = fullText;
                scrollToBottom();
            };

            const feed = (text) => {
                // 统一换行，避免 \r\n 正好被 chunk 边界切成两半
                buffer = (buffer + text).replace(/\r\n/g, '\n');
                let idx;
                while ((idx = buffer.indexOf('\n\n')) !== -1) {
                    const rawEvent = buffer.slice(0, idx);
                    buffer = buffer.slice(idx + 2);
                    handleEvent(rawEvent);
                }
            };

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                feed(decoder.decode(value, { stream: true }));
            }
            feed(decoder.decode());                  // flush 解码器残留
            if (buffer.trim()) handleEvent(buffer);  // 末尾缺少空行时的兜底

            if (!hasReceivedData) {
                contentDiv.textContent = '⚠️ 未收到有效回复，请重试。';
                timeDiv.textContent = getCurrentTime();
            } else {
                attachFeedbackWidget(aiMessageDiv, message, fullText, currentQuestionLogId);
                // 答案来源标注：流结束后渲染，避免打断逐字生成
                if (currentSources && currentSources.length) {
                    aiMessageDiv.insertBefore(buildSourceBox(currentSources), timeDiv);
                }
            }

            scrollToBottom();

        } catch (error) {
            if (error.name === 'AbortError') {
                // 用户主动取消。**不是错误** —— 别弹"发送失败"，那会让人以为出了问题。
                // 把已经收到的部分保留下来并标注，否则用户点了取消看到气泡变空会更困惑。
                console.log('🚫 用户取消了本次提问');
                // 不调 setTyping：取消按钮只在流式路径里没有独立指示器，
                // 而且 setTyping(false) 在这儿是空操作（本来就没开）
                contentDiv.textContent = fullText
                    ? fullText + '\n\n（已取消）'
                    : '（已取消）';
                timeDiv.textContent = getCurrentTime();
                scrollToBottom();
                return;
            }
            console.error('Stream error:', error);
            setTyping(false);
            contentDiv.textContent = '❌ 抱歉，发生了错误：' + error.message;
            timeDiv.textContent = getCurrentTime();
            scrollToBottom();
        }
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || isProcessing) return;

        isProcessing = true;
        messageInput.value = '';
        sendBtn.disabled = true;
        messageInput.disabled = true;
        cancelBtn.classList.remove('d-none');

        addMessage('user', message);

        try {
            if (shouldUseTool(message)) {
                await sendBlocking(message);
            } else {
                await sendStreaming(message);
            }
        } catch (error) {
            console.error('Send error:', error);
            addMessage('ai', `❌ 发送失败：${error.message}`);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            messageInput.disabled = false;
            // 取消按钮收起、句柄清空。**必须放在 finally**：取消路径也会走到这里，
            // 漏了的话按钮会一直挂在那儿，下一次提问前就出现两个"取消"。
            cancelBtn.classList.add('d-none');
            cancelBtn.disabled = false;   // 复位：上一次可能点过取消把它禁用了
            currentAbort = null;
            messageInput.focus();
            // 每次问完刷新剩余次数（游客与非会员都适用）
            refreshQuotaBanner();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 取消进行中的提问。
    // 这里只负责发出中断信号，善后由两条路径各自的 catch (AbortError) 做 ——
    // 它们的收尾方式不同（流式保住半截答案，非流式什么都没有）。
    cancelBtn.addEventListener('click', function () {
        if (!currentAbort) return;
        console.log('🚫 用户点了取消');
        // abort → fetch 以 AbortError 拒绝 → 浏览器断开连接 → 服务端 Flux 被取消
        // → WebClient 断开与 Ollama 的连接 → 模型停止生成。
        // 链路是通的，所以**不需要**服务端再做什么"主动杀推理"的动作。
        currentAbort.abort();
        cancelBtn.disabled = true;   // 防连点；下一次提问时会复位
    });

    // ================================================================
    // 11. 发起新会话
    // ================================================================
    // 先把欢迎语的原始 HTML 记下来：第一次提问时它会被 addMessage 移除，
    // 发起新会话时原样放回去 —— 否则清空后是一片空白，看着像页面坏了。
    // 必须在初始化最前面取，那时它一定还在。
    const welcomeHtml = (function () {
        const el = document.querySelector('#chatMessages .message.ai');
        return el ? el.outerHTML : '';
    })();

    document.getElementById('newChatBtn').addEventListener('click', function () {
        if (isProcessing) {
            Swal.fire('正在回答中', '等这次回答结束再开新会话吧', 'info');
            return;
        }
        // 只有已经在会话里才问一句。空会话上点一下也弹确认框很烦。
        if (conversationId && !confirm('清空当前对话，开始新的会话？')) return;
        startNewConversation();
    });

    function startNewConversation() {
        conversationId = null;
        // 把 URL 上的 conversationId 去掉 —— 留着的话刷新页面会又加载回旧会话
        const url = new URL(window.location);
        url.searchParams.delete('conversationId');
        window.history.replaceState({}, '', url);

        // 只清消息，typing 指示器是常驻元素，不能一起删
        const container = document.getElementById('chatMessages');
        container.querySelectorAll('.message').forEach(function (m) { m.remove(); });
        if (welcomeHtml) {
            container.insertAdjacentHTML('afterbegin', welcomeHtml);
            const wt = document.getElementById('welcomeTime');
            if (wt) wt.textContent = getCurrentTime();
        }

        setTyping(false);
        messageInput.value = '';
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
        scrollToBottom();
    }

    // ================================================================
    // 12. 初始化
    // ================================================================
    document.getElementById('welcomeTime').textContent = getCurrentTime();
    messageInput.focus();
</script>
</body>
</html>
