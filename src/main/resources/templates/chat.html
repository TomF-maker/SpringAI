<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购智能助手</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=2">
    <style>
        /* 聊天页专属：主内容区做成竖向 flex，让聊天框自适应填满视口高度。
           原先硬编码 calc(100vh - 140px)（顶栏高度），加了汉堡按钮后手机顶栏
           高度会变，容易把输入框挤出屏幕；用 100dvh + flex 更稳。 */
        .main-content {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }
        /* 游客提示条 */
        .guest-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff8e6;
            border: 1px solid #fde68a;
            color: #92400e;
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .guest-banner i { font-size: 16px; }
        .chat-container {
            width: 100%;
            max-width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }
        .chat-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-header .badge {
            background: rgba(255,255,255,0.2);
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 400;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .message.user {
            align-self: flex-end;
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message .role-tag {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .message.ai .role-tag { color: #1a73e8; }
        .message.user .role-tag { color: rgba(255,255,255,0.8); }
        .message .content { white-space: pre-wrap; }
        .message .time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .message.user .time { color: rgba(255,255,255,0.8); }
        .message.ai .time { color: #94a3b8; }
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid #e2e8f0;
            background: white;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area input:focus { border-color: #1a73e8; }
        .chat-input-area button {
            padding: 12px 28px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input-area button:hover { background: #1557b0; }
        .chat-input-area button:disabled { background: #94a3b8; cursor: not-allowed; }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 14px;
        }
        .typing-indicator.active { display: block; }

        /* ---------- 答案评价控件 ---------- */
        .answer-feedback {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #e2e8f0;
        }
        .answer-feedback .fb-ask {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            color: #94a3b8;
        }
        .answer-feedback .fb-ask.fb-error { color: #dc3545; }
        .answer-feedback .fb-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
        .answer-feedback .fb-btn {
            border: 1px solid #dbe3ec;
            background: #fff;
            color: #475569;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 14px;
            cursor: pointer;
            transition: border-color .15s, color .15s, background .15s;
        }
        .answer-feedback .fb-btn:hover {
            border-color: #1a73e8;
            color: #1a73e8;
            background: #f4f8ff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 991.98px) {
            .chat-header { padding: 12px 16px; font-size: 16px; }
            .chat-messages { padding: 14px 16px; }
            .chat-input-area { padding: 12px 16px; gap: 8px; }
            .chat-input-area button { padding: 12px 20px; }
            .message { max-width: 88%; }
        }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('chat')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部栏 -->
        <div th:replace="~{fragments/layout :: topbar('💬 智能问答')}"></div>

        <!-- 配额提示：游客与「已登录非会员」共用一条，文案由 JS 区分；会员不显示 -->
        <div id="quotaBanner" class="guest-banner d-none">
            <i class="bi bi-info-circle"></i>
            <span id="quotaText">--</span>
            <a id="quotaLink" href="/login" class="btn btn-sm btn-primary ms-auto">登录后不限次数</a>
        </div>

        <!-- 聊天容器 -->
        <div class="chat-container">
            <div class="chat-header">
                🛒 采购智能助手
                <span class="badge">RAG · 天气 · 新闻</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="role-tag">🤖 助手</div>
                    <div class="content">您好！我是采购智能助手，支持文档上传、智能问答，还可以查询天气和AI新闻。试试问我：“深圳天气怎么样？”或“最近AI有什么新闻？”</div>
                    <div class="time" id="welcomeTime"></div>
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <span>🤖 正在思考...</span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="输入您的问题..." />
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>
</div>

<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=2"></script>
<script>
    // ================================================================
    // 1. 认证：允许未登录使用（游客模式，按 IP 每日限额）
    // ================================================================
    const token = localStorage.getItem('token');
    // 没有 token 不再跳登录，改为游客模式；后端会在超限时返回提示
    const isGuest = !token;

    // 覆盖 fetch：有 token 才带 Authorization 头
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && (url.includes('/api/auth/') || url.includes('/login') || url.includes('/register'))) {
            return originalFetch.apply(this, args);
        }
        if (!token) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // 配额提示条。
    //
    // 三种人三种待遇（以前这里第一行是 `if (!isGuest) return;`，
    // 导致**已登录的非会员根本看不到自己还剩几次**）：
    //   游客            → 「游客模式 · 今日还可提问 N 次」+ 去登录
    //   已登录非会员    → 「非会员 · 今日还剩 N 次免费提问」+ 去开通会员
    //   有效会员        → 不显示（不限次，不打扰）
    async function refreshQuotaBanner() {
        const banner = document.getElementById('quotaBanner');
        if (!banner) return;
        try {
            const resp = await fetch('/api/rag/chat/quota');
            const data = await resp.json();
            if (!data.success) {
                banner.classList.add('d-none');
                return;
            }
            const q = data.data;

            // 会员不限次；免登录提问被关掉时也不显示
            if ((!q.anonymous && q.member) || !q.enabled) {
                banner.classList.add('d-none');
                return;
            }

            document.getElementById('quotaText').textContent = q.anonymous
                ? '游客模式 · 今日还可提问 ' + q.remaining + ' 次'
                : '非会员 · 今日还剩 ' + q.remaining + ' 次免费提问';

            const link = document.getElementById('quotaLink');
            if (q.anonymous) {
                link.textContent = '登录后不限次数';
                link.href = '/login';
            } else {
                link.textContent = '开通会员不限次';
                link.href = '/profile';
            }
            banner.classList.remove('d-none');
        } catch (err) {
            console.error('获取配额失败', err);
            banner.classList.add('d-none');
        }
    }
    refreshQuotaBanner();

    // ================================================================
    // 2. 工具函数（提前定义，供后续使用）
    // ================================================================
    function getCurrentTime() {
        return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setTyping(visible) {
        typingIndicator.classList.toggle('active', visible);
        scrollToBottom();
    }

    // ================================================================
    // 3. 消息操作（提前定义）
    // ================================================================
    function addMessage(role, content) {
        const messagesContainer = document.getElementById('chatMessages');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcomeMsg = messagesContainer.querySelector('.message.ai:first-child');
        if (welcomeMsg && messagesContainer.children.length <= 2) {
            welcomeMsg.remove();
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;

        const roleTag = document.createElement('div');
        roleTag.className = 'role-tag';
        roleTag.textContent = role === 'user' ? '👤 我' : '🤖 助手';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.textContent = content;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'time';
        timeDiv.textContent = getCurrentTime();

        messageDiv.appendChild(roleTag);
        messageDiv.appendChild(contentDiv);
        messageDiv.appendChild(timeDiv);

        messagesContainer.insertBefore(messageDiv, typingIndicator);
        scrollToBottom();
        // 返回外层 .message 元素：评价控件要挂在它上面，不只是内容区
        return messageDiv;
    }

    // ================================================================
    // 答案评价
    // ================================================================
    let ratingOptions = null;   // 五档选项，首次加载后缓存

    async function loadRatingOptions() {
        if (isGuest || ratingOptions) return;
        try {
            const resp = await fetch('/api/feedback/options');
            const data = await resp.json();
            if (data.success) ratingOptions = data.data;
        } catch (err) {
            console.error('加载评价选项失败', err);
        }
    }
    loadRatingOptions();

    /**
     * 给一条 AI 回答挂上评价控件。
     *
     * 游客不挂：后端 /api/feedback 要求登录，挂上去点一下只会报错，
     * 不如干脆不显示。
     */
    function attachFeedbackWidget(messageDiv, question, answer, questionLogId) {
        if (isGuest || !messageDiv || !ratingOptions || !ratingOptions.length) return;
        if (messageDiv.querySelector('.answer-feedback')) return;   // 防重复挂

        const box = document.createElement('div');
        box.className = 'answer-feedback';

        const ask = document.createElement('span');
        ask.className = 'fb-ask';
        ask.textContent = '这个回答帮到你了吗？';
        box.appendChild(ask);

        const btnRow = document.createElement('div');
        btnRow.className = 'fb-buttons';
        ratingOptions.forEach(function (opt) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'fb-btn';
            btn.textContent = opt.label;
            btn.addEventListener('click', function () {
                submitRating(box, opt, question, answer, questionLogId);
            });
            btnRow.appendChild(btn);
        });
        box.appendChild(btnRow);

        messageDiv.appendChild(box);
        scrollToBottom();
    }

    async function submitRating(box, option, question, answer, questionLogId) {
        // 先收起按钮，避免重复点击
        box.innerHTML = '<span class="fb-ask">正在提交…</span>';

        // 低分档才追问原因 —— 打了"很有帮助"还弹框问哪里能改进是打扰
        let suggestion = null;
        if (option.needsSuggestion) {
            const r = await Swal.fire({
                title: '哪里可以做得更好？',
                input: 'textarea',
                inputPlaceholder: '比如：答非所问 / 信息过时 / 不够具体 / 有事实错误…',
                inputAttributes: { maxlength: 1000 },
                showCancelButton: true,
                confirmButtonText: '提交',
                cancelButtonText: '跳过',
                inputValidator: function (v) {
                    return (!v || v.trim().length < 5) ? '请至少写 5 个字，方便我们定位问题' : undefined;
                }
            });
            if (r.isConfirmed && r.value) suggestion = r.value.trim();
        }

        try {
            const resp = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    questionLogId: questionLogId,
                    question: question,
                    answer: answer,
                    rating: option.value,
                    suggestion: suggestion
                })
            });
            const data = await resp.json();
            if (!data.success) {
                box.innerHTML = '<span class="fb-ask fb-error"></span>';
                box.firstChild.textContent = data.errMessage || '提交失败';
                return;
            }
            box.innerHTML = '<span class="fb-ask"></span>';
            box.firstChild.textContent = suggestion
                ? '已提交，感谢你的意见！被采纳后会获得积分奖励 🎁'
                : '已提交，谢谢！';
        } catch (err) {
            box.innerHTML = '<span class="fb-ask fb-error">提交失败，请稍后重试</span>';
        }
        scrollToBottom();
    }

    // ================================================================
    // 4. DOM 引用（在函数定义后）
    // ================================================================
    const messagesContainer = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // ================================================================
    // 5. 会话管理（全局变量）
    // ================================================================
    const urlParams = new URLSearchParams(window.location.search);
    let conversationId = urlParams.get('conversationId') || null;
    console.log('📌 初始 conversationId:', conversationId);

    // ================================================================
    // 6. 加载历史消息（此时 addMessage 已定义）
    // ================================================================
    if (conversationId) {
        loadHistoryMessages(conversationId);
    }

    async function loadHistoryMessages(id) {
        try {
            const resp = await fetch(`/api/conversations/${id}`);
            if (!resp.ok) throw new Error('加载历史消息失败');
            const envelope = await resp.json();
            // 统一信封：会话实体在 data.data 里（以前整个 body 就是实体）
            const conv = envelope.data;
            if (conv && conv.messages) {
                conv.messages.forEach(msg => {
                    addMessage(msg.role === 'user' ? 'user' : 'ai', msg.content);
                });
            }
        } catch (err) {
            console.error('加载历史消息失败', err);
        }
    }

    // ================================================================
    // 7. 管理员菜单显示、当前用户、退出登录
    //    均由 /js/app.js 统一处理
    // ================================================================

    // ================================================================
    // 8. 聊天功能（发送消息等）
    // ================================================================
    let isProcessing = false;

    function shouldUseTool(message) {
        const keywords = ['天气', '新闻', '热点', '气温', '预报', 'AI', '人工智能'];
        return keywords.some(k => message.includes(k));
    }

    async function sendBlocking(message) {
        let url = `/api/rag/chat?question=${encodeURIComponent(message)}`;
        if (conversationId) {
            url += `&conversationId=${conversationId}`;
        }
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            // 统一信封：成功取 data.data.answer，失败取 errMessage
            if (data.success) {
                const aiDiv = addMessage('ai', data.data.answer);
                attachFeedbackWidget(aiDiv, message, data.data.answer, data.data.questionLogId);
            } else {
                addMessage('ai', `❌ 出错了：${data.errMessage || '未知错误'}`);
            }
        } catch (error) {
            console.error('Blocking error:', error);
            addMessage('ai', `❌ 请求失败：${error.message}`);
        }
    }

    // ================================================================
    // 核心：流式发送 + meta 消息解析
    // ================================================================
    async function sendStreaming(message) {
        let url = `/api/rag/chat/stream?question=${encodeURIComponent(message)}`;
        if (conversationId) {
            url += `&conversationId=${conversationId}`;
        }
        console.log('📤 请求 URL:', url);

        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai';
        const roleTag = document.createElement('div');
        roleTag.className = 'role-tag';
        roleTag.textContent = '🤖 助手';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.textContent = '';
        const timeDiv = document.createElement('div');
        timeDiv.className = 'time';
        timeDiv.textContent = '';
        aiMessageDiv.appendChild(roleTag);
        aiMessageDiv.appendChild(contentDiv);
        aiMessageDiv.appendChild(timeDiv);
        messagesContainer.insertBefore(aiMessageDiv, typingIndicator);

        setTyping(true);

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            setTyping(false);

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let fullText = '';
            let hasReceivedData = false;
            // 由 meta 帧带回来，评价时用它关联这次提问
            let currentQuestionLogId = null;
            const startTime = new Date();

            // 按 SSE 规范解析：事件以空行分隔，同一事件内的多个 data: 行用 \n 连接。
            // 关键：只去掉 data: 之后的一个前导空格，绝不能 trim() —— 那会吃掉 token
            // 的首尾空格（英文会出现 helloworld 连字），并把纯空白 chunk 整个丢掉。
            // 内容里的换行会被服务端转义成额外的 data: 行，靠上面的 \n 连接还原。
            const handleEvent = (rawEvent) => {
                const dataLines = [];
                for (const line of rawEvent.split('\n')) {
                    if (!line.startsWith('data:')) continue;
                    let v = line.substring(5);
                    if (v.startsWith(' ')) v = v.substring(1);
                    dataLines.push(v);
                }
                if (dataLines.length === 0) return;

                const data = dataLines.join('\n');
                if (data === '[DONE]') return;

                // meta 帧：只用来取元信息，绝不显示在聊天界面
                if (data.startsWith('{')) {
                    try {
                        const parsed = JSON.parse(data);
                        // 判定条件只看 type。以前还要求 conversationId 非空，
                        // 而匿名提问时它是 null —— 于是 meta 帧会掉到下面当正文渲染，
                        // 用户就会看到一坨 JSON。
                        if (parsed.type === 'meta') {
                            if (parsed.conversationId) {
                                conversationId = parsed.conversationId;
                                // 更新 URL 参数（刷新页面后保留）
                                const newUrl = new URL(window.location);
                                newUrl.searchParams.set('conversationId', conversationId);
                                window.history.replaceState({}, '', newUrl);
                                console.log('📌 获取到 conversationId:', conversationId);
                            }
                            // 评价要挂到这次提问上，靠它关联
                            if (parsed.questionLogId) {
                                currentQuestionLogId = parsed.questionLogId;
                            }
                            return;
                        }
                    } catch (_) {
                        // 不是合法 JSON，按普通文本处理
                    }
                }

                if (!hasReceivedData) {
                    hasReceivedData = true;
                    timeDiv.textContent = startTime.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                }
                fullText += data;
                contentDiv.textContent = fullText;
                scrollToBottom();
            };

            const feed = (text) => {
                // 统一换行，避免 \r\n 正好被 chunk 边界切成两半
                buffer = (buffer + text).replace(/\r\n/g, '\n');
                let idx;
                while ((idx = buffer.indexOf('\n\n')) !== -1) {
                    const rawEvent = buffer.slice(0, idx);
                    buffer = buffer.slice(idx + 2);
                    handleEvent(rawEvent);
                }
            };

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                feed(decoder.decode(value, { stream: true }));
            }
            feed(decoder.decode());                  // flush 解码器残留
            if (buffer.trim()) handleEvent(buffer);  // 末尾缺少空行时的兜底

            if (!hasReceivedData) {
                contentDiv.textContent = '⚠️ 未收到有效回复，请重试。';
                timeDiv.textContent = getCurrentTime();
            } else {
                attachFeedbackWidget(aiMessageDiv, message, fullText, currentQuestionLogId);
            }

            scrollToBottom();

        } catch (error) {
            console.error('Stream error:', error);
            setTyping(false);
            contentDiv.textContent = '❌ 抱歉，发生了错误：' + error.message;
            timeDiv.textContent = getCurrentTime();
            scrollToBottom();
        }
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || isProcessing) return;

        isProcessing = true;
        messageInput.value = '';
        sendBtn.disabled = true;
        messageInput.disabled = true;

        addMessage('user', message);

        try {
            if (shouldUseTool(message)) {
                await sendBlocking(message);
            } else {
                await sendStreaming(message);
            }
        } catch (error) {
            console.error('Send error:', error);
            addMessage('ai', `❌ 发送失败：${error.message}`);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
            // 每次问完刷新剩余次数（游客与非会员都适用）
            refreshQuotaBanner();
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ================================================================
    // 11. 初始化
    // ================================================================
    document.getElementById('welcomeTime').textContent = getCurrentTime();
    messageInput.focus();
</script>
</body>
</html>
