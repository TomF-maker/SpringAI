<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购智能助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
        }
        .chat-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px 24px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-header .badge {
            background: rgba(255,255,255,0.2);
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 400;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .message.user {
            align-self: flex-end;
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message .role-tag {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .message.ai .role-tag { color: #1a73e8; }
        .message.user .role-tag { color: rgba(255,255,255,0.8); }
        .message .content {
            white-space: pre-wrap;
        }
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid #e2e8f0;
            background: white;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .chat-input-area input:focus {
            border-color: #1a73e8;
        }
        .chat-input-area button {
            padding: 12px 28px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input-area button:hover {
            background: #1557b0;
        }
        .chat-input-area button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 14px;
        }
        .typing-indicator.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-message {
            align-self: center;
            color: #dc2626;
            font-size: 13px;
            padding: 8px 16px;
            background: #fee2e2;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🛒 采购智能助手
        <span class="badge">本地 LLM · qwen2:7b</span>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message ai">
            <div class="role-tag">🤖 助手</div>
            <div class="content">您好！我是采购智能助手，可以帮您解答供应商管理、价格分析、合同审查等方面的问题。有什么可以帮您的吗？</div>
        </div>
        <div class="typing-indicator" id="typingIndicator">
            <span>🤖 正在思考...</span>
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="输入您的问题..." />
        <button id="sendBtn">发送</button>
    </div>
</div>

<script>
    // ===== DOM 引用 =====
    const messagesContainer = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // 用当前时间戳作为会话ID（简单实现，生产环境建议用真正的会话管理）
    let sessionId = Date.now().toString();

    // ===== 核心函数 =====
    function addMessage(role, content) {
        // 移除欢迎消息（如果是第一条）
        const welcomeMsg = messagesContainer.querySelector('.message.ai:first-child');
        if (welcomeMsg && messagesContainer.children.length <= 2) {
            welcomeMsg.remove();
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;

        const roleTag = document.createElement('div');
        roleTag.className = 'role-tag';
        roleTag.textContent = role === 'user' ? '👤 我' : '🤖 助手';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.textContent = content;

        messageDiv.appendChild(roleTag);
        messageDiv.appendChild(contentDiv);

        // 把打字指示器插到新消息前面
        messagesContainer.insertBefore(messageDiv, typingIndicator);
        scrollToBottom();
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setTyping(visible) {
        typingIndicator.classList.toggle('active', visible);
        scrollToBottom();
    }

    // ===== 发送消息 =====
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        // 1. 清空输入框并禁用按钮
        messageInput.value = '';
        sendBtn.disabled = true;
        messageInput.disabled = true;

        // 2. 显示用户消息
        addMessage('user', message);

        // 3. 显示打字状态
        setTyping(true);

        try {
            // 4. 调用后端API
            const url = `/ai/memory?sessionId=${encodeURIComponent(sessionId)}&message=${encodeURIComponent(message)}`;
            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const aiResponse = await response.text();

            // 5. 移除打字状态，显示AI回复
            setTyping(false);
            addMessage('ai', aiResponse);

        } catch (error) {
            console.error('Error:', error);
            setTyping(false);
            addMessage('ai', '❌ 抱歉，发生了错误：' + error.message);
        } finally {
            // 6. 恢复输入框
            sendBtn.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
        }
    }

    // ===== 事件绑定 =====
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ===== 初始化 =====
    messageInput.focus();
</script>

</body>
</html>
