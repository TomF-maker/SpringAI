<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>采购智能助手</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
        }
        /* 侧边栏 */
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: #1a1a2e;
            color: #fff;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar-brand {
            padding: 0 20px 20px;
            font-size: 20px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-brand i { margin-right: 10px; }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 10px 20px;
            border-radius: 0;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content {
            margin-left: 220px;
            flex: 1;
            padding: 20px;
            min-height: 100vh;
        }
        /* 顶部栏 */
        .topbar {
            background: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar .user-info { font-size: 14px; }
        .topbar .user-info i { margin-right: 6px; }
        .topbar .logout-btn { cursor: pointer; color: #dc3545; text-decoration: none; }
        /* 聊天容器（原风格） */
        .chat-container {
            width: 100%;
            max-width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 140px);
        }
        .chat-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }
        .chat-header .badge {
            background: rgba(255,255,255,0.2);
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 400;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .message.user {
            align-self: flex-end;
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message .role-tag {
            font-size: 11px;
            font-weight: 600;
            opacity: 0.7;
            margin-bottom: 4px;
        }
        .message.ai .role-tag { color: #1a73e8; }
        .message.user .role-tag { color: rgba(255,255,255,0.8); }
        .message .content { white-space: pre-wrap; }
        .message .time {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .message.user .time { color: rgba(255,255,255,0.8); }
        .message.ai .time { color: #94a3b8; }
        .chat-input-area {
            padding: 16px 24px;
            border-top: 1px solid #e2e8f0;
            background: white;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area input:focus { border-color: #1a73e8; }
        .chat-input-area button {
            padding: 12px 28px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input-area button:hover { background: #1557b0; }
        .chat-input-area button:disabled { background: #94a3b8; cursor: not-allowed; }
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: white;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            color: #64748b;
            font-size: 14px;
        }
        .typing-indicator.active { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 上传区域 */
        .upload-area {
            padding: 12px 24px;
            border-top: 1px solid #e2e8f0;
            background: #fafbfc;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .upload-area input[type="file"] { display: none; }
        .upload-area .file-label {
            padding: 6px 16px;
            background: #e8edf4;
            border-radius: 20px;
            font-size: 13px;
            color: #1a73e8;
            cursor: pointer;
        }
        .upload-area .file-label:hover { background: #d5dde8; }
        .upload-area .file-status {
            font-size: 13px;
            color: #64748b;
            flex: 1;
            min-width: 80px;
        }
        .upload-area .upload-btn {
            padding: 6px 20px;
            background: #34a853;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
        }
        .upload-area .upload-btn:hover { background: #2d8f47; }
        .upload-area .upload-btn:disabled { background: #94a3b8; }
        .upload-progress {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #1a73e8;
            flex: 1;
            min-width: 150px;
        }
        .upload-progress .progress-bar {
            flex: 1;
            height: 6px;
            background: #e0e7ef;
            border-radius: 3px;
            overflow: hidden;
            min-width: 60px;
        }
        .upload-progress .progress-bar .fill {
            height: 100%;
            background: #1a73e8;
            width: 0%;
            transition: width 0.3s ease;
        }
        .upload-progress .progress-text { white-space: nowrap; font-size: 12px; }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-brand span, .sidebar .nav-link span { display: none; }
            .sidebar .nav-link { text-align: center; padding: 12px 0; }
            .sidebar .nav-link i { margin-right: 0; font-size: 20px; }
            .main-content { margin-left: 60px; padding: 12px; }
            .chat-container { height: calc(100vh - 120px); }
            .topbar { padding: 8px 16px; }
        }
        /* 工具调用标签 */
        .tool-tag {
            display: inline-block;
            font-size: 11px;
            background: #e8edf4;
            padding: 0 8px;
            border-radius: 10px;
            color: #1a73e8;
            margin-right: 6px;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <!-- 侧边栏 -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-cart3"></i> <span>采购助手</span>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="/chat"><i class="bi bi-chat-dots"></i> <span>智能问答</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/documents"><i class="bi bi-file-earmark-text"></i> <span>文档管理</span></a>
            </li>
            <li class="nav-item" id="userMgmtNav" style="display:none;">
                <a class="nav-link" href="/users"><i class="bi bi-people"></i> <span>用户管理</span></a>
            </li>
            <li class="nav-item" id="deptMgmtNav" style="display:none;">
                <a class="nav-link" href="/departments"><i class="bi bi-diagram-3"></i> <span>部门管理</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/profile"><i class="bi bi-person"></i> <span>个人中心</span></a>
            </li>
        </ul>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 顶部栏 -->
        <div class="topbar">
            <div>
                <span id="pageTitle">智能问答</span>
            </div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span id="currentUser">用户</span>
                <a href="#" class="logout-btn ms-3" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出</a>
            </div>
        </div>

        <!-- 聊天容器 -->
        <div class="chat-container">
            <div class="chat-header">
                🛒 采购智能助手
                <span class="badge">RAG · 天气 · 新闻</span>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message ai">
                    <div class="role-tag">🤖 助手</div>
                    <div class="content">您好！我是采购智能助手，支持文档上传、智能问答，还可以查询天气和AI新闻。试试问我：“深圳天气怎么样？”或“最近AI有什么新闻？”</div>
                    <div class="time" id="welcomeTime"></div>
                </div>
                <div class="typing-indicator" id="typingIndicator">
                    <span>🤖 正在思考...</span>
                </div>
            </div>

            <!-- 文件上传区域 -->
            <div class="upload-area">
                <label class="file-label" for="fileInput">📎 选择PDF/Word</label>
                <input type="file" id="fileInput" accept=".pdf,.doc,.docx" />
                <span class="file-status" id="fileStatus">未选择文件</span>
                <button class="upload-btn" id="uploadBtn">上传</button>
                <div class="upload-progress" id="uploadProgress">
                    <span class="progress-text" id="progressText"></span>
                    <span class="progress-bar"><span class="fill" id="progressFill"></span></span>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="输入您的问题..." />
                <button id="sendBtn">发送</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ================================================================
    // 认证拦截
    // ================================================================
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
    }

    // 为 fetch 请求自动添加 Authorization 头（排除 auth 相关接口）
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        // 如果是认证相关接口，不添加 Token
        if (typeof url === 'string' && (url.includes('/api/auth/') || url.includes('/login') || url.includes('/register'))) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // ================================================================
    // 显示用户信息
    // ================================================================
    const username = localStorage.getItem('realName') || localStorage.getItem('username');
    document.getElementById('currentUser').textContent = username;

    // 根据角色显示管理菜单（简单判断：admin）
    if (localStorage.getItem('username') === 'admin') {
        document.getElementById('userMgmtNav').style.display = 'block';
        document.getElementById('deptMgmtNav').style.display = 'block';
    }

    // 退出登录
    document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.clear();
        window.location.href = '/login';
    });

    // ================================================================
    // DOM 引用（聊天功能）
    // ================================================================
    const messagesContainer = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    const fileInput = document.getElementById('fileInput');
    const fileStatus = document.getElementById('fileStatus');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressText = document.getElementById('progressText');
    const progressFill = document.getElementById('progressFill');

    let isProcessing = false;
    let currentAbortController = null;

    // ================================================================
    // 工具函数
    // ================================================================
    function getCurrentTime() {
        return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setTyping(visible) {
        typingIndicator.classList.toggle('active', visible);
        scrollToBottom();
    }

    // ================================================================
    // 消息操作
    // ================================================================
    function addMessage(role, content) {
        const welcomeMsg = messagesContainer.querySelector('.message.ai:first-child');
        if (welcomeMsg && messagesContainer.children.length <= 2) {
            welcomeMsg.remove();
        }

        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;

        const roleTag = document.createElement('div');
        roleTag.className = 'role-tag';
        roleTag.textContent = role === 'user' ? '👤 我' : '🤖 助手';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.textContent = content;

        const timeDiv = document.createElement('div');
        timeDiv.className = 'time';
        timeDiv.textContent = getCurrentTime();

        messageDiv.appendChild(roleTag);
        messageDiv.appendChild(contentDiv);
        messageDiv.appendChild(timeDiv);

        messagesContainer.insertBefore(messageDiv, typingIndicator);
        scrollToBottom();
        return contentDiv;
    }

    // ================================================================
    // 文件上传
    // ================================================================
    fileInput.addEventListener('change', function() {
        if (this.files && this.files.length > 0) {
            fileStatus.textContent = `已选择: ${this.files[0].name} (${(this.files[0].size / 1024).toFixed(1)} KB)`;
        } else {
            fileStatus.textContent = '未选择文件';
        }
    });

    uploadBtn.addEventListener('click', async function() {
        const file = fileInput.files[0];
        if (!file) {
            alert('请先选择PDF或Word文件');
            return;
        }
        const name = file.name.toLowerCase();
        if (!(name.endsWith('.pdf') || name.endsWith('.doc') || name.endsWith('.docx'))) {
            alert('仅支持 PDF、DOC、DOCX 格式');
            return;
        }

        this.disabled = true;
        progressText.textContent = '⏳ 上传中...';
        progressFill.style.width = '0%';

        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.random() * 8 + 2;
            if (progress > 95) progress = 95;
            progressFill.style.width = progress + '%';
        }, 150);

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/api/documents/upload', {
                method: 'POST',
                body: formData
            });
            clearInterval(interval);
            const result = await response.json();

            if (result.success) {
                progressFill.style.width = '100%';
                progressText.textContent = `✅ 成功 (${result.chunkCount} 片段)`;
                fileStatus.textContent = `已上传: ${result.fileName}`;
                addMessage('ai', `📚 文档《${result.fileName}》已上传并处理完成，共 ${result.chunkCount} 个文档片段已存入知识库。您现在可以基于这份文档提问了。`);
            } else {
                progressText.textContent = `❌ 失败: ${result.message}`;
                addMessage('ai', `❌ 文档上传失败：${result.message}`);
            }
        } catch (error) {
            clearInterval(interval);
            console.error('Upload error:', error);
            progressText.textContent = '❌ 网络错误，请重试';
            addMessage('ai', `❌ 上传请求失败：${error.message}`);
        } finally {
            this.disabled = false;
            fileInput.value = '';
            setTimeout(() => {
                progressText.textContent = '';
                progressFill.style.width = '0%';
            }, 5000);
        }
    });

    // ================================================================
    // 判断是否需要使用工具（阻塞式）
    // ================================================================
    function shouldUseTool(message) {
        const keywords = ['天气', '新闻', '热点', '气温', '预报', 'AI', '人工智能'];
        return keywords.some(k => message.includes(k));
    }

    // ================================================================
    // 阻塞式发送（用于工具调用）
    // ================================================================
    async function sendBlocking(message) {
        const url = `/api/rag/chat?question=${encodeURIComponent(message)}`;
        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (data.success) {
                addMessage('ai', data.answer);
            } else {
                addMessage('ai', `❌ 出错了：${data.answer || '未知错误'}`);
            }
        } catch (error) {
            console.error('Blocking error:', error);
            addMessage('ai', `❌ 请求失败：${error.message}`);
        }
    }

    // ================================================================
    // 流式发送（用于RAG文档问答）
    // ================================================================
    async function sendStreaming(message) {
        const aiMessageDiv = document.createElement('div');
        aiMessageDiv.className = 'message ai';
        const roleTag = document.createElement('div');
        roleTag.className = 'role-tag';
        roleTag.textContent = '🤖 助手';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'content';
        contentDiv.textContent = '';
        const timeDiv = document.createElement('div');
        timeDiv.className = 'time';
        timeDiv.textContent = '';
        aiMessageDiv.appendChild(roleTag);
        aiMessageDiv.appendChild(contentDiv);
        aiMessageDiv.appendChild(timeDiv);
        messagesContainer.insertBefore(aiMessageDiv, typingIndicator);

        setTyping(true);

        try {
            const url = `/api/rag/chat/stream?question=${encodeURIComponent(message)}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            setTyping(false);

            const reader = response.body.getReader();
            const decoder = new TextDecoder('utf-8');
            let buffer = '';
            let fullText = '';
            let hasReceivedData = false;
            const startTime = new Date();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split(/\r?\n/);
                buffer = lines.pop() || '';

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('data:')) {
                        let data = trimmed.substring(5).trim();
                        while (data.startsWith('data:')) {
                            data = data.substring(5).trim();
                        }
                        if (data === '[DONE]') continue;
                        if (data) {
                            if (!hasReceivedData) {
                                hasReceivedData = true;
                                timeDiv.textContent = startTime.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                            }
                            fullText += data;
                            contentDiv.textContent = fullText;
                            scrollToBottom();
                        }
                    }
                }
            }

            if (buffer.trim()) {
                const lines = buffer.trim().split(/\r?\n/);
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('data:')) {
                        let data = trimmed.substring(5).trim();
                        while (data.startsWith('data:')) {
                            data = data.substring(5).trim();
                        }
                        if (data === '[DONE]') continue;
                        if (data) {
                            if (!hasReceivedData) {
                                hasReceivedData = true;
                                timeDiv.textContent = getCurrentTime();
                            }
                            fullText += data;
                            contentDiv.textContent = fullText;
                            scrollToBottom();
                        }
                    }
                }
            }

            if (!hasReceivedData) {
                contentDiv.textContent = '⚠️ 未收到有效回复，请重试。';
                timeDiv.textContent = getCurrentTime();
            }

            scrollToBottom();

        } catch (error) {
            console.error('Stream error:', error);
            setTyping(false);
            contentDiv.textContent = '❌ 抱歉，发生了错误：' + error.message;
            timeDiv.textContent = getCurrentTime();
            scrollToBottom();
        }
    }

    // ================================================================
    // 发送消息入口
    // ================================================================
    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message || isProcessing) return;

        isProcessing = true;
        messageInput.value = '';
        sendBtn.disabled = true;
        messageInput.disabled = true;

        addMessage('user', message);

        try {
            if (shouldUseTool(message)) {
                await sendBlocking(message);
            } else {
                await sendStreaming(message);
            }
        } catch (error) {
            console.error('Send error:', error);
            addMessage('ai', `❌ 发送失败：${error.message}`);
        } finally {
            isProcessing = false;
            sendBtn.disabled = false;
            messageInput.disabled = false;
            messageInput.focus();
        }
    }

    // ================================================================
    // 事件绑定
    // ================================================================
    sendBtn.addEventListener('click', sendMessage);

    messageInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // ================================================================
    // 初始化
    // ================================================================
    document.getElementById('welcomeTime').textContent = getCurrentTime();
    messageInput.focus();
</script>

</body>
</html>
