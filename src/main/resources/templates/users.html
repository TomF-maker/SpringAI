<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: #1a1a2e;
            color: #fff;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar-brand { padding: 0 20px 20px; font-size: 20px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand i { margin-right: 10px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 0; transition: all 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,0.1); }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content { margin-left: 220px; flex: 1; padding: 20px; min-height: 100vh; }
        .topbar {
            background: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar .user-info { font-size: 14px; }
        .topbar .user-info i { margin-right: 6px; }
        .topbar .logout-btn { cursor: pointer; color: #dc3545; text-decoration: none; }
        .table-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .filter-bar .form-control, .filter-bar .form-select { width: auto; min-width: 150px; }
        .user-status { padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .user-status.active { background: #d4edda; color: #155724; }
        .user-status.inactive { background: #f8d7da; color: #721c24; }
        .action-btn { padding: 2px 12px; font-size: 12px; margin: 0 2px; }
        .role-badge { display: inline-block; background: #e8edf4; padding: 0 8px; border-radius: 10px; font-size: 11px; color: #1a73e8; margin: 1px; }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-brand span, .sidebar .nav-link span { display: none; }
            .sidebar .nav-link { text-align: center; padding: 12px 0; }
            .sidebar .nav-link i { margin-right: 0; font-size: 20px; }
            .main-content { margin-left: 60px; padding: 12px; }
            .filter-bar .form-control, .filter-bar .form-select { width: 100%; }
            .table-responsive { font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- ===== 侧边栏 ===== -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-cart3"></i> <span>采购助手</span>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/chat"><i class="bi bi-chat-dots"></i> <span>智能问答</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/documents"><i class="bi bi-file-earmark-text"></i> <span>文档管理</span></a></li>
            <li class="nav-item"><a class="nav-link active" href="/users"><i class="bi bi-people"></i> <span>用户管理</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/departments"><i class="bi bi-diagram-3"></i> <span>部门管理</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/profile"><i class="bi bi-person"></i> <span>个人中心</span></a></li>
        </ul>
    </div>

    <!-- ===== 主内容 ===== -->
    <div class="main-content">
        <div class="topbar">
            <div><span id="pageTitle">👥 用户管理</span></div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span id="currentUser">用户</span>
                <a href="#" class="logout-btn ms-3" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出</a>
            </div>
        </div>

        <!-- 用户表格 -->
        <div class="table-container">
            <div class="filter-bar">
                <input type="text" id="keyword" class="form-control" placeholder="🔍 搜索用户名/邮箱/姓名" style="flex:1; min-width:180px;">
                <select id="statusFilter" class="form-select">
                    <option value="">全部状态</option>
                    <option value="1">✅ 启用</option>
                    <option value="0">🚫 禁用</option>
                </select>
                <button class="btn btn-primary" id="searchBtn"><i class="bi bi-search"></i> 搜索</button>
                <button class="btn btn-outline-secondary" id="resetBtn"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width:60px;">ID</th>
                        <th>用户名</th>
                        <th>邮箱</th>
                        <th>姓名</th>
                        <th>部门</th>
                        <th>角色</th>
                        <th style="width:80px;">状态</th>
                        <th style="width:130px;">注册时间</th>
                        <th style="width:260px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="userTableBody">
                    <tr><td colspan="9" class="text-center text-muted py-4">⏳ 加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <nav aria-label="Page navigation" class="mt-3">
                <ul class="pagination justify-content-end" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<!-- ===== 分配角色模态框 ===== -->
<div class="modal fade" id="roleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-person-gear"></i> 分配角色</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="roleUserId">
                <p class="text-muted small">请选择要分配给该用户的角色：</p>
                <div id="roleCheckboxes"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" id="saveRolesBtn"><i class="bi bi-check2"></i> 保存</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ================================================================
    // 1. 认证检查
    // ================================================================
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
    }
    // 仅管理员可访问
    if (localStorage.getItem('username') !== 'admin') {
        alert('⚠️ 仅管理员可访问此页面');
        window.location.href = '/chat';
    }

    // ================================================================
    // 2. 全局 fetch 拦截器（自动携带 Token）
    // ================================================================
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && (
            url.includes('/api/auth/') ||
            url.includes('/login') ||
            url.includes('/register')
        )) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        const currentToken = localStorage.getItem('token');
        if (currentToken) {
            options.headers['Authorization'] = `Bearer ${currentToken}`;
        }
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // ================================================================
    // 3. 显示用户信息 & 退出
    // ================================================================
    document.getElementById('currentUser').textContent =
        localStorage.getItem('realName') || localStorage.getItem('username') || '用户';

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.clear();
        window.location.href = '/login';
    });

    // ================================================================
    // 4. 全局变量
    // ================================================================
    let currentPage = 1;
    const pageSize = 10;
    let totalPages = 1;
    let currentUserId = null;
    let roleModalInstance = null;

    // ================================================================
    // 5. 加载用户列表
    // ================================================================
    async function loadUsers(page = 1) {
        const keyword = document.getElementById('keyword').value.trim();
        const status = document.getElementById('statusFilter').value;
        const params = new URLSearchParams({
            page: page,
            size: pageSize
        });
        if (keyword) params.append('keyword', keyword);
        if (status) params.append('status', status);

        try {
            const resp = await fetch('/api/users?' + params.toString());
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.success) throw new Error(data.message || '加载失败');

            renderTable(data.data || []);
            renderPagination(data.total || 0, data.page || 1, data.size || pageSize);
            currentPage = data.page || 1;
        } catch (err) {
            console.error('加载用户列表失败:', err);
            document.getElementById('userTableBody').innerHTML =
                `<tr><td colspan="9" class="text-center text-danger py-3">❌ 加载失败：${err.message}</td></tr>`;
        }
    }

    // ================================================================
    // 6. 渲染表格（中文按钮 + 自操作禁用）
    // ================================================================
    function renderTable(users) {
        const tbody = document.getElementById('userTableBody');
        if (!users || users.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">📭 暂无用户数据</td></tr>`;
            return;
        }

        // 获取当前用户ID和是否管理员（管理员可操作自己）
        const currentUserId = parseInt(localStorage.getItem('userId'));
        const isAdmin = localStorage.getItem('username') === 'admin'; // 只有admin可访问此页

        let html = '';
        users.forEach(u => {
            const statusClass = u.status === 1 ? 'active' : 'inactive';
            const statusText = u.status === 1 ? '启用' : '禁用';
            const roleNames = u.roleNames || '无';
            const dept = u.departmentName || '-';
            const created = u.createdAt ? new Date(u.createdAt).toLocaleString('zh-CN', {
                month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
            }) : '-';

            // 判断是否为自己的行（非管理员时禁用操作，但本页面只有管理员能访问，为未来扩展保留）
            const isOwn = (u.id === currentUserId && !isAdmin);
            const disabledAttr = isOwn ? 'disabled' : '';

            html += `
                <tr>
                    <td class="fw-bold">${u.id}</td>
                    <td><span class="fw-medium">${u.username}</span></td>
                    <td><a href="mailto:${u.email}" class="text-decoration-none">${u.email}</a></td>
                    <td>${u.realName || '-'}</td>
                    <td>${dept}</td>
                    <td>${roleNames}</td>
                    <td><span class="user-status ${statusClass}">${statusText}</span></td>
                    <td style="font-size:12px; color:#64748b;">${created}</td>
                    <td>
                        <div class="d-flex flex-wrap gap-1">
                            <button class="btn btn-sm btn-outline-primary action-btn" onclick="openRoleModal(${u.id})" title="分配角色" ${disabledAttr}>分配角色</button>
                            <button class="btn btn-sm btn-outline-${u.status === 1 ? 'danger' : 'success'} action-btn" onclick="toggleStatus(${u.id}, ${u.status})" title="${u.status === 1 ? '禁用' : '启用'}" ${disabledAttr}>${u.status === 1 ? '禁用' : '启用'}</button>
                            <button class="btn btn-sm btn-outline-warning action-btn" onclick="resetPassword(${u.id})" title="重置密码" ${disabledAttr}>重置密码</button>
                        </div>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    // ================================================================
    // 7. 渲染分页
    // ================================================================
    function renderPagination(total, page, size) {
        totalPages = Math.ceil(total / size);
        const ul = document.getElementById('pagination');
        if (totalPages <= 1) {
            ul.innerHTML = '';
            return;
        }

        let html = '';
        html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${page - 1}">上一页</a>
        </li>`;

        const start = Math.max(1, page - 2);
        const end = Math.min(totalPages, page + 2);
        if (start > 1) {
            html += `<li class="page-item"><a class="page-link" href="#" data-page="1">1</a></li>`;
            if (start > 2) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
        }
        for (let i = start; i <= end; i++) {
            html += `<li class="page-item ${i === page ? 'active' : ''}">
                <a class="page-link" href="#" data-page="${i}">${i}</a>
            </li>`;
        }
        if (end < totalPages) {
            if (end < totalPages - 1) html += `<li class="page-item disabled"><span class="page-link">…</span></li>`;
            html += `<li class="page-item"><a class="page-link" href="#" data-page="${totalPages}">${totalPages}</a></li>`;
        }

        html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${page + 1}">下一页</a>
        </li>`;

        ul.innerHTML = html;
        ul.querySelectorAll('a.page-link[data-page]').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const p = parseInt(this.dataset.page);
                if (p >= 1 && p <= totalPages) loadUsers(p);
            });
        });
    }

    // ================================================================
    // 8. 搜索 & 重置
    // ================================================================
    document.getElementById('searchBtn').addEventListener('click', () => loadUsers(1));
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('keyword').value = '';
        document.getElementById('statusFilter').value = '';
        loadUsers(1);
    });
    document.getElementById('keyword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadUsers(1);
    });

    // ================================================================
    // 9. 禁用/启用用户
    // ================================================================
    async function toggleStatus(userId, currentStatus) {
        const newStatus = currentStatus === 1 ? 0 : 1;
        const action = newStatus === 0 ? '禁用' : '启用';
        const result = await Swal.fire({
            title: `确认${action}`,
            text: `您确定要${action}该用户吗？`,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: `确认${action}`,
            cancelButtonText: '取消'
        });
        if (!result.isConfirmed) return;

        try {
            const resp = await fetch(`/api/users/${userId}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            const data = await resp.json();
            if (data.success) {
                Swal.fire('✅ 操作成功', `用户已${action}`, 'success');
                loadUsers(currentPage);
            } else {
                Swal.fire('❌ 操作失败', data.message, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    }

    // ================================================================
    // 10. 重置密码
    // ================================================================
    async function resetPassword(userId) {
        const result = await Swal.fire({
            title: '重置密码',
            text: '确认重置该用户密码？新密码将由系统随机生成。',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: '确认重置',
            cancelButtonText: '取消',
            confirmButtonColor: '#d33'
        });
        if (!result.isConfirmed) return;

        try {
            const resp = await fetch(`/api/users/${userId}/password/reset`, { method: 'PUT' });
            const data = await resp.json();
            if (data.success) {
                await Swal.fire({
                    title: '✅ 重置成功',
                    html: `新密码：<strong>${data.newPassword}</strong><br><small>请复制后安全告知用户。</small>`,
                    icon: 'success'
                });
                loadUsers(currentPage);
            } else {
                Swal.fire('❌ 重置失败', data.message, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    }

    // ================================================================
    // 11. 分配角色
    // ================================================================
    async function openRoleModal(userId) {
        currentUserId = userId;
        document.getElementById('roleUserId').value = userId;

        try {
            // 获取所有角色
            const rolesResp = await fetch('/api/roles');
            const rolesData = await rolesResp.json();
            const roles = Array.isArray(rolesData) ? rolesData : (rolesData.data || []);

            // 获取用户当前角色
            const userResp = await fetch(`/api/users/${userId}`);
            const userData = await userResp.json();
            const userRoleIds = userData.success && userData.data ? (userData.data.roleIds || []) : [];

            const container = document.getElementById('roleCheckboxes');
            if (!roles || roles.length === 0) {
                container.innerHTML = '<p class="text-muted">暂无角色可供分配</p>';
                return;
            }

            let html = '';
            roles.forEach(r => {
                const checked = userRoleIds.includes(r.id) ? 'checked' : '';
                html += `
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="${r.id}" id="role_${r.id}" ${checked}>
                        <label class="form-check-label" for="role_${r.id}">
                            <span class="badge bg-secondary">${r.roleCode}</span>
                            ${r.roleName}
                            ${r.description ? `<span class="text-muted small">（${r.description}）</span>` : ''}
                        </label>
                    </div>
                `;
            });
            container.innerHTML = html;

            if (!roleModalInstance) {
                roleModalInstance = new bootstrap.Modal(document.getElementById('roleModal'));
            }
            roleModalInstance.show();

        } catch (err) {
            alert('❌ 加载数据失败：' + err.message);
        }
    }

    // ================================================================
    // 12. 保存角色分配
    // ================================================================
    document.getElementById('saveRolesBtn').addEventListener('click', async function() {
        const userId = currentUserId;
        const checked = document.querySelectorAll('#roleCheckboxes input:checked');
        const roleIds = Array.from(checked).map(el => parseInt(el.value));

        try {
            const resp = await fetch(`/api/users/${userId}/roles`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roleIds })
            });
            const data = await resp.json();
            if (data.success) {
                alert('✅ 角色分配成功');
                if (roleModalInstance) roleModalInstance.hide();
                loadUsers(currentPage);
            } else {
                alert('❌ 分配失败：' + data.message);
            }
        } catch (err) {
            alert('❌ 请求失败：' + err.message);
        }
    });

    // ================================================================
    // 13. 初始化加载
    // ================================================================
    document.addEventListener('DOMContentLoaded', function() {
        loadUsers(1);
    });
</script>

</body>
</html>
