<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar { width: 220px; background: #1a1a2e; color: #fff; padding: 20px 0; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; }
        .sidebar-brand { padding: 0 20px 20px; font-size: 20px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand i { margin-right: 10px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 0; transition: all 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,0.1); }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content { margin-left: 220px; flex: 1; padding: 20px; min-height: 100vh; }
        .topbar { background: white; padding: 12px 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .topbar .user-info { font-size: 14px; }
        .topbar .logout-btn { cursor: pointer; color: #dc3545; text-decoration: none; }
        .profile-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 600px; margin: 0 auto; }
        .profile-card .avatar { width: 80px; height: 80px; border-radius: 50%; background: #e8edf4; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #1a73e8; margin: 0 auto 16px; }
        .profile-card .form-label { font-weight: 500; }
        .profile-card .form-control:disabled { background: #f1f3f5; }
        .btn-group-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .btn-group-actions .btn { flex: 1; min-width: 120px; }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-brand span, .sidebar .nav-link span { display: none; }
            .sidebar .nav-link { text-align: center; padding: 12px 0; }
            .sidebar .nav-link i { margin-right: 0; font-size: 20px; }
            .main-content { margin-left: 60px; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-brand"><i class="bi bi-cart3"></i> <span>采购助手</span></div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/chat"><i class="bi bi-chat-dots"></i> <span>智能问答</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/documents"><i class="bi bi-file-earmark-text"></i> <span>文档管理</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/users"><i class="bi bi-people"></i> <span>用户管理</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/departments"><i class="bi bi-diagram-3"></i> <span>部门管理</span></a></li>
            <li class="nav-item"><a class="nav-link active" href="/profile"><i class="bi bi-person"></i> <span>个人中心</span></a></li>
            <li class="nav-item" id="dashboardNav" style="display:none;">
                <a class="nav-link" href="/dashboard"><i class="bi bi-graph-up"></i> <span>数据看板</span></a>
            </li>
        </ul>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="topbar">
            <div><span id="pageTitle">👤 个人中心</span></div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span id="currentUser">用户</span>
                <a href="#" class="logout-btn ms-3" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出</a>
            </div>
        </div>

        <div class="profile-card" id="profileCard">
            <!-- 头像 -->
            <div class="avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <form id="profileForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">用户类型</label>
                        <input type="text" class="form-control" id="userType" disabled>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">真实姓名</label>
                        <input type="text" class="form-control" id="realName" placeholder="请输入真实姓名">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">部门</label>
                        <input type="text" class="form-control" id="department" disabled>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" placeholder="请输入邮箱">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-control" id="phone" placeholder="请输入手机号">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">注册时间</label>
                        <input type="text" class="form-control" id="createdAt" disabled>
                    </div>
                </div>
                <div class="btn-group-actions">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <button type="button" class="btn btn-outline-primary" id="changePwdBtn">修改密码</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // ===== 认证检查 =====
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
    }
    // 显示管理员专属菜单
    if (localStorage.getItem('username') === 'admin') {
        const nav = document.getElementById('dashboardNav');
        if (nav) nav.style.display = 'block';
    }
    // ===== 全局 fetch 拦截器 =====
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && (url.includes('/api/auth/') || url.includes('/login') || url.includes('/register'))) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // ===== 显示用户名 =====
    document.getElementById('currentUser').textContent = localStorage.getItem('realName') || localStorage.getItem('username');

    // ===== 退出 =====
    document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.clear();
        window.location.href = '/login';
    });

    // ===== 加载用户信息 =====
    async function loadUserInfo() {
        try {
            const resp = await fetch('/api/users/me');
            const data = await resp.json();
            if (!data.success) throw new Error(data.message);
            const user = data.data;
            document.getElementById('username').value = user.username;
            document.getElementById('realName').value = user.realName || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('department').value = user.departmentName || '未分配';
            document.getElementById('createdAt').value = user.createdAt ? new Date(user.createdAt).toLocaleString() : '-';
            const userTypeMap = {1: '内部员工', 2: '外部用户'};
            document.getElementById('userType').value = userTypeMap[user.userType] || '未知';
        } catch (err) {
            Swal.fire('加载失败', err.message, 'error');
        }
    }

    // ===== 保存个人信息 =====
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
            realName: document.getElementById('realName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim()
        };
        try {
            const resp = await fetch('/api/users/me', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await resp.json();
            if (result.success) {
                Swal.fire('✅ 保存成功', '个人信息已更新', 'success');
                if (data.realName) {
                    localStorage.setItem('realName', data.realName);
                    document.getElementById('currentUser').textContent = data.realName;
                }
                loadUserInfo();
            } else {
                Swal.fire('❌ 保存失败', result.message, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    });

    // ===== 修改密码（弹窗方式） =====
    document.getElementById('changePwdBtn').addEventListener('click', function() {
        Swal.fire({
            title: '修改密码',
            html: `
                <div class="mb-3 text-start">
                    <label class="form-label">当前密码</label>
                    <input type="password" id="oldPwd" class="form-control" placeholder="请输入当前密码">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">新密码</label>
                    <input type="password" id="newPwd" class="form-control" placeholder="至少8位" minlength="8">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">确认新密码</label>
                    <input type="password" id="confirmPwd" class="form-control" placeholder="请再次输入新密码">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '确认修改',
            cancelButtonText: '取消',
            focusConfirm: false,
            preConfirm: () => {
                const oldPassword = document.getElementById('oldPwd').value;
                const newPassword = document.getElementById('newPwd').value;
                const confirmPassword = document.getElementById('confirmPwd').value;
                if (!oldPassword || !newPassword || !confirmPassword) {
                    Swal.showValidationMessage('请完整填写所有字段');
                    return false;
                }
                if (newPassword.length < 8) {
                    Swal.showValidationMessage('新密码至少 8 位');
                    return false;
                }
                if (newPassword !== confirmPassword) {
                    Swal.showValidationMessage('两次输入的新密码不一致');
                    return false;
                }
                return { oldPassword, newPassword };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                const { oldPassword, newPassword } = result.value;
                try {
                    const resp = await fetch('/api/users/me/password', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });
                    const data = await resp.json();
                    if (data.success) {
                        await Swal.fire('✅ 密码修改成功', '请重新登录', 'success');
                        localStorage.clear();
                        window.location.href = '/login';
                    } else {
                        Swal.fire('❌ 修改失败', data.message, 'error');
                    }
                } catch (err) {
                    Swal.fire('❌ 请求失败', err.message, 'error');
                }
            }
        });
    });

    // 初始化
    loadUserInfo();
</script>
</body>
</html>
