<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=2">
    <style>
        .profile-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 600px; margin: 0 auto; }
        .profile-card .avatar { width: 80px; height: 80px; border-radius: 50%; background: #e8edf4; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #1a73e8; margin: 0 auto 16px; }
        .profile-card .form-label { font-weight: 500; }
        .profile-card .form-control:disabled { background: #f1f3f5; }
        .btn-group-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .btn-group-actions .btn { flex: 1; min-width: 120px; }
        @media (max-width: 991.98px) {
            .profile-card { padding: 20px; }
        }

        /* ---------- 会员与积分卡片 ---------- */
        .member-summary { margin-bottom: 16px; }
        .member-points { font-size: 30px; font-weight: 700; color: #1a73e8; line-height: 1.1; }
        .member-points small { font-size: 13px; font-weight: 400; color: #94a3b8; margin-left: 6px; }
        .member-state { margin-top: 6px; font-size: 14px; color: #475569; }

        .plan-list { display: flex; gap: 10px; flex-wrap: wrap; }
        .plan-btn {
            flex: 1 1 120px;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            padding: 12px 10px;
            border: 1px solid #dbe3ec; border-radius: 12px;
            background: #fff; cursor: pointer;
            transition: border-color .15s, background .15s, transform .15s;
        }
        .plan-btn:hover:not(:disabled) {
            border-color: #1a73e8; background: #f4f8ff; transform: translateY(-1px);
        }
        .plan-btn:disabled { cursor: not-allowed; opacity: .55; }
        .plan-btn .p-label { font-size: 14px; font-weight: 600; color: #1e293b; }
        .plan-btn .p-cost { font-size: 13px; font-weight: 600; color: #1a73e8; }
        .plan-btn .p-hint { font-size: 11px; color: #94a3b8; text-align: center; }
        .plan-note {
            padding: 12px 14px; border-radius: 10px;
            background: #f4f8ff; border: 1px solid #cfe0f7;
            color: #1a73e8; font-size: 14px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('profile')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容 -->
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('👤 个人中心')}"></div>

        <div class="profile-card" id="profileCard">
            <!-- 头像 -->
            <div class="avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <form id="profileForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">用户类型</label>
                        <input type="text" class="form-control" id="userType" disabled>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">真实姓名</label>
                        <input type="text" class="form-control" id="realName" placeholder="请输入真实姓名">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">部门</label>
                        <input type="text" class="form-control" id="department" disabled>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" placeholder="请输入邮箱">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-control" id="phone" placeholder="请输入手机号">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">注册时间</label>
                        <input type="text" class="form-control" id="createdAt" disabled>
                    </div>
                </div>
                <div class="btn-group-actions">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <button type="button" class="btn btn-outline-primary" id="changePwdBtn">修改密码</button>
                </div>
            </form>
        </div>

        <!-- ========== 会员与积分 ========== -->
        <div class="profile-card mt-4" id="membershipCard">
            <h5 class="mb-3"><i class="bi bi-gem"></i> 会员与积分</h5>

            <div class="member-summary">
                <div class="member-points">
                    <span id="memberPoints">-</span><small>积分</small>
                </div>
                <div class="member-state" id="memberState">加载中…</div>
            </div>

            <div class="plan-list" id="planList"></div>
            <div class="text-muted small mt-3">
                积分来自优化意见被采纳。会员有效期内提问不限次；非会员每日有免费额度。
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=3"></script>
<script>
    // ===== 认证检查 =====
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
    }
    // ===== 全局 fetch 拦截器 =====
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && (url.includes('/api/auth/') || url.includes('/login') || url.includes('/register'))) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // 显示用户名、退出、管理菜单显隐、抽屉开关
    // 均由 /js/app.js 统一处理

    // ===== 加载用户信息 =====
    async function loadUserInfo() {
        try {
            const resp = await fetch('/api/users/me');
            const data = await resp.json();
            if (!data.success) throw new Error(data.errMessage);
            const user = data.data;
            document.getElementById('username').value = user.username;
            document.getElementById('realName').value = user.realName || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('department').value = user.departmentName || '未分配';
            document.getElementById('createdAt').value = user.createdAt ? new Date(user.createdAt).toLocaleString() : '-';
            const userTypeMap = {1: '内部员工', 2: '外部用户'};
            document.getElementById('userType').value = userTypeMap[user.userType] || '未知';
        } catch (err) {
            Swal.fire('加载失败', err.message, 'error');
        }
    }

    // ===== 保存个人信息 =====
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
            realName: document.getElementById('realName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim()
        };
        try {
            const resp = await fetch('/api/users/me', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await resp.json();
            if (result.success) {
                Swal.fire('✅ 保存成功', '个人信息已更新', 'success');
                if (data.realName) {
                    localStorage.setItem('realName', data.realName);
                    document.getElementById('currentUser').textContent = data.realName;
                }
                loadUserInfo();
            } else {
                Swal.fire('❌ 保存失败', result.errMessage, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    });

    // ===== 修改密码（弹窗方式） =====
    document.getElementById('changePwdBtn').addEventListener('click', function() {
        Swal.fire({
            title: '修改密码',
            html: `
                <div class="mb-3 text-start">
                    <label class="form-label">当前密码</label>
                    <input type="password" id="oldPwd" class="form-control" placeholder="请输入当前密码">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">新密码</label>
                    <input type="password" id="newPwd" class="form-control" placeholder="至少8位" minlength="8">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">确认新密码</label>
                    <input type="password" id="confirmPwd" class="form-control" placeholder="请再次输入新密码">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '确认修改',
            cancelButtonText: '取消',
            focusConfirm: false,
            preConfirm: () => {
                const oldPassword = document.getElementById('oldPwd').value;
                const newPassword = document.getElementById('newPwd').value;
                const confirmPassword = document.getElementById('confirmPwd').value;
                if (!oldPassword || !newPassword || !confirmPassword) {
                    Swal.showValidationMessage('请完整填写所有字段');
                    return false;
                }
                if (newPassword.length < 8) {
                    Swal.showValidationMessage('新密码至少 8 位');
                    return false;
                }
                if (newPassword !== confirmPassword) {
                    Swal.showValidationMessage('两次输入的新密码不一致');
                    return false;
                }
                return { oldPassword, newPassword };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                const { oldPassword, newPassword } = result.value;
                try {
                    const resp = await fetch('/api/users/me/password', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });
                    const data = await resp.json();
                    if (data.success) {
                        await Swal.fire('✅ 密码修改成功', '请重新登录', 'success');
                        localStorage.clear();
                        window.location.href = '/login';
                    } else {
                        Swal.fire('❌ 修改失败', data.errMessage, 'error');
                    }
                } catch (err) {
                    Swal.fire('❌ 请求失败', err.message, 'error');
                }
            }
        });
    });

    // 初始化
    loadUserInfo();
    loadMembership();

    // ================================================================
    // 会员与积分
    // ================================================================
    let membershipStatus = null;
    let membershipPlans = [];
    // 兑换进行中标记：CAS 只能挡住真并发，隔几秒的第二次点击是一次真实购买，
    // 所以前端必须自己把按钮禁掉。
    let exchanging = false;

    function fmtDateTime(value) {
        if (!value) return '-';
        // 后端传的是无时区的 LocalDateTime，浏览器按本地时间解析。
        // 前提是服务端统一用 Asia/Shanghai（见 AppTime）。
        const d = new Date(value);
        return isNaN(d.getTime()) ? value
            : d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0')
              + '/' + String(d.getDate()).padStart(2, '0');
    }

    async function loadMembership() {
        try {
            const [statusResp, plansResp] = await Promise.all([
                fetch('/api/membership/me'),
                fetch('/api/membership/plans')
            ]);
            const status = await statusResp.json();
            const plans = await plansResp.json();
            if (!status.success) throw new Error(status.errMessage || '加载失败');
            membershipStatus = status.data;
            membershipPlans = plans.success ? plans.data : [];
            renderMembership();
        } catch (err) {
            document.getElementById('memberState').textContent = '会员信息加载失败：' + err.message;
        }
    }

    function renderMembership() {
        const st = membershipStatus;
        document.getElementById('memberPoints').textContent = st.points == null ? 0 : st.points;

        let state;
        if (st.permanent) {
            state = '永久会员';
        } else if (st.active) {
            state = (st.memberTypeLabel || '会员')
                + ' · 剩余 ' + (st.remainingDays == null ? '-' : st.remainingDays) + ' 天'
                + '（' + fmtDateTime(st.memberExpireAt) + ' 到期）';
        } else {
            state = '非会员 · 今日还剩 ' + st.freeRemaining + '/' + st.freeDailyLimit + ' 次免费提问';
        }
        document.getElementById('memberState').textContent = state;
        renderPlans();
    }

    function renderPlans() {
        const st = membershipStatus;
        const box = document.getElementById('planList');

        // 永久会员已经是最高档，不能再买任何有限档位。
        // 这里**连按钮都不给** —— 之前只挡了"永久档本身不可兑换"，
        // 结果永久会员看到月度/季度/年度三个按钮都是可点的，点一次被服务端拒一次。
        if (st.permanent) {
            box.innerHTML = '<div class="plan-note">您已是永久会员，无需再兑换。</div>';
            return;
        }

        const points = st.points == null ? 0 : st.points;

        box.innerHTML = membershipPlans.map(p => {
            // 永久档 exchangeable=false，前端置灰；服务端也会拒绝（灰度只是 UX）
            const affordable = !p.exchangeable || points >= p.pointsCost;
            const disabled = !p.exchangeable || !affordable || exchanging;

            let hint = p.durationLabel;
            if (!p.exchangeable) hint = '仅运营发放';
            else if (!affordable) hint = '还差 ' + (p.pointsCost - points) + ' 分';

            return `<button type="button" class="plan-btn" data-plan="${p.type}" ${disabled ? 'disabled' : ''}>
                        <span class="p-label">${p.label}</span>
                        <span class="p-cost">${p.exchangeable ? p.pointsCost + ' 分' : '—'}</span>
                        <span class="p-hint">${hint}</span>
                    </button>`;
        }).join('');
    }

    document.getElementById('planList').addEventListener('click', async function (e) {
        const btn = e.target.closest('[data-plan]');
        if (!btn || btn.disabled || exchanging) return;

        // 第二道判断：永久会员的按钮本就不该存在，但页面可能是"还没成为永久会员"时
        // 加载的旧状态 —— 比如在另一个标签页里被管理员设为永久，或者本页加载后
        // 管理员刚发放。光靠 renderPlans() 不生成按钮挡不住这种情况，
        // 那种情况下用户会先走一遍确认弹窗、再被服务端拒掉。
        if (membershipStatus.permanent) {
            Swal.fire('无需兑换', '您已是永久会员，享有全部权益。', 'info');
            loadMembership();   // 顺手把页面状态刷成最新的
            return;
        }

        const plan = membershipPlans.find(p => p.type === btn.dataset.plan);
        if (!plan) return;

        const confirm = await Swal.fire({
            title: '确认兑换',
            html: `将消耗 <strong>${plan.pointsCost}</strong> 积分兑换 <strong>${plan.label}</strong>（${plan.durationLabel}）<br>`
                + `<small class="text-muted">当前积分 ${membershipStatus.points == null ? 0 : membershipStatus.points}</small>`,
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: '确认兑换',
            cancelButtonText: '取消'
        });
        if (!confirm.isConfirmed) return;

        exchanging = true;
        renderPlans();
        try {
            const resp = await fetch('/api/membership/exchange', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ plan: plan.type })
            });
            const data = await resp.json();
            if (!data.success) {
                Swal.fire('❌ 兑换失败', data.errMessage || '', 'error');
                return;
            }
            membershipStatus = data.data;
            renderMembership();
            // 余额变了，用户信息那边也刷新一下（否则会显示旧积分）
            loadUserInfo();
            Swal.fire({ title: '兑换成功', icon: 'success', timer: 1500, showConfirmButton: false });
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        } finally {
            exchanging = false;
            renderPlans();
        }
    });
</script>
</body>
</html>
