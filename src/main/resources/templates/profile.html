<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=2">
    <style>
        .profile-card { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); max-width: 600px; margin: 0 auto; }
        .profile-card .avatar { width: 80px; height: 80px; border-radius: 50%; background: #e8edf4; display: flex; align-items: center; justify-content: center; font-size: 36px; color: #1a73e8; margin: 0 auto 16px; }
        .profile-card .form-label { font-weight: 500; }
        .profile-card .form-control:disabled { background: #f1f3f5; }
        .btn-group-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
        .btn-group-actions .btn { flex: 1; min-width: 120px; }
        @media (max-width: 991.98px) {
            .profile-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('profile')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容 -->
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('👤 个人中心')}"></div>

        <div class="profile-card" id="profileCard">
            <!-- 头像 -->
            <div class="avatar">
                <i class="bi bi-person-fill"></i>
            </div>
            <form id="profileForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" class="form-control" id="username" disabled>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">用户类型</label>
                        <input type="text" class="form-control" id="userType" disabled>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">真实姓名</label>
                        <input type="text" class="form-control" id="realName" placeholder="请输入真实姓名">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">部门</label>
                        <input type="text" class="form-control" id="department" disabled>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" placeholder="请输入邮箱">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">手机号</label>
                        <input type="tel" class="form-control" id="phone" placeholder="请输入手机号">
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">注册时间</label>
                        <input type="text" class="form-control" id="createdAt" disabled>
                    </div>
                </div>
                <div class="btn-group-actions">
                    <button type="submit" class="btn btn-primary">保存修改</button>
                    <button type="button" class="btn btn-outline-primary" id="changePwdBtn">修改密码</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=2"></script>
<script>
    // ===== 认证检查 =====
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
    }
    // ===== 全局 fetch 拦截器 =====
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && (url.includes('/api/auth/') || url.includes('/login') || url.includes('/register'))) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // 显示用户名、退出、管理菜单显隐、抽屉开关
    // 均由 /js/app.js 统一处理

    // ===== 加载用户信息 =====
    async function loadUserInfo() {
        try {
            const resp = await fetch('/api/users/me');
            const data = await resp.json();
            if (!data.success) throw new Error(data.errMessage);
            const user = data.data;
            document.getElementById('username').value = user.username;
            document.getElementById('realName').value = user.realName || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('department').value = user.departmentName || '未分配';
            document.getElementById('createdAt').value = user.createdAt ? new Date(user.createdAt).toLocaleString() : '-';
            const userTypeMap = {1: '内部员工', 2: '外部用户'};
            document.getElementById('userType').value = userTypeMap[user.userType] || '未知';
        } catch (err) {
            Swal.fire('加载失败', err.message, 'error');
        }
    }

    // ===== 保存个人信息 =====
    document.getElementById('profileForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const data = {
            realName: document.getElementById('realName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value.trim()
        };
        try {
            const resp = await fetch('/api/users/me', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await resp.json();
            if (result.success) {
                Swal.fire('✅ 保存成功', '个人信息已更新', 'success');
                if (data.realName) {
                    localStorage.setItem('realName', data.realName);
                    document.getElementById('currentUser').textContent = data.realName;
                }
                loadUserInfo();
            } else {
                Swal.fire('❌ 保存失败', result.errMessage, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    });

    // ===== 修改密码（弹窗方式） =====
    document.getElementById('changePwdBtn').addEventListener('click', function() {
        Swal.fire({
            title: '修改密码',
            html: `
                <div class="mb-3 text-start">
                    <label class="form-label">当前密码</label>
                    <input type="password" id="oldPwd" class="form-control" placeholder="请输入当前密码">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">新密码</label>
                    <input type="password" id="newPwd" class="form-control" placeholder="至少8位" minlength="8">
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label">确认新密码</label>
                    <input type="password" id="confirmPwd" class="form-control" placeholder="请再次输入新密码">
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: '确认修改',
            cancelButtonText: '取消',
            focusConfirm: false,
            preConfirm: () => {
                const oldPassword = document.getElementById('oldPwd').value;
                const newPassword = document.getElementById('newPwd').value;
                const confirmPassword = document.getElementById('confirmPwd').value;
                if (!oldPassword || !newPassword || !confirmPassword) {
                    Swal.showValidationMessage('请完整填写所有字段');
                    return false;
                }
                if (newPassword.length < 8) {
                    Swal.showValidationMessage('新密码至少 8 位');
                    return false;
                }
                if (newPassword !== confirmPassword) {
                    Swal.showValidationMessage('两次输入的新密码不一致');
                    return false;
                }
                return { oldPassword, newPassword };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                const { oldPassword, newPassword } = result.value;
                try {
                    const resp = await fetch('/api/users/me/password', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ oldPassword, newPassword })
                    });
                    const data = await resp.json();
                    if (data.success) {
                        await Swal.fire('✅ 密码修改成功', '请重新登录', 'success');
                        localStorage.clear();
                        window.location.href = '/login';
                    } else {
                        Swal.fire('❌ 修改失败', data.errMessage, 'error');
                    }
                } catch (err) {
                    Swal.fire('❌ 请求失败', err.message, 'error');
                }
            }
        });
    });

    // 初始化
    loadUserInfo();
</script>
</body>
</html>
