<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=1">
    <style>
        .content-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .conv-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f3f5;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .conv-item:hover { background: #f8f9fa; }
        .conv-item .info { flex: 1; min-width: 0; }
        .conv-item .title { font-weight: 500; overflow-wrap: anywhere; }
        .conv-item .meta { font-size: 13px; color: #94a3b8; overflow-wrap: anywhere; }
        .conv-item .delete-btn { cursor: pointer; color: #dc3545; opacity: 0.6; }
        .conv-item .delete-btn:hover { opacity: 1; }
        .empty-state { text-align: center; padding: 60px 0; color: #94a3b8; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('history')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容 -->
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('📋 历史记录')}"></div>

        <div class="content-card">
            <div id="conversationList"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=1"></script>
<script>
    // ================================================================
    // 认证
    // ================================================================
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && url.includes('/api/auth/')) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // 当前用户显示、退出登录、管理菜单显隐、抽屉开关
    // 均由 /js/app.js 统一处理

    // ================================================================
    // 加载历史记录
    // ================================================================
    async function loadHistory() {
        try {
            const resp = await fetch('/api/conversations');
            const data = await resp.json();
            renderList(data);
        } catch (err) {
            document.getElementById('conversationList').innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>加载失败</p></div>`;
        }
    }

    function renderList(conversations) {
        const container = document.getElementById('conversationList');
        if (!conversations || conversations.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>暂无聊天记录</p><small class="text-muted">去智能问答页面开始第一次对话吧</small></div>`;
            return;
        }

        let html = '';
        conversations.forEach(conv => {
            const time = conv.updatedAt ? new Date(conv.updatedAt).toLocaleString() : '';
            const msgCount = conv.messages ? conv.messages.length : 0;
            html += `
                <div class="conv-item" onclick="viewConversation('${conv.id}')">
                    <div class="info">
                        <div class="title">${conv.title || '未命名对话'}</div>
                        <div class="meta">${msgCount} 条消息 · ${time}</div>
                    </div>
                    <div>
                        <span class="badge bg-secondary me-2">${msgCount} 条</span>
                        <span class="delete-btn" onclick="event.stopPropagation();deleteConversation('${conv.id}')"><i class="bi bi-trash3"></i></span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ================================================================
    // 查看对话详情（跳转到聊天页面加载历史）
    // ================================================================
    function viewConversation(id) {
        window.location.href = `/chat?conversationId=${id}`;
    }

    // ================================================================
    // 删除对话
    // ================================================================
    async function deleteConversation(id) {
        const result = await Swal.fire({
            title: '确认删除',
            text: '删除后不可恢复，确定要删除这条对话记录吗？',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '确认删除',
            cancelButtonText: '取消',
            confirmButtonColor: '#d33'
        });
        if (!result.isConfirmed) return;

        try {
            const resp = await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
            const data = await resp.json();
            if (data.success) {
                Swal.fire('✅ 删除成功', '', 'success');
                loadHistory();
            }
        } catch (err) {
            Swal.fire('❌ 删除失败', err.message, 'error');
        }
    }

    // ================================================================
    // 初始化
    // ================================================================
    loadHistory();
</script>
</body>
</html>
