<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f5f7fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .wrapper { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px;
            background: #1a1a2e;
            color: #fff;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar-brand { padding: 0 20px 20px; font-size: 20px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-brand i { margin-right: 10px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.7); padding: 10px 20px; border-radius: 0; transition: all 0.2s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,0.1); }
        .sidebar .nav-link i { margin-right: 10px; }
        .main-content { margin-left: 220px; flex: 1; padding: 20px; min-height: 100vh; }
        .topbar {
            background: white;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .topbar .user-info { font-size: 14px; }
        .topbar .logout-btn { cursor: pointer; color: #dc3545; text-decoration: none; }
        .content-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .conv-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f3f5;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .conv-item:hover { background: #f8f9fa; }
        .conv-item .title { font-weight: 500; }
        .conv-item .meta { font-size: 13px; color: #94a3b8; }
        .conv-item .delete-btn { cursor: pointer; color: #dc3545; opacity: 0.6; }
        .conv-item .delete-btn:hover { opacity: 1; }
        .empty-state { text-align: center; padding: 60px 0; color: #94a3b8; }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-brand span, .sidebar .nav-link span { display: none; }
            .sidebar .nav-link { text-align: center; padding: 12px 0; }
            .sidebar .nav-link i { margin-right: 0; font-size: 20px; }
            .main-content { margin-left: 60px; padding: 12px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏 -->
    <div class="sidebar">
        <div class="sidebar-brand"><i class="bi bi-cart3"></i> <span>采购助手</span></div>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="/chat"><i class="bi bi-chat-dots"></i> <span>智能问答</span></a></li>
            <li class="nav-item"><a class="nav-link active" href="/history"><i class="bi bi-clock-history"></i> <span>历史记录</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/documents"><i class="bi bi-file-earmark-text"></i> <span>文档管理</span></a></li>
            <li class="nav-item" id="userMgmtNav" style="display:none;"><a class="nav-link" href="/users"><i class="bi bi-people"></i> <span>用户管理</span></a></li>
            <li class="nav-item" id="deptMgmtNav" style="display:none;"><a class="nav-link" href="/departments"><i class="bi bi-diagram-3"></i> <span>部门管理</span></a></li>
            <li class="nav-item" id="dashboardNav" style="display:none;"><a class="nav-link" href="/dashboard"><i class="bi bi-graph-up"></i> <span>数据看板</span></a></li>
            <li class="nav-item"><a class="nav-link" href="/profile"><i class="bi bi-person"></i> <span>个人中心</span></a></li>
        </ul>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
        <div class="topbar">
            <div><span id="pageTitle">📋 历史记录</span></div>
            <div class="user-info">
                <i class="bi bi-person-circle"></i>
                <span id="currentUser">用户</span>
                <a href="#" class="logout-btn ms-3" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出</a>
            </div>
        </div>

        <div class="content-card">
            <div id="conversationList"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // ================================================================
    // 认证
    // ================================================================
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && url.includes('/api/auth/')) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    document.getElementById('currentUser').textContent = localStorage.getItem('realName') || localStorage.getItem('username');

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.clear();
        window.location.href = '/login';
    });

    // 管理员菜单
    if (localStorage.getItem('username') === 'admin') {
        ['userMgmtNav', 'deptMgmtNav', 'dashboardNav'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.style.display = 'block';
        });
    }

    // ================================================================
    // 加载历史记录
    // ================================================================
    async function loadHistory() {
        try {
            const resp = await fetch('/api/conversations');
            const data = await resp.json();
            renderList(data);
        } catch (err) {
            document.getElementById('conversationList').innerHTML = `<div class="empty-state"><div class="icon">❌</div><p>加载失败</p></div>`;
        }
    }

    function renderList(conversations) {
        const container = document.getElementById('conversationList');
        if (!conversations || conversations.length === 0) {
            container.innerHTML = `<div class="empty-state"><div class="icon">💬</div><p>暂无聊天记录</p><small class="text-muted">去智能问答页面开始第一次对话吧</small></div>`;
            return;
        }

        let html = '';
        conversations.forEach(conv => {
            const time = conv.updatedAt ? new Date(conv.updatedAt).toLocaleString() : '';
            const msgCount = conv.messages ? conv.messages.length : 0;
            html += `
                <div class="conv-item" onclick="viewConversation('${conv.id}')">
                    <div>
                        <div class="title">${conv.title || '未命名对话'}</div>
                        <div class="meta">${msgCount} 条消息 · ${time}</div>
                    </div>
                    <div>
                        <span class="badge bg-secondary me-2">${msgCount} 条</span>
                        <span class="delete-btn" onclick="event.stopPropagation();deleteConversation('${conv.id}')"><i class="bi bi-trash3"></i></span>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // ================================================================
    // 查看对话详情（跳转到聊天页面加载历史）
    // ================================================================
    function viewConversation(id) {
        window.location.href = `/chat?conversationId=${id}`;
    }

    // ================================================================
    // 删除对话
    // ================================================================
    async function deleteConversation(id) {
        const result = await Swal.fire({
            title: '确认删除',
            text: '删除后不可恢复，确定要删除这条对话记录吗？',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '确认删除',
            cancelButtonText: '取消',
            confirmButtonColor: '#d33'
        });
        if (!result.isConfirmed) return;

        try {
            const resp = await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
            const data = await resp.json();
            if (data.success) {
                Swal.fire('✅ 删除成功', '', 'success');
                loadHistory();
            }
        } catch (err) {
            Swal.fire('❌ 删除失败', err.message, 'error');
        }
    }

    // ================================================================
    // 初始化
    // ================================================================
    loadHistory();
</script>
</body>
</html>
