<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* 和 register.html 同一套：100dvh + 内边距，手机上工具栏伸缩时卡片不会被裁掉 */
        body {
            background: var(--pa-bg, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            right: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(circle, rgba(99, 91, 255, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%;
            left: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(10, 37, 64, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .reset-card {
            position: relative;
            z-index: 1;
            max-width: 480px;
            width: 100%;
            padding: 40px 36px 32px;
            background: #fff;
            border-radius: 20px;
            box-shadow:
                0 24px 60px rgba(10, 37, 64, 0.12),
                0 8px 24px rgba(10, 37, 64, 0.06),
                0 0 0 1px rgba(99, 91, 255, 0.04);
            border: 1px solid var(--pa-border, #E5E7EB);
        }
        .reset-card .brand-mark {
            width: 56px; height: 56px;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #635BFF 0%, #4F47D6 100%);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow:
                0 8px 24px rgba(99, 91, 255, 0.32),
                0 2px 6px rgba(99, 91, 255, 0.16);
        }
        .reset-card h3 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 22px;
            font-weight: 700;
            color: var(--pa-ink, #0A2540);
            letter-spacing: -0.4px;
        }
        .reset-card .sub {
            text-align: center;
            color: var(--pa-text-muted, #8898AA);
            font-size: 13px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        .reset-card .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--pa-ink, #0A2540);
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }
        .reset-card .form-control {
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--pa-border, #E5E7EB);
            border-radius: 8px;
            background: var(--pa-surface-2, #FAFBFC);
            transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
            color: var(--pa-ink, #0A2540);
        }
        .reset-card .form-control::placeholder { color: var(--pa-text-faint, #B0BCC8); }
        .reset-card .form-control:focus {
            border-color: var(--pa-primary, #635BFF);
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.14);
            background: #fff;
            outline: none;
        }
        .reset-card .btn-primary {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            letter-spacing: 0.3px;
            background: var(--pa-primary, #635BFF);
            border-color: var(--pa-primary, #635BFF);
            color: #fff;
            box-shadow:
                0 8px 20px rgba(99, 91, 255, 0.28),
                0 2px 6px rgba(99, 91, 255, 0.16);
            transition: all .18s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .reset-card .btn-primary:hover {
            background: var(--pa-primary-600, #5A52E0);
            border-color: var(--pa-primary-600, #5A52E0);
            transform: translateY(-1px);
            box-shadow:
                0 12px 28px rgba(99, 91, 255, 0.36),
                0 4px 10px rgba(99, 91, 255, 0.20);
        }
        .reset-card .btn-primary:active { transform: translateY(0); }
        .reset-card .btn-outline-primary {
            border-color: var(--pa-border-strong, #D1D5DB);
            color: var(--pa-primary-600, #5A52E0);
            background: #fff;
            font-weight: 500;
            transition: all .14s ease;
        }
        .reset-card .btn-outline-primary:hover {
            background: var(--pa-primary-soft, #F0EFFF);
            border-color: var(--pa-primary, #635BFF);
            color: var(--pa-primary-700, #4F47D6);
        }
        .reset-card .links { text-align: center; margin-top: 20px; font-size: 13px; color: var(--pa-text-muted, #8898AA); }
        .reset-card .links a { font-weight: 500; }
        .reset-card .form-text { font-size: 12px; color: var(--pa-text-muted, #8898AA); margin-top: 6px; }
        .reset-card .text-danger { color: var(--pa-danger, #D6483D) !important; }
        .code-row { display: flex; gap: 8px; }
        .code-row input { flex: 1; }
        .code-row button { flex-shrink: 0; }
        .captcha-img {
            flex-shrink: 0;
            width: 130px;
            height: 48px;
            border-radius: 8px;
            background: var(--pa-bg-mute, #F4F6F8);
            cursor: pointer;
            border: 1px solid var(--pa-border, #E5E7EB);
            transition: border-color .14s ease;
        }
        .captcha-img:hover { border-color: var(--pa-primary, #635BFF); }
        .reset-card .alert {
            border-radius: 8px;
            font-size: 13px;
            padding: 10px 14px;
            border: 1px solid var(--pa-border, #E5E7EB);
        }
        .reset-card .alert-danger {
            background: var(--pa-danger-soft, #FDECEA);
            border-color: rgba(214, 72, 61, 0.16);
            color: var(--pa-danger, #D6483D);
        }
        @media (max-width: 575.98px) {
            body { padding: 16px; }
            .reset-card { padding: 32px 22px 24px; border-radius: 16px; }
            .reset-card .brand-mark { width: 52px; height: 52px; font-size: 24px; }
            .reset-card h3 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="reset-card">
    <div class="brand-mark" aria-hidden="true"><i class="bi bi-shield-lock"></i></div>
    <h3>重置密码</h3>
    <p class="sub">用注册时填的邮箱接收验证码，验证通过后设置新密码</p>

    <form id="resetForm">
        <div class="mb-3">
            <label class="form-label" for="email">邮箱 <span class="text-danger">*</span></label>
            <input type="email" id="email" class="form-control"
                   placeholder="请输入注册时用的邮箱" required>
            <div class="form-text text-danger d-none" id="emailError"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="code">邮箱验证码 <span class="text-danger">*</span></label>
            <div class="code-row">
                <input type="text" id="code" class="form-control" placeholder="请输入6位验证码"
                       maxlength="6" inputmode="numeric" autocomplete="off" required>
                <button type="button" id="sendCodeBtn" class="btn btn-outline-primary" disabled>获取验证码</button>
            </div>
            <div class="form-text">先填好下面的图形验证码，这个按钮才会变亮。</div>
        </div>

        <!-- 图形验证码：发验证码那一步的必填项，和邮箱验证码是两个不同的框 -->
        <div class="mb-3">
            <label class="form-label" for="captchaCode">图形验证码 <span class="text-danger">*</span></label>
            <div class="code-row">
                <input type="text" id="captchaCode" class="form-control" placeholder="请输入图中的字符"
                       maxlength="4" autocomplete="off" spellcheck="false"
                       autocapitalize="characters" required>
                <img id="captchaImg" class="captcha-img" alt="">
            </div>
            <div class="form-text" id="captchaHint">图中 4 位字符，不区分大小写</div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="newPassword">新密码</label>
            <input type="password" id="newPassword" class="form-control"
                   placeholder="至少 8 位" required minlength="8" autocomplete="new-password">
        </div>

        <div class="mb-3">
            <label class="form-label" for="confirmPassword">确认新密码</label>
            <input type="password" id="confirmPassword" class="form-control"
                   placeholder="再输一遍" required minlength="8" autocomplete="new-password">
        </div>

        <div id="resetError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary">重置密码</button>
    </form>

    <div class="links">
        <a href="/login">返回登录</a>
        <span class="text-muted mx-1">·</span>
        <a href="/register">还没有账号？立即注册</a>
    </div>
</div>

<script src="/js/captcha.js?v=1"></script>
<script>
    const sendBtn = document.getElementById('sendCodeBtn');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');
    let countdown = 0;

    // 和服务端 common/EmailFormat 里那串**一模一样**（三个模板同一份）
    const EMAIL_RE = new RegExp("^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\\.[a-zA-Z]{2,}$");
    const EMAIL_MAX_LENGTH = 100;

    function emailProblem() {
        const value = emailInput.value.trim();
        if (!value) {
            return '请填写邮箱';
        }
        if (value.length > EMAIL_MAX_LENGTH) {
            return '邮箱太长了（最多 ' + EMAIL_MAX_LENGTH + ' 个字符）';
        }
        if (!EMAIL_RE.test(value)) {
            return '邮箱格式不正确，例如 name@company.com';
        }
        return null;
    }

    function showEmailError() {
        const message = emailProblem();
        emailError.textContent = message || '';
        emailError.classList.toggle('d-none', !message);
        return message;
    }

    emailInput.addEventListener('blur', showEmailError);
    emailInput.addEventListener('input', function () {
        if (!emailError.classList.contains('d-none')) {
            showEmailError();
        }
    });

    // ==================== 图形验证码 ====================

    // 按钮该不该亮：图码填好了、且不在倒计时里。**唯一的开关点。**
    let captchaReady = false;
    function refreshSendBtn() {
        sendBtn.disabled = countdown > 0 || !captchaReady;
    }

    // captcha.js 没加载出来时的退路，见 register.html 里的同款注释
    const NO_CAPTCHA_SCRIPT = {
        refresh: function () { return Promise.resolve(false); },
        payload: function () { return {}; },
        reset: function () {}
    };
    const HAS_CAPTCHA_SCRIPT = typeof createCaptcha === 'function';
    if (!HAS_CAPTCHA_SCRIPT) {
        console.error('[forgot-password] captcha.js 未加载，图形验证码不可用，本次交回服务端校验');
    }

    const captcha = HAS_CAPTCHA_SCRIPT
        ? createCaptcha({
            imgId: 'captchaImg',
            inputId: 'captchaCode',
            hintId: 'captchaHint',
            onError: function (msg) { Swal.fire('图形验证码', msg, 'warning'); },
            onChange: function (ready) { captchaReady = ready; refreshSendBtn(); }
        })
        : NO_CAPTCHA_SCRIPT;

    captchaReady = !HAS_CAPTCHA_SCRIPT;
    refreshSendBtn();

    captcha.refresh();

    /**
     * 发送按钮的 60 秒倒计时。
     *
     * 注意这**只是体验**，不是速率限制 —— 刷新页面就重置了，直接打接口也拦不住。
     * 真正的限流在服务端：EmailCodeRateLimiter（三层）+ 图形验证码
     * （后者挡的是"拿 Postman 直接刷"，前端这个倒计时对它没有任何约束力）。
     */
    function startCountdown() {
        countdown = 60;
        sendBtn.disabled = true;
        sendBtn.textContent = countdown + 's';
        const timer = setInterval(function () {
            countdown--;
            if (countdown <= 0) {
                clearInterval(timer);
                sendBtn.textContent = '获取验证码';
                // 倒计时结束不等于能点：图码那栏可能还是空的，交给 refreshSendBtn 判
                refreshSendBtn();
                return;
            }
            sendBtn.textContent = countdown + 's';
        }, 1000);
    }

    sendBtn.addEventListener('click', async function () {
        if (countdown > 0) return;

        // 内联提示而不是弹窗：错误要贴在出错的那个框下面
        if (showEmailError()) {
            emailInput.focus();
            return;
        }
        const email = emailInput.value.trim();

        // 图形验证码是**必填**的。还没签发成功就直接本地拦住 ——
        // 发个 null 上去只会换来一句看不懂的"图形验证码错误或已过期"。
        const cp = captcha.payload();
        if (!cp || !cp.captchaId) {
            Swal.fire('图形验证码未加载', '请点击图片刷新后再试', 'warning');
            return;
        }

        sendBtn.disabled = true;
        try {
            const resp = await fetch('/api/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    captchaId: cp.captchaId,
                    captchaCode: cp.captchaCode
                })
            });
            const data = await resp.json();
            if (data.success) {
                Swal.fire({title: '验证码已发送', text: '请查收邮件（5 分钟内有效）',
                    icon: 'success', timer: 1800, showConfirmButton: false});
                await captcha.refresh();
                startCountdown();
            } else {
                // SMTP 挂了会是 HTTP 500 + success:false，这里也能接住
                Swal.fire('发送失败', data.errMessage || '请稍后重试', 'error');
                // 图形验证码是一次性的：被限流拒绝时它也已经消耗掉了，
                // 不换一张的话用户第二次点必然报"图形验证码错误"。
                // refresh 会清空输入框 → 按钮重新变灰，用户得再认一张 —— 这是对的。
                await captcha.refresh();
            }
        } catch (err) {
            Swal.fire('网络错误', err.message, 'error');
            await captcha.refresh();
        }
        // 统一收口，别在这里直接写 sendBtn.disabled = false
        refreshSendBtn();
    });

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const email = emailInput.value.trim();
        const code = document.getElementById('code').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        const errorDiv = document.getElementById('resetError');
        errorDiv.classList.add('d-none');

        function fail(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('d-none');
        }

        // 前端先拦一道，少一次白跑的请求。**后端有同样的校验**，这里只是体验。
        // 邮箱那条走内联提示（贴在输入框下面），其余走表单级错误。
        if (showEmailError()) { emailInput.focus(); return; }
        if (!code) return fail('请填写验证码');
        if (newPassword.length < 8) return fail('新密码至少 8 位');
        if (newPassword !== confirmPassword) return fail('两次输入的密码不一致');

        try {
            const resp = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, code: code, newPassword: newPassword })
            });
            const data = await resp.json();

            // 统一信封：校验失败也是 HTTP 200 + success:false
            if (!data.success) return fail(data.errMessage || '重置失败');

            await Swal.fire({
                title: '密码已重置',
                text: '请用新密码重新登录',
                icon: 'success',
                confirmButtonText: '去登录'
            });
            window.location.href = '/login';
        } catch (err) {
            fail('网络错误：' + err.message);
        }
    });
</script>
</body>
</html>
