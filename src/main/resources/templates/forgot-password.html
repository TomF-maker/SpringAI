<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* 和 register.html 同一套：100dvh + 内边距，手机上工具栏伸缩时卡片不会被裁掉 */
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }
        .reset-card { max-width: 450px; width: 100%; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .reset-card h3 { text-align: center; margin-bottom: 8px; }
        .reset-card .sub { text-align: center; color: #94a3b8; font-size: 13px; margin-bottom: 24px; }
        .reset-card .btn-primary { width: 100%; }
        .reset-card .links { text-align: center; margin-top: 16px; }
        .code-row { display: flex; gap: 8px; }
        .code-row input { flex: 1; }
        .code-row button { flex-shrink: 0; }
    </style>
</head>
<body>
<div class="reset-card">
    <h3>🔑 重置密码</h3>
    <p class="sub">用注册时填的邮箱接收验证码，验证通过后设置新密码</p>

    <form id="resetForm">
        <div class="mb-3">
            <label class="form-label" for="email">邮箱</label>
            <input type="email" id="email" class="form-control"
                   placeholder="请输入注册时用的邮箱" required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="code">邮箱验证码</label>
            <div class="code-row">
                <input type="text" id="code" class="form-control" placeholder="请输入6位验证码"
                       maxlength="6" inputmode="numeric" autocomplete="off" required>
                <button type="button" id="sendCodeBtn" class="btn btn-outline-primary">获取验证码</button>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="newPassword">新密码</label>
            <input type="password" id="newPassword" class="form-control"
                   placeholder="至少 8 位" required minlength="8" autocomplete="new-password">
        </div>

        <div class="mb-3">
            <label class="form-label" for="confirmPassword">确认新密码</label>
            <input type="password" id="confirmPassword" class="form-control"
                   placeholder="再输一遍" required minlength="8" autocomplete="new-password">
        </div>

        <div id="resetError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary">重置密码</button>
    </form>

    <div class="links">
        <a href="/login">返回登录</a>
        <span class="text-muted mx-1">·</span>
        <a href="/register">还没有账号？立即注册</a>
    </div>
</div>

<script>
    const sendBtn = document.getElementById('sendCodeBtn');
    const emailInput = document.getElementById('email');
    let countdown = 0;

    /**
     * 发送按钮的 60 秒倒计时。
     *
     * 注意这**只是体验**，不是速率限制 —— 刷新页面就重置了，直接打接口也拦不住。
     * 真正的限流要在服务端做，而 /api/auth/send-code 目前没有（注册那条路也没有）。
     */
    function startCountdown() {
        countdown = 60;
        sendBtn.disabled = true;
        sendBtn.textContent = countdown + 's';
        const timer = setInterval(function () {
            countdown--;
            if (countdown <= 0) {
                clearInterval(timer);
                sendBtn.textContent = '获取验证码';
                sendBtn.disabled = false;
                return;
            }
            sendBtn.textContent = countdown + 's';
        }, 1000);
    }

    sendBtn.addEventListener('click', async function () {
        if (countdown > 0) return;
        const email = emailInput.value.trim();
        if (!email) {
            Swal.fire('请先填写邮箱', '', 'warning');
            return;
        }

        sendBtn.disabled = true;
        try {
            const resp = await fetch('/api/auth/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const data = await resp.json();
            if (data.success) {
                Swal.fire({title: '验证码已发送', text: '请查收邮件（5 分钟内有效）',
                    icon: 'success', timer: 1800, showConfirmButton: false});
                startCountdown();
            } else {
                // SMTP 挂了会是 HTTP 500 + success:false，这里也能接住
                Swal.fire('发送失败', data.errMessage || '请稍后重试', 'error');
                sendBtn.disabled = false;
            }
        } catch (err) {
            Swal.fire('网络错误', err.message, 'error');
            sendBtn.disabled = false;
        }
    });

    document.getElementById('resetForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const email = emailInput.value.trim();
        const code = document.getElementById('code').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        const errorDiv = document.getElementById('resetError');
        errorDiv.classList.add('d-none');

        function fail(msg) {
            errorDiv.textContent = msg;
            errorDiv.classList.remove('d-none');
        }

        // 前端先拦一道，少一次白跑的请求。**后端有同样的校验**，这里只是体验。
        if (!email) return fail('请填写邮箱');
        if (!code) return fail('请填写验证码');
        if (newPassword.length < 8) return fail('新密码至少 8 位');
        if (newPassword !== confirmPassword) return fail('两次输入的密码不一致');

        try {
            const resp = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, code: code, newPassword: newPassword })
            });
            const data = await resp.json();

            // 统一信封：校验失败也是 HTTP 200 + success:false
            if (!data.success) return fail(data.errMessage || '重置失败');

            await Swal.fire({
                title: '密码已重置',
                text: '请用新密码重新登录',
                icon: 'success',
                confirmButtonText: '去登录'
            });
            window.location.href = '/login';
        } catch (err) {
            fail('网络错误：' + err.message);
        }
    });
</script>
</body>
</html>
