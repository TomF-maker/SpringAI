<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部门管理 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=5">
    <style>
        .content-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .tree-item { cursor: pointer; padding: 8px 0; border-bottom: 1px solid #f1f3f5; display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
        .tree-item:hover { background: #f8f9fa; }
        .tree-item .dept-name { font-weight: 500; overflow-wrap: anywhere; }
        .tree-item .dept-actions { display: flex; flex-wrap: wrap; gap: 4px; }
        .tree-item .dept-actions .btn { padding: 2px 8px; font-size: 12px; }
        .tree-indent { display: inline-block; width: 20px; }
        .employee-select-modal .modal-body { max-height: 60vh; overflow-y: auto; }
        .employee-row { cursor: pointer; }
        .employee-row:hover { background: #e8f0fe; }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('departments')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容 -->
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('🏢 部门管理')}"></div>

        <div class="content-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold">部门列表</span>
                <button class="btn btn-primary" id="addDeptBtn"><i class="bi bi-plus-circle"></i> 新增部门</button>
            </div>
            <div id="departmentTreeContainer">
                <p class="text-muted text-center">加载中...</p>
            </div>
        </div>
    </div>
</div>

<!-- 部门新增/编辑模态框 -->
<div class="modal fade" id="deptModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deptModalTitle">新增部门</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="deptId">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">部门名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="deptName" placeholder="请输入部门名称">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">部门编码 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="deptCode" placeholder="请输入部门编码（唯一）">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">上级部门</label>
                        <select class="form-select" id="parentDept">
                            <option value="0">无（根部门）</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">排序</label>
                        <input type="number" class="form-control" id="deptSort" placeholder="数字越小越靠前" value="0">
                    </div>
                </div>
                <!-- 负责人选择区域 -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">负责人</label>
                        <div class="d-flex gap-2">
                            <input type="text" class="form-control" id="leaderName" placeholder="点击选择负责人" readonly>
                            <input type="hidden" id="leaderId">
                            <button class="btn btn-outline-primary" id="selectLeaderBtn"><i class="bi bi-search"></i> 选择</button>
                            <button class="btn btn-outline-secondary" id="clearLeaderBtn" title="清除"><i class="bi bi-x-circle"></i></button>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">联系电话</label>
                        <input type="text" class="form-control" id="deptPhone" placeholder="联系电话（可手动修改）">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">部门邮箱</label>
                        <input type="email" class="form-control" id="deptEmail" placeholder="部门邮箱（可手动修改）">
                    </div>
                </div>
                <div class="text-muted small">注：选择负责人后自动填充联系电话和部门邮箱，您也可以手动修改。</div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" id="saveDeptBtn">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 员工选择弹窗 -->
<div class="modal fade" id="employeeSelectModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">选择负责人</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex mb-3">
                    <input type="text" class="form-control" id="empSearchKeyword" placeholder="搜索用户名/姓名/邮箱">
                    <button class="btn btn-primary ms-2" id="empSearchBtn"><i class="bi bi-search"></i> 搜索</button>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>用户名</th>
                            <th>姓名</th>
                            <th>邮箱</th>
                            <th>手机</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="employeeTableBody">
                        <tr><td colspan="6" class="text-center">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav aria-label="Page navigation">
                    <ul class="pagination justify-content-end" id="empPagination"></ul>
                </nav>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=4"></script>
<script>
    // ===== 认证 & 全局拦截 =====
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';
    if (localStorage.getItem('username') !== 'admin') {
        alert('⚠️ 仅管理员可访问此页面');
        window.location.href = '/chat';
    }
    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && url.includes('/api/auth/')) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // 当前用户显示、退出登录、管理菜单显隐、抽屉开关
    // 均由 /js/app.js 统一处理

    // ===== 加载部门树 =====
    let allDepts = [];

    async function loadDepartmentTree() {
        const container = document.getElementById('departmentTreeContainer');
        try {
            const resp = await fetch('/api/departments/tree');
            const data = await resp.json();
            if (!data.success) throw new Error(data.errMessage);
            allDepts = data.data || [];
            renderTree(allDepts);
        } catch (err) {
            container.innerHTML = `<p class="text-danger">加载失败：${err.message}</p>`;
        }
    }

    function renderTree(treeData, level = 0) {
        const container = document.getElementById('departmentTreeContainer');
        if (!treeData || treeData.length === 0) {
            if (level === 0) {
                container.innerHTML = '<p class="text-muted text-center">暂无部门数据</p>';
            }
            return '';
        }
        let html = '';
        treeData.forEach(dept => {
            const indent = '  '.repeat(level);
            html += `
                <div class="tree-item" style="padding-left: ${level * 20 + 10}px;">
                    <div>
                        <span class="dept-name">${indent}${dept.deptName}</span>
                        <span class="badge bg-secondary ms-2">${dept.deptCode}</span>
                        ${dept.leaderName ? `<span class="text-muted ms-2">负责人：${dept.leaderName}</span>` : ''}
                    </div>
                    <div class="dept-actions">
                        <button class="btn btn-sm btn-outline-primary" onclick="editDepartment(${dept.id})">编辑</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteDepartment(${dept.id})">删除</button>
                    </div>
                </div>
            `;
            if (dept.children && dept.children.length > 0) {
                html += renderTree(dept.children, level + 1);
            }
        });
        if (level === 0) {
            container.innerHTML = html;
        }
        return html;
    }

    // ===== 打开新增/编辑部门模态框 =====
    async function openDeptModal(deptId) {
        const modal = new bootstrap.Modal(document.getElementById('deptModal'));
        const title = document.getElementById('deptModalTitle');
        // 清空负责人相关
        document.getElementById('leaderId').value = '';
        document.getElementById('leaderName').value = '';
        document.getElementById('deptPhone').value = '';
        document.getElementById('deptEmail').value = '';

        if (deptId) {
            title.textContent = '编辑部门';
            const resp = await fetch(`/api/departments/${deptId}`);
            const data = await resp.json();
            if (data.success) {
                const d = data.data;
                document.getElementById('deptId').value = d.id;
                document.getElementById('deptName').value = d.deptName;
                document.getElementById('deptCode').value = d.deptCode;
                document.getElementById('parentDept').value = d.parentId || 0;
                document.getElementById('deptSort').value = d.sortOrder || 0;
                if (d.leaderId) {
                    // 获取负责人姓名
                    const userResp = await fetch(`/api/users/${d.leaderId}`);
                    const userData = await userResp.json();
                    if (userData.success) {
                        document.getElementById('leaderName').value = userData.data.realName || userData.data.username;
                        document.getElementById('leaderId').value = d.leaderId;
                        document.getElementById('deptPhone').value = userData.data.phone || '';
                        document.getElementById('deptEmail').value = userData.data.email || '';
                    }
                }
            }
        } else {
            title.textContent = '新增部门';
            document.getElementById('deptId').value = '';
            document.getElementById('deptName').value = '';
            document.getElementById('deptCode').value = '';
            document.getElementById('parentDept').value = 0;
            document.getElementById('deptSort').value = 0;
        }

        // 加载上级部门下拉选项
        const parentSelect = document.getElementById('parentDept');
        const resp = await fetch('/api/departments/tree');
        const data = await resp.json();
        if (data.success) {
            const flat = flattenTree(data.data);
            let opts = '<option value="0">无（根部门）</option>';
            flat.forEach(d => {
                if (deptId && d.id == deptId) return;
                const selected = (deptId && d.id === document.getElementById('parentDept').value) ? 'selected' : '';
                opts += `<option value="${d.id}" ${selected}>${d.deptName}</option>`;
            });
            parentSelect.innerHTML = opts;
            if (deptId) {
                const resp2 = await fetch(`/api/departments/${deptId}`);
                const data2 = await resp2.json();
                if (data2.success) {
                    parentSelect.value = data2.data.parentId || 0;
                }
            }
        }
        modal.show();
    }

    function flattenTree(tree) {
        let result = [];
        tree.forEach(node => {
            result.push({ id: node.id, deptName: node.deptName });
            if (node.children) {
                result = result.concat(flattenTree(node.children));
            }
        });
        return result;
    }

    document.getElementById('addDeptBtn').addEventListener('click', function() {
        openDeptModal(null);
    });

    window.editDepartment = function(id) {
        openDeptModal(id);
    };

    window.deleteDepartment = async function(id) {
        const confirm = await Swal.fire({
            title: '确认删除',
            text: '删除部门将同时删除其子部门（如果有），且部门下不能有用户。',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '确认删除',
            cancelButtonText: '取消'
        });
        if (!confirm.isConfirmed) return;
        try {
            const resp = await fetch(`/api/departments/${id}`, { method: 'DELETE' });
            const data = await resp.json();
            if (data.success) {
                Swal.fire('✅ 删除成功', '', 'success');
                loadDepartmentTree();
            } else {
                Swal.fire('❌ 删除失败', data.errMessage, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    };

    // ===== 负责人选择相关 =====
    let currentEmpPage = 1;
    const empPageSize = 10;
    let selectedEmployee = null;

    document.getElementById('selectLeaderBtn').addEventListener('click', function() {
        const modal = new bootstrap.Modal(document.getElementById('employeeSelectModal'));
        modal.show();
        loadEmployees(1);
    });

    document.getElementById('clearLeaderBtn').addEventListener('click', function() {
        document.getElementById('leaderId').value = '';
        document.getElementById('leaderName').value = '';
        document.getElementById('deptPhone').value = '';
        document.getElementById('deptEmail').value = '';
        selectedEmployee = null;
    });

    // 加载员工列表
    async function loadEmployees(page, keyword) {
        const tbody = document.getElementById('employeeTableBody');
        keyword = keyword || document.getElementById('empSearchKeyword').value.trim();
        try {
            const params = new URLSearchParams({ page, size: empPageSize });
            if (keyword) params.append('keyword', keyword);
            const resp = await fetch('/api/users/employees?' + params.toString());
            const data = await resp.json();
            if (!data.success) throw new Error(data.errMessage);
            // 统一信封 + 分页：列表与分页信息都在 data.data（PageResult）
            const pageResult = data.data || {};
            renderEmployeeTable(pageResult.records || []);
            renderEmpPagination(pageResult.total, pageResult.page, pageResult.size);
            currentEmpPage = pageResult.page;
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-danger">加载失败：${err.message}</td></tr>`;
        }
    }

    function renderEmployeeTable(employees) {
        const tbody = document.getElementById('employeeTableBody');
        if (!employees || employees.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">暂无员工数据</td></tr>';
            return;
        }
        let html = '';
        employees.forEach(emp => {
            html += `
                <tr class="employee-row" data-id="${emp.id}" data-name="${emp.realName || emp.username}" data-phone="${emp.phone || ''}" data-email="${emp.email || ''}">
                    <td>${emp.id}</td>
                    <td>${emp.username}</td>
                    <td>${emp.realName || '-'}</td>
                    <td>${emp.email || '-'}</td>
                    <td>${emp.phone || '-'}</td>
                    <td><button class="btn btn-sm btn-primary select-emp-btn">选择</button></td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        // 绑定点击事件
        tbody.querySelectorAll('.employee-row').forEach(row => {
            row.addEventListener('click', function(e) {
                if (e.target.classList.contains('select-emp-btn')) return;
                selectEmployee(this.dataset.id, this.dataset.name, this.dataset.phone, this.dataset.email);
            });
            row.querySelector('.select-emp-btn').addEventListener('click', function(e) {
                e.stopPropagation();
                const tr = this.closest('.employee-row');
                selectEmployee(tr.dataset.id, tr.dataset.name, tr.dataset.phone, tr.dataset.email);
            });
        });
    }

    function renderEmpPagination(total, page, size) {
        const totalPages = Math.ceil(total / size);
        const ul = document.getElementById('empPagination');
        if (totalPages <= 1) {
            ul.innerHTML = '';
            return;
        }
        let html = `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${page - 1}">上一页</a></li>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === page ? 'active' : ''}">
                <a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${page + 1}">下一页</a></li>`;
        ul.innerHTML = html;
        ul.querySelectorAll('a.page-link').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const p = parseInt(this.dataset.page);
                if (p >= 1 && p <= totalPages) {
                    loadEmployees(p);
                }
            });
        });
    }

    function selectEmployee(id, name, phone, email) {
        document.getElementById('leaderId').value = id;
        document.getElementById('leaderName').value = name;
        document.getElementById('deptPhone').value = phone || '';
        document.getElementById('deptEmail').value = email || '';
        selectedEmployee = { id, name, phone, email };
        bootstrap.Modal.getInstance(document.getElementById('employeeSelectModal')).hide();
    }

    // 员工搜索
    document.getElementById('empSearchBtn').addEventListener('click', function() {
        loadEmployees(1);
    });
    document.getElementById('empSearchKeyword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadEmployees(1);
    });

    // ===== 保存部门 =====
    document.getElementById('saveDeptBtn').addEventListener('click', async function() {
        const id = document.getElementById('deptId').value;
        const deptName = document.getElementById('deptName').value.trim();
        const deptCode = document.getElementById('deptCode').value.trim();
        const parentId = parseInt(document.getElementById('parentDept').value) || 0;
        const leaderId = document.getElementById('leaderId').value ? parseInt(document.getElementById('leaderId').value) : null;
        const phone = document.getElementById('deptPhone').value.trim();
        const email = document.getElementById('deptEmail').value.trim();
        const sortOrder = parseInt(document.getElementById('deptSort').value) || 0;

        if (!deptName || !deptCode) {
            Swal.fire('请输入部门名称和编码', '', 'warning');
            return;
        }

        const payload = { id, deptName, deptCode, parentId, leaderId, phone, email, sortOrder };
        if (!id) delete payload.id;

        const method = id ? 'PUT' : 'POST';
        const url = '/api/departments';

        try {
            const resp = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (data.success) {
                Swal.fire('✅ 保存成功', '', 'success');
                bootstrap.Modal.getInstance(document.getElementById('deptModal')).hide();
                loadDepartmentTree();
            } else {
                Swal.fire('❌ 保存失败', data.errMessage, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    });

    // ===== 初始化 =====
    loadDepartmentTree();
</script>
</body>
</html>
