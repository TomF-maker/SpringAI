<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开通账号 - 知行信咨询助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!--
      说明页，而不是注册表单（A4 开户收口）。

      为什么这页不能还留着表单：表单交不了账 —— 后端的 /api/auth/register 已经停用，
      填完点提交只会拿到一句"不开放自助注册"。留着表单等于让客户白填一遍。
      反过来，把表单删了**不等于**接口就安全了：真正的约束在 AuthController.register
      （见 pitfalls.md「前端校验不是约束」），这页只是把话说清楚。

      视觉与 login.html 保持一致（自包含内联样式，不引 app.css）。
    -->
    <style>
        body {
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            position: relative;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            color: #0A2540;
        }
        body::before {
            content: '';
            position: fixed; top: -20%; right: -10%; width: 70%; height: 70%;
            background: radial-gradient(circle, rgba(99, 91, 255, 0.08) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed; bottom: -20%; left: -10%; width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(10, 37, 64, 0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .notice-card {
            position: relative; z-index: 1;
            max-width: 520px; width: 100%;
            padding: 40px 36px 32px;
            background: #fff;
            border-radius: 20px;
            border: 1px solid #E5E7EB;
            box-shadow:
                0 24px 60px rgba(10, 37, 64, 0.12),
                0 8px 24px rgba(10, 37, 64, 0.06),
                0 0 0 1px rgba(99, 91, 255, 0.04);
        }
        .brand-mark {
            width: 56px; height: 56px; margin: 0 auto 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #635BFF 0%, #4F47D6 100%);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow:
                0 8px 24px rgba(99, 91, 255, 0.32),
                0 2px 6px rgba(99, 91, 255, 0.16);
        }
        h1 {
            font-size: 21px; font-weight: 700; letter-spacing: -0.3px;
            text-align: center; margin: 0 0 10px;
        }
        .lede {
            font-size: 14px; line-height: 1.7; color: #425466;
            text-align: center; margin: 0 0 22px;
        }
        .steps { list-style: none; padding: 0; margin: 0 0 22px; }
        .steps li {
            display: flex; gap: 12px; align-items: flex-start;
            padding: 12px 0; border-bottom: 1px dashed #EDF0F4;
            font-size: 13.5px; line-height: 1.65; color: #425466;
        }
        .steps li:last-child { border-bottom: none; }
        .steps .idx {
            flex: 0 0 22px; height: 22px; border-radius: 50%;
            background: rgba(99, 91, 255, 0.10); color: #635BFF;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; margin-top: 1px;
        }
        .contact {
            background: #F7F8FB; border: 1px solid #EDF0F4; border-radius: 12px;
            padding: 14px 16px; font-size: 13.5px; line-height: 1.8; color: #425466;
            margin-bottom: 22px;
        }
        .contact b { color: #0A2540; }
        .todo { color: #B54708; }
        .btn-login {
            display: block; width: 100%;
            padding: 12px 16px; border: none; border-radius: 10px;
            background: #635BFF; color: #fff;
            font-size: 15px; font-weight: 600;
            text-align: center; text-decoration: none;
            box-shadow: 0 8px 20px rgba(99, 91, 255, 0.28);
            transition: background 0.2s ease;
        }
        .btn-login:hover { background: #4F47D6; color: #fff; }
        .foot {
            text-align: center; font-size: 12.5px; color: #8898AA;
            margin-top: 18px; line-height: 1.7;
        }
    </style>
</head>
<body>

<div class="notice-card">
    <div class="brand-mark"><i class="bi bi-building"></i></div>
    <h1>企业客户专用，联系我们开通</h1>
    <p class="lede">
        本系统按客户公司开通与计费，<b>不开放自助注册</b>。<br>
        你的账号由我们统一创建，创建后你会拿到用户名与初始密码。
    </p>

    <ul class="steps">
        <li>
            <span class="idx">1</span>
            <span>联系我们，说明公司名称与统一社会信用代码。</span>
        </li>
        <li>
            <span class="idx">2</span>
            <span>我们为你建立公司空间，并约定<b>服务到期日</b>与<b>账号数（席位）</b>。</span>
        </li>
        <li>
            <span class="idx">3</span>
            <span>账号开通后即可登录使用；初始密码需要<b>首次登录时修改</b>。</span>
        </li>
    </ul>

    <!--
      【待填】把下面这块换成你们真实的联系方式（微信 / 手机 / 邮箱，任一即可）。
      现在写的是提示文字，请务必替换后再对外 —— 客户看到一个没有联系方式的
      "请联系我们"页面，会直接去问对接人，等于这件事白做了。
    -->
    <div class="contact">
        <b>联系方式</b><br>
        邮箱：<span class="todo">［待填写：service@example.com］</span><br>
        电话：<span class="todo">［待填写：000-0000 0000］</span>
    </div>

    <a href="/login" class="btn-login">返回登录</a>
    <div class="foot">已有账号？直接登录即可，本次调整不影响存量账号。</div>
</div>

</body>
</html>
