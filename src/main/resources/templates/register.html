<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* 100dvh + 内边距：手机上浏览器工具栏伸缩时卡片不会被裁掉，也不会贴边 */
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }
        .register-card { max-width: 450px; width: 100%; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .register-card h3 { text-align: center; margin-bottom: 24px; }
        .register-card .btn-primary { width: 100%; }
        .register-card .links { text-align: center; margin-top: 16px; }
        .code-row { display: flex; gap: 8px; }
        .code-row input { flex: 1; }
        .code-row button { flex-shrink: 0; }
        /* 宽高写死：不写的话图加载完会把下面的表单项顶下去。flex-shrink: 0 同理，
           否则窄屏上它会被压扁。 */
        .captcha-img { flex-shrink: 0; width: 130px; height: 48px; border-radius: 6px;
                       background: #f1f5f9; cursor: pointer; }
    </style>
</head>
<body>
<div class="register-card">
    <h3>🛒 注册账号</h3>
    <form id="registerForm">
        <!-- 必填项标注：这里只有「真实姓名」是选填的，不标出来用户只能靠提交试错 -->
        <p class="form-text mb-3">带 <span class="text-danger">*</span> 的为必填项</p>

        <div class="mb-3">
            <label class="form-label" for="username">用户名 <span class="text-danger">*</span></label>
            <input type="text" id="username" class="form-control" placeholder="请设置用户名" required>
        </div>

        <!-- ============ 短信开启：手机号 + 短信验证码 ============ -->
        <th:block th:if="${smsEnabled}">
            <div class="mb-3">
                <label class="form-label" for="phone">手机号 <span class="text-danger">*</span></label>
                <input type="tel" id="phone" class="form-control" placeholder="请输入手机号"
                       maxlength="11" inputmode="numeric" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="code">短信验证码 <span class="text-danger">*</span></label>
                <div class="code-row">
                    <input type="text" id="code" class="form-control" placeholder="请输入6位验证码"
                           maxlength="6" inputmode="numeric" required>
                    <button type="button" id="sendCodeBtn" class="btn btn-outline-primary" disabled>获取验证码</button>
                </div>
                <div class="form-text">先填好下面的图形验证码，这个按钮才会变亮。</div>
            </div>
        </th:block>

        <!-- ============ 短信关闭：邮箱 + 邮箱验证码 ============ -->
        <th:block th:unless="${smsEnabled}">
            <div class="mb-3">
                <label class="form-label" for="email">邮箱 <span class="text-danger">*</span></label>
                <input type="email" id="email" class="form-control" placeholder="请输入邮箱" required>
                <!-- 格式提示的落点。用 text-danger 而不是 d-none 起步的 alert，
                     让"哪里错了"紧贴在出错的那个框下面 -->
                <div class="form-text text-danger d-none" id="emailError"></div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="code">邮箱验证码 <span class="text-danger">*</span></label>
                <div class="code-row">
                    <input type="text" id="code" class="form-control" placeholder="请输入6位验证码"
                           maxlength="6" inputmode="numeric" required>
                    <button type="button" id="sendCodeBtn" class="btn btn-outline-primary" disabled>获取验证码</button>
                </div>
                <div class="form-text">先填好下面的图形验证码，这个按钮才会变亮。</div>
            </div>
        </th:block>

        <!-- ============ 图形验证码 ============
             刻意放在上面两个 th:block **之外**：短信和邮箱两条路都要它。
             放进 th:unless="${smsEnabled}" 里的话，短信开启那天注册页会直接不可用，
             而本地（smsEnabled=false）永远测不出来。 -->
        <div class="mb-3">
            <label class="form-label" for="captchaCode">图形验证码 <span class="text-danger">*</span></label>
            <div class="code-row">
                <input type="text" id="captchaCode" class="form-control" placeholder="请输入图中的字符"
                       maxlength="4" autocomplete="off" spellcheck="false"
                       autocapitalize="characters" required>
                <img id="captchaImg" class="captcha-img" alt="">
            </div>
            <div class="form-text" id="captchaHint">图中 4 位字符，不区分大小写</div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">密码 <span class="text-danger">*</span></label>
            <input type="password" id="password" class="form-control" placeholder="至少8位" required minlength="8">
        </div>
        <div class="mb-3">
            <label class="form-label" for="realName">真实姓名（可选）</label>
            <input type="text" id="realName" class="form-control" placeholder="请输入真实姓名">
        </div>

        <!-- 公司信息：两个都是必填。校验以后端为准，这里只管体验 -->
        <div class="mb-3">
            <label class="form-label" for="companyName">所属公司名称 <span class="text-danger">*</span></label>
            <input type="text" id="companyName" class="form-control"
                   placeholder="请输入公司全称" maxlength="128" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="creditCode">统一社会信用代码 <span class="text-danger">*</span></label>
            <input type="text" id="creditCode" class="form-control"
                   placeholder="营业执照上的 18 位代码" maxlength="18" required
                   autocomplete="off" spellcheck="false"
                   style="text-transform: uppercase; letter-spacing: 1px; font-family: ui-monospace, Consolas, monospace;">
            <div class="form-text">
                含校验位，填错会注册失败。<b>同公司的同事请填同一个代码</b>，系统据此自动归到同一家公司。
            </div>
        </div>

        <!-- 短信关闭时邮箱已经在上面的必填块里了，这里只在开启时作为可选项出现。
             留空不报错，但只要填了就要是合法地址 —— 留个打错的邮箱比留空更糟：
             本人以为能靠它找回密码，实际那个地址根本收不到信。 -->
        <div class="mb-3" th:if="${smsEnabled}">
            <label class="form-label" for="email">邮箱（可选，用于找回密码）</label>
            <input type="email" id="email" class="form-control" placeholder="请输入邮箱">
            <div class="form-text text-danger d-none" id="emailError"></div>
        </div>

        <div id="registerError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary">注 册</button>
    </form>
    <div class="links">
        <a href="/login">已有账号？立即登录</a>
    </div>
</div>

<script src="/js/captcha.js?v=1"></script>
<script th:inline="javascript">
    // 由服务端注入：决定走「手机号 + 短信验证码」还是「邮箱 + 邮箱验证码」
    const SMS_ENABLED = /*[[${smsEnabled}]]*/ false;

    let countdown = 0;
    const sendBtn = document.getElementById('sendCodeBtn');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('emailError');

    // 和服务端 common/EmailFormat 里那串**一模一样**。两处不一致的话，
    // 会变成"前端放过去、后端拒绝"（用户看到一个和输入框无关的报错）或者反过来。
    const EMAIL_RE = new RegExp("^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)*\\.[a-zA-Z]{2,}$");
    const EMAIL_MAX_LENGTH = 100;   // 同 EmailFormat.MAX_LENGTH / sys_user.email 列宽

    /**
     * 返回邮箱的问题描述，没问题返回 null。
     *
     * 空值算不算错取决于模式：短信关闭时邮箱是必填的，开启时是选填的。
     * 但**只要填了就必须合法** —— 留个打错的邮箱比留空更糟，本人以为能靠它找回密码，
     * 实际那个地址根本收不到信。
     */
    function emailProblem() {
        const value = emailInput.value.trim();
        if (!value) {
            return SMS_ENABLED ? null : '请填写邮箱';
        }
        if (value.length > EMAIL_MAX_LENGTH) {
            return '邮箱太长了（最多 ' + EMAIL_MAX_LENGTH + ' 个字符）';
        }
        if (!EMAIL_RE.test(value)) {
            return '邮箱格式不正确，例如 name@company.com';
        }
        return null;
    }

    function showEmailError() {
        const message = emailProblem();
        if (emailError) {
            emailError.textContent = message || '';
            emailError.classList.toggle('d-none', !message);
        }
        return message;
    }

    // 失焦时报错（不打断输入）。已经在报错的状态下才跟着输入边打边清 ——
    // 否则刚点进输入框就红一片，很吵。
    emailInput.addEventListener('blur', showEmailError);
    emailInput.addEventListener('input', function () {
        if (emailError && !emailError.classList.contains('d-none')) {
            showEmailError();
        }
    });

    // ==================== 图形验证码 ====================
    // 两条发码路径（短信 / 邮箱）都要求它。

    // 按钮该不该亮：图码填好了、且不在倒计时里。
    // **唯一的开关点** —— 别在别处直接写 sendBtn.disabled，两处打架的话
    // 会出现"填好了却还是灰的"这种查不出原因的状态。
    let captchaReady = false;
    function refreshSendBtn() {
        sendBtn.disabled = countdown > 0 || !captchaReady;
    }

    // captcha.js 没加载出来时的退路。
    //
    // 不挡的话，这一行 `createCaptcha(...)` 会直接抛异常，**整个内联脚本都死掉** ——
    // 连表单提交、倒计时都一起没了，而页面上没有任何提示。
    // 退化成"控件不工作、但按钮还能点"，让服务端去拒（它会回一句清楚的
    // "图形验证码错误或已过期"），比一个安静死掉的页面强。
    const NO_CAPTCHA_SCRIPT = {
        refresh: function () { return Promise.resolve(false); },
        payload: function () { return {}; },
        reset: function () {}
    };
    const HAS_CAPTCHA_SCRIPT = typeof createCaptcha === 'function';
    if (!HAS_CAPTCHA_SCRIPT) {
        console.error('[register] captcha.js 未加载，图形验证码不可用，本次交回服务端校验');
    }

    const captcha = HAS_CAPTCHA_SCRIPT
        ? createCaptcha({
            imgId: 'captchaImg',
            inputId: 'captchaCode',
            hintId: 'captchaHint',
            onError: function (msg) { alert(msg); },
            onChange: function (ready) { captchaReady = ready; refreshSendBtn(); }
        })
        : NO_CAPTCHA_SCRIPT;

    // 脚本没加载出来就别让按钮一直是灰的（那样等于整个注册页不可用，还没有任何报错）
    captchaReady = !HAS_CAPTCHA_SCRIPT;
    refreshSendBtn();

    captcha.refresh();

    function startCountdown() {
        countdown = 60;
        sendBtn.disabled = true;
        sendBtn.textContent = countdown + 's';   // 立刻变，别等第一秒过去还写着"获取验证码"
        const interval = setInterval(() => {
            countdown--;
            sendBtn.textContent = countdown + 's';
            if (countdown <= 0) {
                clearInterval(interval);
                sendBtn.textContent = '获取验证码';
                // 倒计时结束不等于能点：图码那栏可能还是空的（发送成功后刚被清掉），
                // 所以这里交给 refreshSendBtn 判，不要直接 disabled = false
                refreshSendBtn();
            }
        }, 1000);
    }

    sendBtn.addEventListener('click', async function () {
        if (countdown > 0) return;

        let url, body;
        if (SMS_ENABLED) {
            const phone = document.getElementById('phone').value.trim();
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请先填写正确的手机号');
                return;
            }
            url = '/api/auth/send-sms-code';
            body = { phone: phone, scene: 'register' };
        } else {
            // 用内联提示而不是 alert：错误要贴在出错的那个框下面
            if (showEmailError()) {
                emailInput.focus();
                return;
            }
            url = '/api/auth/send-code';
            body = { email: emailInput.value.trim(), type: 'register' };
        }

        // 图形验证码是**必填**的。还没签发成功就直接本地拦住 ——
        // 发个 null 上去只会换来一句看不懂的"图形验证码错误或已过期"。
        const cp = captcha.payload();
        if (!cp || !cp.captchaId) {
            alert('图形验证码未加载，请点击图片刷新后再试');
            return;
        }
        body.captchaId = cp.captchaId;
        body.captchaCode = cp.captchaCode;

        sendBtn.disabled = true;
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();

            // 统一信封：成功看 success，失败信息在 errMessage。
            // 服务端故障（SMTP 挂了等）会是 HTTP 500 + success:false，这里也能接住。
            if (data.success) {
                alert(SMS_ENABLED ? '验证码已发送' : '验证码已发送到您的邮箱');
                await captcha.refresh();
                startCountdown();
            } else {
                alert(data.errMessage || '发送失败');
                // 图形验证码是一次性的：被限流拒绝时它也已经消耗掉了，
                // 不换一张的话用户第二次点必然报"图形验证码错误"。
                // refresh 会清空输入框 → 按钮重新变灰，用户得再认一张 —— 这是对的。
                await captcha.refresh();
            }
        } catch (err) {
            alert('网络错误');
            await captcha.refresh();
        }
        // 统一收口：这里不写 sendBtn.disabled = false，交给 refreshSendBtn 判
        // （图码那栏是空的就该继续灰着）
        refreshSendBtn();
    });

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const errorDiv = document.getElementById('registerError');
        errorDiv.classList.add('d-none');

        // 邮箱格式先拦一道，提示贴在邮箱框下面。
        // 浏览器对 type="email" 本来也有原生校验，但原生提示是浏览器样式的一闪而过的小气泡，
        // 而且短信开启时邮箱是选填的、留空会被放过 —— 这里给的是自己的、留在页面上的提示。
        // （服务端 register 有同样的校验，这里只是体验。）
        if (showEmailError()) {
            emailInput.focus();
            return;
        }

        const data = {
            username: document.getElementById('username').value,
            code: document.getElementById('code').value,
            password: document.getElementById('password').value,
            realName: document.getElementById('realName').value,
            companyName: document.getElementById('companyName').value.trim(),
            // 后端会再归一化一次（trim + 转大写）并验校验位，这里先统一大小写，
            // 免得用户看着自己输入的小写码疑惑为什么"格式不对"
            creditCode: document.getElementById('creditCode').value.trim().toUpperCase()
        };
        if (SMS_ENABLED) {
            data.phone = document.getElementById('phone').value;
            data.email = emailInput.value.trim() || null;
        } else {
            // trim：和 /send-code 发码时用的必须完全一致，否则验证码存在
            // verify:code:<带空格的> 而注册查的是 <不带空格的>，永远验不过
            data.email = emailInput.value.trim();
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            // 注意：注册接口校验失败时返回的仍是 HTTP 200，
            // 只是 body 里 success=false。所以不能只看 response.ok，
            // 否则失败也会提示"注册成功"。
            if (result.success) {
                alert('注册成功！请登录');
                window.location.href = '/login';
            } else {
                errorDiv.textContent = result.errMessage || '注册失败';
                errorDiv.classList.remove('d-none');
            }
        } catch (err) {
            errorDiv.textContent = '网络错误';
            errorDiv.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
