<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { max-width: 400px; width: 100%; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .login-card h3 { text-align: center; margin-bottom: 24px; }
        .login-card .btn-primary { width: 100%; }
        .login-card .links { text-align: center; margin-top: 16px; }
    </style>
</head>
<body>
<div class="login-card">
    <h3>🛒 采购智能助手</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">用户名 / 邮箱</label>
            <input type="text" id="username" class="form-control" placeholder="请输入用户名或邮箱" required>
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary">登 录</button>
    </form>
    <div class="links">
        <a href="/register">还没有账号？立即注册</a>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');
        errorDiv.classList.add('d-none');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await response.json();
            if (response.ok) {
                // 存储 Token 和用户信息
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                localStorage.setItem('realName', data.realName);
                localStorage.setItem('userId', data.userId);
                window.location.href = '/chat';
            } else {
                errorDiv.textContent = data.message || '登录失败，请重试';
                errorDiv.classList.remove('d-none');
            }
        } catch (err) {
            errorDiv.textContent = '网络错误，请稍后重试';
            errorDiv.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
