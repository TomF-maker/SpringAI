<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* 100dvh + 内边距：手机上浏览器工具栏伸缩时卡片不会被裁掉，也不会贴边 */
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
        }
        .login-card { max-width: 400px; width: 100%; padding: 30px; background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .login-card h3 { text-align: center; margin-bottom: 24px; }
        .login-card .btn-primary { width: 100%; }
        .login-card .links { text-align: center; margin-top: 16px; }
        .forgot-link { font-size: 13px; color: #64748b; text-decoration: none; }
        .forgot-link:hover { color: #1a73e8; text-decoration: underline; }
        .code-row { display: flex; gap: 8px; }
        .code-row input { flex: 1; }
        .code-row button { flex-shrink: 0; }
        /* 宽高写死：不写的话图加载完会把下面的按钮顶下去。flex-shrink: 0 同理，
           否则窄屏上它会被压扁。 */
        .captcha-img { flex-shrink: 0; width: 130px; height: 48px; border-radius: 6px;
                       background: #f1f5f9; cursor: pointer; }
        .hint { font-size: 13px; color: #64748b; }
    </style>
</head>
<body>
<div class="login-card">
    <h3>🛒 采购智能助手</h3>

    <!-- ============ 第一步：账号密码 ============ -->
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">用户名 / 邮箱</label>
            <input type="text" id="username" class="form-control" placeholder="请输入用户名或邮箱" required>
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" id="password" class="form-control" placeholder="请输入密码" required>
            <!-- 放在密码框正下方：用户是在这里发现自己想不起密码的，
                 放到页面底部的 links 里要多扫一眼才找得到 -->
            <div class="text-end mt-1">
                <a href="/forgot-password" class="forgot-link">忘记密码？</a>
            </div>
        </div>
        <div id="loginError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary">登 录</button>
    </form>

    <!-- ============ 第二步：手机验证码（异地登录 / 补绑手机号） ============ -->
    <form id="verifyForm" class="d-none">
        <div class="alert alert-warning py-2" id="verifyTip"></div>

        <!-- BIND 场景才需要填手机号；VERIFY 场景号码由服务端解析，不回传给前端 -->
        <div class="mb-3 d-none" id="phoneGroup">
            <label class="form-label">手机号</label>
            <input type="tel" id="bindPhone" class="form-control" placeholder="请输入手机号" maxlength="11">
        </div>

        <div class="mb-3">
            <label class="form-label">短信验证码</label>
            <div class="code-row">
                <input type="text" id="smsCode" class="form-control" placeholder="6 位验证码"
                       maxlength="6" inputmode="numeric">
                <button type="button" class="btn btn-outline-primary" id="sendCodeBtn" disabled>获取验证码</button>
            </div>
        </div>

        <!-- 图形验证码：发短信验证码那一步的必填项，是两个不同的框，别填错 -->
        <div class="mb-3">
            <label class="form-label">图形验证码</label>
            <div class="code-row">
                <input type="text" id="captchaCode" class="form-control" placeholder="请输入图中的字符"
                       maxlength="4" autocomplete="off" spellcheck="false"
                       autocapitalize="characters">
                <img id="captchaImg" class="captcha-img" alt="">
            </div>
            <div class="form-text" id="captchaHint">图中 4 位字符，不区分大小写</div>
        </div>

        <div id="verifyError" class="alert alert-danger d-none"></div>
        <button type="submit" class="btn btn-primary">验 证</button>
        <div class="links">
            <a href="#" id="backToLogin">返回重新登录</a>
        </div>
    </form>

    <div class="links" id="registerLink">
        <a href="/register">还没有账号？立即注册</a>
    </div>
</div>

<script src="/js/captcha.js?v=1"></script>
<script>
    const loginForm = document.getElementById('loginForm');
    const verifyForm = document.getElementById('verifyForm');
    const loginError = document.getElementById('loginError');
    const verifyError = document.getElementById('verifyError');
    const verifyTip = document.getElementById('verifyTip');
    const phoneGroup = document.getElementById('phoneGroup');
    const bindPhone = document.getElementById('bindPhone');
    const smsCode = document.getElementById('smsCode');
    const sendCodeBtn = document.getElementById('sendCodeBtn');
    const registerLink = document.getElementById('registerLink');

    // 当前登录挑战
    let challengeId = null;
    let challengeScene = null;
    let countdownTimer = null;

    // 图形验证码。**刻意不在页面加载时就签发** —— 第一步是密码表单，
    // 用户可能几分钟后才走到第二步，那时这张图早过期了，第一次点"获取验证码"必然失败。
    // 签发时机在 enterVerifyStep()。
    //
    // captcha.js 没加载出来时的退路见 register.html 里的同款注释
    const NO_CAPTCHA_SCRIPT = {
        refresh: function () { return Promise.resolve(false); },
        payload: function () { return {}; },
        reset: function () {}
    };
    const HAS_CAPTCHA_SCRIPT = typeof createCaptcha === 'function';
    if (!HAS_CAPTCHA_SCRIPT) {
        console.error('[login] captcha.js 未加载，图形验证码不可用，本次交回服务端校验');
    }

    let captchaReady = false;

    /**
     * 发送按钮该不该亮：图码填好了、且不在倒计时里。**唯一的开关点。**
     *
     * 第一步的表单不受影响 —— 这个按钮只属于第二步的 verifyForm。
     */
    function refreshSendBtn() {
        sendCodeBtn.disabled = countdownTimer !== null || !captchaReady;
    }

    const captcha = HAS_CAPTCHA_SCRIPT
        ? createCaptcha({
            imgId: 'captchaImg',
            inputId: 'captchaCode',
            hintId: 'captchaHint',
            onError: function (msg) { showError(verifyError, msg); },
            onChange: function (ready) { captchaReady = ready; refreshSendBtn(); }
        })
        : NO_CAPTCHA_SCRIPT;

    captchaReady = !HAS_CAPTCHA_SCRIPT;
    refreshSendBtn();

    function showError(el, message) {
        el.textContent = message;
        el.classList.remove('d-none');
    }

    /**
     * 保存登录态并跳转。入参是服务端的统一信封 {success, errCode, errMessage, data}。
     *
     * 这里**必须**先校验 token 真的存在再跳转：如果哪天登录失败被返回成
     * HTTP 200 + success:false，无条件 setItem 会把字符串 "undefined" 存成 token
     * 然后跳到 /chat —— 登录失败会表现成登录成功，且之后每个请求都 401。
     */
    function saveAndGo(envelope) {
        const data = envelope && envelope.data;
        if (!data || !data.token) {
            showError(loginError, (envelope && envelope.errMessage) || '登录失败，请重试');
            return;
        }
        localStorage.setItem('token', data.token);
        localStorage.setItem('username', data.username);
        localStorage.setItem('realName', data.realName);
        localStorage.setItem('userId', data.userId);
        window.location.href = '/chat';
    }

    function resetToLogin() {
        challengeId = null;
        challengeScene = null;
        if (countdownTimer) {
            clearInterval(countdownTimer);
            countdownTimer = null;
        }
        // 不直接写 disabled = false：图码那栏已经被 reset 清空了，按钮该继续灰着，
        // 交给 refreshSendBtn 判（captcha.reset() 也会回调到这里）
        refreshSendBtn();
        sendCodeBtn.textContent = '获取验证码';
        smsCode.value = '';
        if (bindPhone) bindPhone.value = '';
        verifyForm.classList.add('d-none');
        loginForm.classList.remove('d-none');
        registerLink.classList.remove('d-none');
        // 回到第一步就作废这张图，下次进第二步会重新签发；
        // 不清的话第二次进来用的还是已被消费的 captchaId，必然报"图形验证码错误"。
        captcha.reset();
    }

    // ================================================================
    // 第一步：账号密码
    // ================================================================
    loginForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        loginError.classList.add('d-none');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const envelope = await response.json();

            // 统一信封：失败看 success（密码错是 HTTP 401 + success:false）
            if (!envelope.success) {
                showError(loginError, envelope.errMessage || '登录失败，请重试');
                return;
            }

            const data = envelope.data;

            // 关键分支：密码通过了，但需要手机验证码二次验证。
            // 不判这个标志位就会把 "undefined" 当 token 存起来再跳转。
            if (data.requirePhoneVerify) {
                enterVerifyStep(data);
                return;
            }

            saveAndGo(envelope);
        } catch (err) {
            showError(loginError, '网络错误，请稍后重试');
        }
    });

    function enterVerifyStep(data) {
        challengeId = data.challengeId;
        challengeScene = data.scene;

        // 到这一步才签发图形验证码（理由见文件上方 captcha 的声明处）。
        // 故意不 await：签发是网络请求，失败会走 onError 提示，不该卡住表单切换。
        captcha.refresh();

        loginForm.classList.add('d-none');
        registerLink.classList.add('d-none');
        verifyForm.classList.remove('d-none');
        verifyError.classList.add('d-none');

        if (challengeScene === 'BIND') {
            verifyTip.textContent = '为保障账号安全，请先绑定手机号。';
            phoneGroup.classList.remove('d-none');
        } else {
            verifyTip.textContent = '检测到本次登录来自新的网络环境，请使用手机号 '
                + (data.maskedPhone || '') + ' 完成验证。';
            phoneGroup.classList.add('d-none');
        }
    }

    // ================================================================
    // 第二步：发送验证码
    // ================================================================
    sendCodeBtn.addEventListener('click', async function () {
        // 倒计时期间不重复发（另两个页面本来就有这道判断，这里缺了）
        if (countdownTimer) return;

        verifyError.classList.add('d-none');

        const body = { challengeId: challengeId };
        if (challengeScene === 'BIND') {
            const phone = bindPhone.value.trim();
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                showError(verifyError, '请输入正确的手机号');
                return;
            }
            body.phone = phone;
            body.scene = 'bind';
        }

        // 图形验证码是**必填**的。还没签发成功就直接本地拦住 ——
        // 发个 null 上去只会换来一句看不懂的"图形验证码错误或已过期"。
        const cp = captcha.payload();
        if (!cp || !cp.captchaId) {
            showError(verifyError, '图形验证码未加载，请点击图片刷新后再试');
            return;
        }
        body.captchaId = cp.captchaId;
        body.captchaCode = cp.captchaCode;

        sendCodeBtn.disabled = true;
        try {
            const response = await fetch('/api/auth/send-sms-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();

            if (!data.success) {
                showError(verifyError, data.errMessage || '验证码发送失败');
                // 图形验证码是一次性的：被限流拒绝时它也已经消耗掉了，
                // 不换一张的话用户第二次点必然报"图形验证码错误"。
                // refresh 会清空输入框 → 按钮重新变灰，用户得再认一张 —— 这是对的。
                await captcha.refresh();
                refreshSendBtn();
                return;
            }
            await captcha.refresh();
            startCountdown();
        } catch (err) {
            showError(verifyError, '网络错误，请稍后重试');
            await captcha.refresh();
            refreshSendBtn();
        }
    });

    function startCountdown() {
        let seconds = 60;
        sendCodeBtn.textContent = seconds + ' 秒后重发';
        countdownTimer = setInterval(function () {
            // （下面 refreshSendBtn 要读到非 null 的 countdownTimer，所以先赋值再调）
            seconds -= 1;
            if (seconds <= 0) {
                clearInterval(countdownTimer);
                countdownTimer = null;
                // 倒计时结束不等于能点：图码那栏可能还是空的，交给 refreshSendBtn 判
                refreshSendBtn();
                sendCodeBtn.textContent = '获取验证码';
            } else {
                sendCodeBtn.textContent = seconds + ' 秒后重发';
            }
        }, 1000);
        // 别依赖调用方先把按钮置灰 —— 另两个页面的 startCountdown 自己就设了，
        // 这里漏掉的话，任何直接调它的地方都会在倒计时期间留一个可点的按钮。
        refreshSendBtn();
    }

    // ================================================================
    // 第二步：提交验证码
    // ================================================================
    verifyForm.addEventListener('submit', async function (e) {
        e.preventDefault();
        verifyError.classList.add('d-none');

        const code = smsCode.value.trim();
        if (!/^\d{6}$/.test(code)) {
            showError(verifyError, '请输入 6 位数字验证码');
            return;
        }

        const body = { challengeId: challengeId, code: code };
        if (challengeScene === 'BIND') {
            body.phone = bindPhone.value.trim();
        }

        try {
            const response = await fetch('/api/auth/verify-login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const envelope = await response.json();

            if (!envelope.success) {
                showError(verifyError, envelope.errMessage || '验证失败，请重试');
                return;
            }
            saveAndGo(envelope);
        } catch (err) {
            showError(verifyError, '网络错误，请稍后重试');
        }
    });

    document.getElementById('backToLogin').addEventListener('click', function (e) {
        e.preventDefault();
        resetToLogin();
    });
</script>
</body>
</html>
