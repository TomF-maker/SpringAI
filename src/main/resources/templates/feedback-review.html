<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>意见审核 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=3">
    <style>
        .content-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .filter-bar .form-control, .filter-bar .form-select { width: auto; min-width: 150px; }

        .rating-pill {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 12px; white-space: nowrap;
        }
        .rating-pill.neg { background: #fde8e8; color: #b42318; }
        .rating-pill.mid { background: #fff4e5; color: #92400e; }
        .rating-pill.pos { background: #e7f6ec; color: #1a7f37; }

        .status-pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
        .status-pill.PENDING  { background: #fff3cd; color: #856404; }
        .status-pill.ACCEPTED { background: #d4edda; color: #155724; }
        .status-pill.REJECTED { background: #f1f3f5; color: #6b7280; }

        .hit-tag {
            display: inline-block; padding: 1px 7px; border-radius: 8px;
            font-size: 11px; background: #eef2f7; color: #64748b;
        }
        .cell-clip {
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; overflow-wrap: anywhere; max-width: 320px;
        }

        /* 审核弹窗里"原问题 / 原回答"的展示块 —— 管理员就是靠这两块判断建议合不合理 */
        .ctx-block { background: #f8fafc; border: 1px solid #eef2f7; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
        .ctx-block .ctx-label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        .ctx-block .ctx-body { font-size: 13px; color: #1e293b; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 200px; overflow-y: auto; }

        .tier-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .tier-btn { border: 1px solid #dbe3ec; background: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; text-align: center; }
        .tier-btn .t-name { display: block; font-size: 13px; color: #475569; }
        .tier-btn .t-points { display: block; font-size: 12px; color: #1a73e8; font-weight: 600; }
        .tier-btn.active { border-color: #1a73e8; background: #f4f8ff; }

        @media (max-width: 991.98px) {
            .filter-bar { gap: 8px; }
            .table-responsive { font-size: 13px; }
            .cell-clip { max-width: 180px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('feedback-review')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容 -->
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('📝 意见审核')}"></div>

        <div class="content-card">
            <div class="filter-bar">
                <input type="text" id="keyword" class="form-control form-control-sm"
                       placeholder="🔍 搜索意见内容" style="flex:1; min-width:200px;">
                <!-- 默认选中"全部"：一进页面先看到全量，再自己收窄 -->
                <select id="statusFilter" class="form-select form-select-sm">
                    <option value="">全部</option>
                    <option value="PENDING">待审核</option>
                    <option value="ACCEPTED">已采纳</option>
                    <option value="REJECTED">已驳回</option>
                </select>
                <button class="btn btn-sm btn-primary" id="searchBtn"><i class="bi bi-search"></i> 搜索</button>
                <button class="btn btn-sm btn-outline-secondary" id="resetBtn"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
                <span class="text-muted small ms-auto" id="summary">加载中…</span>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width:140px;">提交时间</th>
                        <th style="width:120px;">提问人</th>
                        <th style="width:110px;">评价</th>
                        <th>优化意见</th>
                        <th style="width:100px;">状态</th>
                        <th style="width:90px;">奖励</th>
                        <th style="width:120px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="suggestionBody">
                    <tr><td colspan="7" class="text-center text-muted py-4">⏳ 加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <nav aria-label="Page navigation" class="mt-3">
                <div id="pagerBar"></div>
            </nav>
        </div>
    </div>
</div>

<!-- ========== 审核弹窗 ========== -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-clipboard-check"></i> 审核优化意见</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- 原问题与原回答：判断建议合不合理必须看到这两块 -->
                <div class="ctx-block">
                    <div class="ctx-label">原问题</div>
                    <div class="ctx-body" id="rvQuestion"></div>
                </div>
                <div class="ctx-block">
                    <div class="ctx-label">原回答 <span id="rvHitType"></span></div>
                    <div class="ctx-body" id="rvAnswer"></div>
                </div>
                <div class="ctx-block">
                    <div class="ctx-label">用户提出的优化意见（<span id="rvRating"></span>）</div>
                    <div class="ctx-body" id="rvSuggestion"></div>
                </div>

                <!-- 已审核：只展示结果，**不展示任何可操作控件**。
                     之前这些控件只是 disabled，看着仍然像"还能点"，点「查看」的人
                     会以为可以重新裁决一次。 -->
                <div class="ctx-block d-none" id="rvResultBlock">
                    <div class="ctx-label">审核结果</div>
                    <div class="ctx-body" id="rvResult"></div>
                </div>

                <!-- 待审核才出现的操作区，整体隐藏用 -->
                <div id="rvActionBlock">
                    <div class="mb-3">
                        <label class="form-label">积分奖励档位</label>
                        <div class="tier-row" id="tierRow"></div>
                        <div class="form-text">选「自定义」时才需要填具体分值。</div>
                    </div>
                    <!-- 只在选中「自定义」档位时出现（openReview / tierRow 的点击处理里切换）。
                         之前它是常驻的，和档位按钮各管一半，用户分不清哪个优先。 -->
                    <div class="mb-3 d-none" id="rvCustomBlock">
                        <label class="form-label" for="rvCustomPoints">自定义积分</label>
                        <input type="number" class="form-control" id="rvCustomPoints"
                               min="2" max="10000" step="1" placeholder="例如：150">
                        <div class="form-text">必须是大于 1 的整数，最多 10000。</div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">审核备注（可选，会展示给用户）</label>
                        <textarea class="form-control" id="rvRemark" rows="2" maxlength="500"
                                  placeholder="例如：已根据该建议补充了知识库文档"></textarea>
                    </div>
                </div>
                <input type="hidden" id="rvSuggestionId">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" id="rvCancelBtn">取消</button>
                <!-- 两个操作按钮在「查看」已审核条目时整体隐藏，见 openReview -->
                <button class="btn btn-outline-danger" id="rejectBtn"><i class="bi bi-x-circle"></i> 驳回</button>
                <button class="btn btn-primary" id="acceptBtn"><i class="bi bi-check2-circle"></i> 采纳并发放积分</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=4"></script>
<script>
    // ================================================================
    // 1. 认证检查（与用户管理页一致：仅管理员）
    // ================================================================
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';
    if (localStorage.getItem('username') !== 'admin') {
        alert('⚠️ 仅管理员可访问此页面');
        window.location.href = '/chat';
    }

    // ================================================================
    // 2. 全局 fetch 拦截器（自动携带 Token）
    // ================================================================
    const originalFetch = window.fetch;
    window.fetch = function (...args) {
        const url = args[0];
        if (typeof url === 'string' && url.includes('/api/auth/')) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        const currentToken = localStorage.getItem('token');
        if (currentToken) {
            options.headers['Authorization'] = `Bearer ${currentToken}`;
        }
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // ================================================================
    // 3. 忽略 XSS：本页展示的是用户提交的文本，一律转义后再拼 HTML
    // ================================================================
    function esc(text) {
        if (text == null) return '';
        return String(text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ================================================================
    // 4. 状态
    // ================================================================
    /** 空串 = 全部。一进页面默认展示全部，不再默认只看待审核。 */
    let currentStatus = '';
    let currentPage = 1;
    // 用 let 而不是 const：分页栏上的"每页条数"选择器会改它
    let pageSize = 10;
    let reviewModalInstance = null;
    let currentRow = null;
    /** 当前页数据。点击"审核"时从这里取回整行，不用再请求一次。 */
    let lastRows = [];
    let selectedTier = null;
    // CUSTOM 的 points 是 null —— 它没有固定分值，靠输入框填。
    // 放进同一个数组是为了让它和三个固定档位**并排渲染成一个选择器**，
    // 而不是像之前那样"档位按钮 + 另一个独立的可选输入框"两个控件各管一半，
    // 用户根本分不清哪个优先。
    let tiers = [
        { value: 'SMALL', label: '小改进', points: 50 },
        { value: 'MEDIUM', label: '有价值', points: 100 },
        { value: 'LARGE', label: '重大改进', points: 200 },
        { value: 'CUSTOM', label: '自定义', points: null }
    ];

    /**
     * 读自定义积分并校验。
     *
     * <p>用正则**整串匹配**，不能只 {@code parseInt} —— {@code parseInt('12abc')}
     * 会静默得到 12，把明显非法的输入当成合法值发出去。
     *
     * <p>下限是 2 而不是 1：后端 {@code resolveAwardPoints} 用的是同一套规则，
     * 两边必须一致。**后端那个才是约束**，这里只是别让用户白填一遍。
     *
     * @return {{value:number}|{error:string}}
     */
    function readCustomPoints() {
        const raw = document.getElementById('rvCustomPoints').value.trim();
        if (!raw) return { error: '请填写自定义积分' };
        if (!/^\d+$/.test(raw)) return { error: '自定义积分只能是正整数（不能带小数点、负号或其它字符）' };
        const n = parseInt(raw, 10);
        if (n <= 1) return { error: '自定义积分必须大于 1' };
        if (n > 10000) return { error: '自定义积分不能超过 10000' };
        return { value: n };
    }

    function ratingClass(rating) {
        if (rating === 'NOT_HELPFUL' || rating === 'USELESS') return 'neg';
        if (rating === 'NEUTRAL') return 'mid';
        return 'pos';
    }

    // ================================================================
    // 5. 加载列表
    // ================================================================
    async function loadSuggestions(page = 1) {
        currentPage = page;
        const keyword = document.getElementById('keyword').value.trim();
        const params = new URLSearchParams({ page: page, size: pageSize });
        if (currentStatus) params.append('status', currentStatus);
        if (keyword) params.append('keyword', keyword);

        try {
            const resp = await fetch('/api/admin/feedback/suggestions?' + params.toString());
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (!data.success) throw new Error(data.errMessage || '加载失败');

            const pr = data.data || {};
            renderTable(pr.records || []);
            renderPagination(pr.total || 0, pr.page || 1, pr.size || pageSize);
            document.getElementById('summary').textContent = `共 ${pr.total || 0} 条`;
        } catch (err) {
            document.getElementById('suggestionBody').innerHTML =
                `<tr><td colspan="7" class="text-center text-danger py-4">❌ 加载失败：${esc(err.message)}</td></tr>`;
        }
    }

    function renderTable(rows) {
        lastRows = rows;
        const tbody = document.getElementById('suggestionBody');
        if (!rows.length) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">暂无数据</td></tr>`;
            return;
        }
        tbody.innerHTML = rows.map(r => `
            <tr>
                <td class="text-muted small">${esc((r.createdAt || '').replace('T', ' ').substring(0, 16))}</td>
                <td>${esc(r.realName || r.username || '-')}
                    <div class="text-muted small">积分 ${r.userPoints == null ? 0 : r.userPoints}</div>
                </td>
                <td><span class="rating-pill ${ratingClass(r.rating)}">${esc(r.ratingLabel || r.rating || '-')}</span></td>
                <td>
                    <div class="cell-clip" title="${esc(r.content)}">${esc(r.content)}</div>
                    <div class="text-muted small mt-1" title="${esc(r.question)}">问：${esc(r.question || '-')}</div>
                </td>
                <td><span class="status-pill ${esc(r.status)}">${
                    r.status === 'PENDING' ? '待审核' : (r.status === 'ACCEPTED' ? '已采纳' : '已驳回')}</span></td>
                <td>${r.awardedPoints != null ? '+' + r.awardedPoints : '-'}</td>
                <td>
                    <button class="btn btn-sm ${r.status === 'PENDING' ? 'btn-primary' : 'btn-outline-secondary'}"
                            data-review="${r.id}">
                        ${r.status === 'PENDING' ? '审核' : '查看'}
                    </button>
                </td>
            </tr>
        `).join('');
    }

    /**
     * 渲染分页。实现在 app.js 的 window.Pager —— 四个列表页共用一套，
     * 之前每页各写各的，行为还不一样（有的隐藏总页数≤1、有的把所有页码都铺出来）。
     */
    function renderPagination(total, page, size) {
        Pager.render({
            containerId: 'pagerBar',
            total: total,
            page: page,
            size: size,
            unit: '条',
            onChange: function (newPage, newSize) {
                pageSize = newSize;      // 换了每页条数要记住，否则翻页时又变回去
                loadSuggestions(newPage);
            }
        });
    }

    // ================================================================
    // 6. 审核弹窗
    // ================================================================
    function renderTiers() {
        document.getElementById('tierRow').innerHTML = tiers.map(t => `
            <div class="tier-btn ${selectedTier === t.value ? 'active' : ''}" data-tier="${t.value}">
                <span class="t-name">${esc(t.label)}</span>
                <span class="t-points">${t.points == null ? '自填' : '+' + t.points}</span>
            </div>
        `).join('');
    }

    /**
     * 把已审核的条目描述成一句话，替代那些不该出现的操作控件。
     *
     * <p>不补这块的话，已审核的弹窗会只剩"原问题/原回答/建议"三块，
     * 用户点「查看」看不到任何审核结论 —— 那是另一种形式的困惑。
     * 换行靠 .ctx-body 的 white-space: pre-wrap 生效。
     */
    function describeReviewResult(row) {
        const when = row.reviewedAt ? new Date(row.reviewedAt).toLocaleString('zh-CN') : '';
        const head = row.status === 'ACCEPTED'
            ? '✅ 已采纳' + (row.awardedPoints ? '，发放 ' + row.awardedPoints + ' 积分' : '')
            : '🚫 已驳回';
        const line = head + (when ? '（' + when + '）' : '');
        return row.reviewRemark ? line + '\n备注：' + row.reviewRemark : line;
    }

    function openReview(row) {
        currentRow = row;
        selectedTier = 'MEDIUM';
        document.getElementById('rvSuggestionId').value = row.id;
        document.getElementById('rvQuestion').textContent = row.question || '(未记录)';
        document.getElementById('rvAnswer').textContent = row.answer || '(未记录)';
        document.getElementById('rvSuggestion').textContent = row.content || '';
        document.getElementById('rvRating').textContent = row.ratingLabel || '';
        document.getElementById('rvHitType').textContent = row.hitType
            ? `· 命中类型 ${row.hitType}${row.retrievedCount != null ? ' · 检索到 ' + row.retrievedCount + ' 篇' : ''}`
            : '';
        // 每次打开都回到默认档位，自定义输入框收起并清空 ——
        // 上一条建议填过的分值不能带到下一条上
        document.getElementById('rvCustomPoints').value = '';
        document.getElementById('rvCustomBlock').classList.add('d-none');
        document.getElementById('rvRemark').value = row.reviewRemark || '';
        renderTiers();

        // 已审核过的只读展示。
        // **是隐藏而不是 disabled** —— 置灰的按钮看起来仍然像是"点不了但还能用"，
        // 而「查看」这个入口本来就不该出现任何裁决控件。
        const pending = row.status === 'PENDING';
        document.getElementById('rvActionBlock').classList.toggle('d-none', !pending);
        document.getElementById('acceptBtn').classList.toggle('d-none', !pending);
        document.getElementById('rejectBtn').classList.toggle('d-none', !pending);
        // 没有可操作的东西时，"取消"这个词没有意义
        document.getElementById('rvCancelBtn').textContent = pending ? '取消' : '关闭';

        const resultBlock = document.getElementById('rvResultBlock');
        resultBlock.classList.toggle('d-none', pending);
        if (!pending) {
            document.getElementById('rvResult').textContent = describeReviewResult(row);
        }

        if (!reviewModalInstance) {
            reviewModalInstance = new bootstrap.Modal(document.getElementById('reviewModal'));
        }
        reviewModalInstance.show();
    }

    async function submitReview(action) {
        const id = document.getElementById('rvSuggestionId').value;

        // 先把"发多少分"这件事定下来，再发请求。
        // 驳回不需要分值，两个字段都留 null（后端也不会去调 resolveAwardPoints）。
        let tier = null;
        let customPoints = null;
        let amount = 0;
        let amountNote = '';

        if (action === 'ACCEPT') {
            if (selectedTier === 'CUSTOM') {
                // 选了自定义就必须填，且必须是大于 1 的整数 —— 校验在 readCustomPoints 里
                const check = readCustomPoints();
                if (check.error) {
                    Swal.fire('积分不合法', check.error, 'warning');
                    return;
                }
                customPoints = check.value;
                amount = customPoints;
                amountNote = '（自定义）';
            } else {
                const t = tiers.find(x => x.value === selectedTier);
                if (!t) {
                    Swal.fire('请选择档位', '请选一个奖励档位，或选「自定义」自己填', 'warning');
                    return;
                }
                tier = selectedTier;
                amount = t.points;
                amountNote = '（' + t.label + '）';
            }

            const confirm = await Swal.fire({
                title: '确认采纳？',
                html: `将给 <strong>${esc(currentRow.realName || currentRow.username)}</strong> 发放 <strong>${amount}</strong> 积分${esc(amountNote)}`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '确认采纳',
                cancelButtonText: '取消'
            });
            if (!confirm.isConfirmed) return;
        }

        try {
            const resp = await fetch(`/api/admin/feedback/suggestions/${id}/review`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: action,
                    tier: tier,
                    customPoints: customPoints,
                    remark: document.getElementById('rvRemark').value.trim()
                })
            });
            const data = await resp.json();
            if (!data.success) {
                Swal.fire('❌ 操作失败', data.errMessage || '', 'error');
                return;
            }
            if (reviewModalInstance) reviewModalInstance.hide();
            Swal.fire({
                title: action === 'ACCEPT' ? `已采纳，发放 ${data.data.awardedPoints} 积分` : '已驳回',
                icon: 'success',
                timer: 1500,
                showConfirmButton: false
            });
            loadSuggestions(currentPage);
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    }

    // ================================================================
    // 7. 事件绑定
    // ================================================================
    // 状态下拉框：切换即查询（原来是一排按钮，改成下拉）
    document.getElementById('statusFilter').addEventListener('change', function () {
        currentStatus = this.value;
        loadSuggestions(1);
    });

    // 关键词搜索：按钮和回车都触发，和文档管理页保持一致
    document.getElementById('searchBtn').addEventListener('click', () => loadSuggestions(1));
    document.getElementById('keyword').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') loadSuggestions(1);
    });
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('keyword').value = '';
        document.getElementById('statusFilter').value = '';
        currentStatus = '';
        loadSuggestions(1);
    });

    document.getElementById('suggestionBody').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-review]');
        if (!btn) return;
        // 从当前页数据里找回来，避免再请求一次
        const id = btn.dataset.review;
        const row = lastRows.find(r => String(r.id) === String(id));
        if (row) openReview(row);
    });

    document.getElementById('tierRow').addEventListener('click', function (e) {
        const btn = e.target.closest('[data-tier]');
        if (!btn) return;
        selectedTier = btn.dataset.tier;

        // 只有「自定义」才显示输入框。切回固定档位时把填过的数字清掉 ——
        // 留着的话下次再选自定义时那个旧值会冒出来，很容易被当成默认值发出去。
        const isCustom = selectedTier === 'CUSTOM';
        document.getElementById('rvCustomBlock').classList.toggle('d-none', !isCustom);
        const input = document.getElementById('rvCustomPoints');
        if (isCustom) {
            input.focus();
        } else {
            input.value = '';
        }
        renderTiers();
    });

    // 分页的点击已由共享分页栏（app.js 的 window.Pager）内部处理，
    // 这里不再需要委托监听 —— 容器也从 <ul id="pagination"> 换成了 #pagerBar。

    document.getElementById('acceptBtn').addEventListener('click', () => submitReview('ACCEPT'));
    document.getElementById('rejectBtn').addEventListener('click', () => submitReview('REJECT'));

    // ================================================================
    // 8. 初始化
    // ================================================================
    loadSuggestions(1);
</script>
</body>
</html>
