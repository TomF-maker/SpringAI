<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档管理 - 采购智能助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <!-- 共享布局样式：放在各 CDN 之后、本页 <style> 之前 -->
    <link rel="stylesheet" href="/css/app.css?v=2">
    <style>
        .content-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .filter-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .filter-bar .form-control, .filter-bar .form-select { width: auto; min-width: 150px; }
        .doc-status { padding: 2px 10px; border-radius: 12px; font-size: 12px; display: inline-block; }
        .doc-status.success { background: #d4edda; color: #155724; }
        .doc-status.pending { background: #fff3cd; color: #856404; }
        .doc-status.failed { background: #f8d7da; color: #721c24; }
        .visibility-badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; background: #e8edf4; color: #1a73e8; }
        .visibility-badge.public { background: #d4edda; color: #155724; }
        .action-btn { padding: 4px 10px; font-size: 12px; margin: 0 2px; }
        .upload-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .upload-btn-group .btn { white-space: nowrap; }
        .text-ellipsis { max-width: 120px; display: inline-block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
        @media (max-width: 991.98px) {
            .filter-bar .form-control, .filter-bar .form-select { width: 100%; }
            .filter-bar { gap: 8px; }
            .table-responsive { font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- 侧边栏（共享片段，菜单顺序唯一定义处） -->
    <div th:replace="~{fragments/layout :: sidebar('documents')}"></div>
    <!-- 移动端遮罩（必须是 .sidebar 的兄弟节点） -->
    <div th:replace="~{fragments/layout :: backdrop}"></div>

    <!-- 主内容 -->
    <div class="main-content">
        <div th:replace="~{fragments/layout :: topbar('📄 文档管理')}"></div>

        <div class="content-card">
            <!-- 过滤和操作栏 -->
            <div class="filter-bar">
                <input type="text" id="keyword" class="form-control" placeholder="🔍 搜索标题/文件名" style="flex:1; min-width:180px;">
                <select id="deptFilter" class="form-select">
                    <option value="">全部部门</option>
                </select>
                <button class="btn btn-primary" id="searchBtn"><i class="bi bi-search"></i> 搜索</button>
                <button class="btn btn-outline-secondary" id="resetBtn"><i class="bi bi-arrow-counterclockwise"></i> 重置</button>
                <div class="upload-btn-group ms-auto">
                    <button class="btn btn-success" id="uploadFileBtn"><i class="bi bi-upload"></i> 上传文件</button>
                    <button class="btn btn-outline-success" id="uploadUrlBtn"><i class="bi bi-link-45deg"></i> 从URL上传</button>
                </div>
            </div>

            <!-- 文档表格 -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th style="width:50px;">ID</th>
                        <th>标题</th>
                        <th>文件名</th>
                        <th>上传人</th>
                        <th>部门</th>
                        <th style="width:120px;">可见性</th>
                        <th style="width:80px;">状态</th>
                        <th style="width:60px;">片段</th>
                        <th style="width:80px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="docTableBody">
                    <tr><td colspan="9" class="text-center text-muted py-4">⏳ 加载中...</td></tr>
                    </tbody>
                </table>
            </div>

            <nav aria-label="Page navigation" class="mt-3">
                <ul class="pagination justify-content-end" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<!-- ========== 上传文件模态框 ========== -->
<div class="modal fade" id="uploadFileModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-upload"></i> 上传文档</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="uploadFileForm">
                    <div class="mb-3">
                        <label class="form-label">选择文件 <span class="text-danger">*</span></label>
                        <input type="file" class="form-control" id="fileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.md" required>
                        <small class="text-muted">支持 PDF、DOC、DOCX、XLS、XLSX、TXT、MD 格式，最大 50MB</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">文档标题（可选）</label>
                        <input type="text" class="form-control" id="fileTitle" placeholder="留空则使用文件名">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">归属部门 <span class="text-danger">*</span></label>
                            <select class="form-select" id="fileDepartment" required></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">可见性</label>
                            <select class="form-select" id="fileVisibleType">
                                <option value="1">本部门</option>
                                <option value="2">全公司</option>
                                <option value="3">指定部门</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">是否公开</label>
                        <select class="form-select" id="fileIsPublic">
                            <option value="false">否（内部文档）</option>
                            <option value="true">是（公开文档）</option>
                        </select>
                    </div>
                    <div id="fileUploadProgress" class="text-center"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" id="submitFileBtn">上传</button>
            </div>
        </div>
    </div>
</div>

<!-- ========== 从URL上传模态框 ========== -->
<div class="modal fade" id="uploadUrlModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-link-45deg"></i> 从URL上传文档</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="uploadUrlForm">
                    <div class="mb-3">
                        <label class="form-label">文件URL <span class="text-danger">*</span></label>
                        <input type="url" class="form-control" id="urlInput" placeholder="https://example.com/document.pdf" required>
                        <small class="text-muted">支持 PDF、DOC、DOCX、XLS、XLSX、TXT、MD 格式</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">文档标题（可选）</label>
                        <input type="text" class="form-control" id="urlTitle" placeholder="留空则使用文件名">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">归属部门 <span class="text-danger">*</span></label>
                            <select class="form-select" id="urlDepartment" required></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">可见性</label>
                            <select class="form-select" id="urlVisibleType">
                                <option value="1">本部门</option>
                                <option value="2">全公司</option>
                                <option value="3">指定部门</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">是否公开</label>
                        <select class="form-select" id="urlIsPublic">
                            <option value="false">否（内部文档）</option>
                            <option value="true">是（公开文档）</option>
                        </select>
                    </div>
                    <div id="urlUploadProgress" class="text-center"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" id="submitUrlBtn">开始上传</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!-- 共享布局脚本：放在页面内联脚本之前，不加 defer/async -->
<script src="/js/app.js?v=2"></script>
<script>
    // ================================================================
    // 认证 & 全局拦截
    // ================================================================
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/login';

    const originalFetch = window.fetch;
    window.fetch = function(...args) {
        const url = args[0];
        if (typeof url === 'string' && url.includes('/api/auth/')) {
            return originalFetch.apply(this, args);
        }
        const options = args[1] || {};
        options.headers = options.headers || {};
        options.headers['Authorization'] = `Bearer ${token}`;
        args[1] = options;
        return originalFetch.apply(this, args);
    };

    // 当前用户显示、退出登录、管理菜单显隐、抽屉开关
    // 均由 /js/app.js 统一处理

    // ================================================================
    // 加载部门列表
    // ================================================================
    async function loadDepartments() {
        try {
            const resp = await fetch('/api/departments/tree');
            const data = await resp.json();
            if (data.success) {
                const flat = flattenTree(data.data);
                const selects = ['deptFilter', 'fileDepartment', 'urlDepartment'];
                selects.forEach(id => {
                    const sel = document.getElementById(id);
                    if (!sel) return;
                    let html = '<option value="">请选择</option>';
                    flat.forEach(d => {
                        html += `<option value="${d.id}">${d.deptName}</option>`;
                    });
                    sel.innerHTML = html;
                });
            }
        } catch (err) {
            console.error('加载部门失败', err);
        }
    }

    function flattenTree(tree) {
        let result = [];
        tree.forEach(node => {
            result.push({ id: node.id, deptName: node.deptName });
            if (node.children) {
                result = result.concat(flattenTree(node.children));
            }
        });
        return result;
    }

    // ================================================================
    // 文档列表
    // ================================================================
    let currentPage = 1;
    const pageSize = 10;
    let totalPages = 1;

    async function loadDocuments(page = 1) {
        const keyword = document.getElementById('keyword').value.trim();
        const deptId = document.getElementById('deptFilter').value;
        const params = new URLSearchParams({ page, size: pageSize });
        if (keyword) params.append('keyword', keyword);
        if (deptId) params.append('departmentId', deptId);

        try {
            const resp = await fetch('/api/documents/list?' + params.toString());
            const data = await resp.json();
            if (!data.success) throw new Error(data.errMessage);

            // 统一信封 + 分页：列表与分页信息都在 data.data（PageResult）
            const pageResult = data.data || {};
            renderTable(pageResult.records || []);
            renderPagination(pageResult.total || 0, pageResult.page || 1, pageResult.size || pageSize);
            currentPage = pageResult.page || 1;
        } catch (err) {
            document.getElementById('docTableBody').innerHTML =
                `<tr><td colspan="9" class="text-center text-danger py-3">❌ 加载失败：${err.message}</td></tr>`;
        }
    }

    function renderTable(docs) {
        const tbody = document.getElementById('docTableBody');
        if (!docs || docs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted py-4">📭 暂无文档</td></tr>';
            return;
        }

        let html = '';
        docs.forEach(d => {
            const statusClass = d.status === 1 ? 'success' : d.status === 0 ? 'pending' : 'failed';
            const statusText = d.status === 1 ? '已处理' : d.status === 0 ? '待处理' : '失败';
            const isPublic = d.isPublic === 1 ? '公开' : '内部';
            const visibleMap = {1:'本部门',2:'全公司',3:'指定部门'};
            const visibleText = visibleMap[d.visibleType] || '未知';
            const isPublicClass = d.isPublic === 1 ? 'public' : '';
            html += `
                <tr>
                    <td>${d.id}</td>
                    <td><span class="text-ellipsis" title="${d.title || '-'}">${d.title || '-'}</span></td>
                    <td><span class="text-ellipsis" title="${d.fileName || '-'}">${d.fileName || '-'}</span></td>
                    <td>${d.uploaderName || '-'}</td>
                    <td>${d.departmentName || '-'}</td>
                    <td>
                        <span class="visibility-badge">${visibleText}</span>
                        <span class="visibility-badge ${isPublicClass}">${isPublic}</span>
                    </td>
                    <td><span class="doc-status ${statusClass}">${statusText}</span></td>
                    <td>${d.chunkCount || 0}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger action-btn" onclick="deleteDoc(${d.id})" title="删除">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function renderPagination(total, page, size) {
        totalPages = Math.ceil(total / size);
        const ul = document.getElementById('pagination');
        if (totalPages <= 1) { ul.innerHTML = ''; return; }

        let html = `<li class="page-item ${page <= 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${page-1}">上一页</a></li>`;
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === page ? 'active' : ''}">
                <a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        html += `<li class="page-item ${page >= totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" data-page="${page+1}">下一页</a></li>`;
        ul.innerHTML = html;
        ul.querySelectorAll('a.page-link').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                const p = parseInt(this.dataset.page);
                if (p >= 1 && p <= totalPages) loadDocuments(p);
            });
        });
    }

    // ================================================================
    // 搜索与重置
    // ================================================================
    document.getElementById('searchBtn').addEventListener('click', () => loadDocuments(1));
    document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('keyword').value = '';
        document.getElementById('deptFilter').value = '';
        loadDocuments(1);
    });
    document.getElementById('keyword').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') loadDocuments(1);
    });

    // ================================================================
    // 上传文件
    // ================================================================
    document.getElementById('uploadFileBtn').addEventListener('click', function() {
        new bootstrap.Modal(document.getElementById('uploadFileModal')).show();
    });

    document.getElementById('submitFileBtn').addEventListener('click', async function() {
        const file = document.getElementById('fileInput').files[0];
        if (!file) { Swal.fire('请选择文件', '', 'warning'); return; }
        const title = document.getElementById('fileTitle').value.trim();
        const departmentId = document.getElementById('fileDepartment').value;
        if (!departmentId) { Swal.fire('请选择归属部门', '', 'warning'); return; }
        const visibleType = parseInt(document.getElementById('fileVisibleType').value);
        const isPublic = document.getElementById('fileIsPublic').value === 'true';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('title', title);
        formData.append('departmentId', departmentId);
        formData.append('visibleType', visibleType);
        formData.append('isPublic', isPublic);

        this.disabled = true;
        document.getElementById('fileUploadProgress').innerHTML = '<div class="spinner-border text-primary"></div>';

        try {
            const resp = await fetch('/api/documents/upload/metadata', { method: 'POST', body: formData });
            const data = await resp.json();
            if (data.success) {
                await Swal.fire('✅ 上传成功', `文档已处理，共 ${data.data.chunkCount} 个片段`, 'success');
                bootstrap.Modal.getInstance(document.getElementById('uploadFileModal')).hide();
                loadDocuments(currentPage);
            } else {
                Swal.fire('❌ 上传失败', data.errMessage, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        } finally {
            this.disabled = false;
            document.getElementById('fileUploadProgress').innerHTML = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('fileTitle').value = '';
        }
    });

    // ================================================================
    // URL上传
    // ================================================================
    document.getElementById('uploadUrlBtn').addEventListener('click', function() {
        new bootstrap.Modal(document.getElementById('uploadUrlModal')).show();
    });

    document.getElementById('submitUrlBtn').addEventListener('click', async function() {
        const url = document.getElementById('urlInput').value.trim();
        const title = document.getElementById('urlTitle').value.trim();
        const departmentId = document.getElementById('urlDepartment').value;
        if (!url) { Swal.fire('请输入文件URL', '', 'warning'); return; }
        if (!departmentId) { Swal.fire('请选择归属部门', '', 'warning'); return; }
        const visibleType = parseInt(document.getElementById('urlVisibleType').value);
        const isPublic = document.getElementById('urlIsPublic').value === 'true';

        const payload = { url, title, departmentId, visibleType, isPublic };

        this.disabled = true;
        document.getElementById('urlUploadProgress').innerHTML = '<div class="spinner-border text-primary"></div>';

        try {
            const resp = await fetch('/api/documents/upload/url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await resp.json();
            if (data.success) {
                await Swal.fire('✅ URL上传成功', `文档已处理，共 ${data.data.chunkCount} 个片段`, 'success');
                bootstrap.Modal.getInstance(document.getElementById('uploadUrlModal')).hide();
                loadDocuments(currentPage);
            } else {
                Swal.fire('❌ 上传失败', data.errMessage, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        } finally {
            this.disabled = false;
            document.getElementById('urlUploadProgress').innerHTML = '';
            document.getElementById('urlInput').value = '';
            document.getElementById('urlTitle').value = '';
        }
    });

    // ================================================================
    // 删除文档
    // ================================================================
    window.deleteDoc = async function(docId) {
        const result = await Swal.fire({
            title: '确认删除',
            text: '删除后将同时删除向量数据，不可恢复！',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: '确认删除',
            cancelButtonText: '取消',
            confirmButtonColor: '#d33'
        });
        if (!result.isConfirmed) return;

        try {
            const resp = await fetch(`/api/documents/${docId}`, { method: 'DELETE' });
            const data = await resp.json();
            if (data.success) {
                await Swal.fire('✅ 删除成功', '', 'success');
                loadDocuments(currentPage);
            } else {
                Swal.fire('❌ 删除失败', data.errMessage, 'error');
            }
        } catch (err) {
            Swal.fire('❌ 请求失败', err.message, 'error');
        }
    };

    // ================================================================
    // 初始化
    // ================================================================
    loadDepartments();
    loadDocuments(1);
</script>
</body>
</html>
