<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>layout</title>
</head>
<body>

<!-- ============================================================
     侧边栏
     菜单顺序的唯一来源：业务 → 管理 → 账户。
     调用：th:replace="~{fragments/layout :: sidebar('chat')}"
     ============================================================ -->
<div th:fragment="sidebar(active)" class="sidebar" id="sidebar">
    <!-- ============================================================
         尽早把登录态写到 body 上（data-auth-only / data-admin-only 靠它显隐）。

         为什么放在这里而不是 /js/app.js：app.js 在 body 末尾加载，等它执行时
         侧边栏已经渲染完了 —— 游客会先看到完整菜单再"唰"地收起，闪一下。
         这段脚本位于侧边栏最前面，下面的菜单项解析出来时类已经就位，不会闪。

         这是菜单显隐的唯一判定处，app.js 不再重复设置。
         ============================================================ -->
    <script>
        (function () {
            var authed = !!localStorage.getItem('token');
            document.body.classList.toggle('is-authed', authed);
            // 管理员一定是已登录的，所以 is-admin 蕴含 is-authed。
            // username === 'admin' 是历史判定，保留它兼容老会话；
            // 新登录的会话带 isAdmin，内部管理员换成别的用户名也能被认出来。
            var isAdmin = localStorage.getItem('username') === 'admin'
                || localStorage.getItem('isAdmin') === '1';
            document.body.classList.toggle('is-admin', isAdmin);
            // 客户公司管理员 = 外部用户(userType=2) + isAdmin。
            // 与 is-admin 互斥：内部管理员和客户管理员看到的是两套完全不同的菜单，
            // 不能互相污染 —— 客户管理员绝不该看到用户管理、全部客户文档那些入口。
            var isClientAdmin = localStorage.getItem('userType') === '2'
                && localStorage.getItem('isAdmin') === '1';
            document.body.classList.toggle('is-client-admin', isClientAdmin);
        })();
    </script>

    <div class="sidebar-brand">
        <span class="brand-mark"><i class="bi bi-lightbulb"></i></span>
        <span class="brand-text">
            <span class="brand-name">知行信咨询助手</span>
            <span class="brand-sub">Consulting AI</span>
        </span>
    </div>
    <ul class="nav flex-column">
        <li class="nav-section-label" aria-hidden="true">业务</li>

        <!-- ---------- 业务功能 ---------- -->
        <!-- 智能问答对游客开放，所以不带 data-auth-only -->
        <li class="nav-item">
            <a class="nav-link" th:classappend="${active == 'chat'} ? 'active' : ''" href="/chat">
                <i class="bi bi-chat-dots"></i> <span>智能问答</span>
            </a>
        </li>
        <li class="nav-item" data-auth-only>
            <a class="nav-link" th:classappend="${active == 'history'} ? 'active' : ''" href="/history">
                <i class="bi bi-clock-history"></i> <span>历史记录</span>
            </a>
        </li>
        <!-- 客户公司管理员专属：只看得到本公司的使用情况，看不到内部管理菜单 -->
        <li class="nav-item" data-client-admin-only>
            <a class="nav-link" th:classappend="${active == 'client-admin'} ? 'active' : ''" href="/client-admin">
                <i class="bi bi-building"></i> <span>客户看板</span>
            </a>
        </li>
        <!-- ---------- 管理功能（内部管理员；文档管理对客户管理员也开放） ---------- -->
        <!-- 分组标题与分隔线同时带 client-admin-only，否则客户管理员会看到
             一个没有标题、只剩「文档管理」一条的悬空分组。 -->
        <li class="nav-section-label" data-admin-only data-client-admin-only aria-hidden="true">管理</li>
        <li class="nav-divider" data-admin-only data-client-admin-only role="separator"></li>
        <!-- 文档管理：上传/删除会立刻影响检索结果，普通用户进来风险太大。
             客户管理员也放行，但他的作用域被 service/controller 收口到本公司
             （上传强制 clientId=本公司、isPublic=false；删除只能删本公司的）。
             普通用户依然只有「智能问答 + 历史记录」。 -->
        <li class="nav-item" data-admin-only data-client-admin-only>
            <a class="nav-link" th:classappend="${active == 'documents'} ? 'active' : ''" href="/documents">
                <i class="bi bi-file-earmark-text"></i> <span>文档管理</span>
            </a>
        </li>
        <li class="nav-item" data-admin-only>
            <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active' : ''" href="/dashboard">
                <i class="bi bi-graph-up"></i> <span>数据看板</span>
            </a>
        </li>
        <li class="nav-item" data-admin-only>
            <a class="nav-link" th:classappend="${active == 'screen'} ? 'active' : ''" href="/screen">
                <i class="bi bi-globe2"></i> <span>地域大屏</span>
            </a>
        </li>
        <li class="nav-item" data-admin-only>
            <a class="nav-link" th:classappend="${active == 'users'} ? 'active' : ''" href="/users">
                <i class="bi bi-people"></i> <span>用户管理</span>
            </a>
        </li>
        <!-- 公司管理：开户、合约（到期日/席位）、停用、指定客户管理员。
             替代了原来的「部门管理」（部门维度已废弃，见 doc/商业化方案.md A2）。 -->
        <li class="nav-item" data-admin-only>
            <a class="nav-link" th:classappend="${active == 'companies'} ? 'active' : ''" href="/companies">
                <i class="bi bi-building"></i> <span>公司管理</span>
            </a>
        </li>
        <li class="nav-item" data-admin-only>
            <a class="nav-link" th:classappend="${active == 'feedback-review'} ? 'active' : ''"
               href="/feedback-review">
                <i class="bi bi-chat-left-text"></i> <span>意见审核</span>
            </a>
        </li>

        <!-- ---------- 账户 ---------- -->
        <!-- 分割线也要跟着隐藏，否则个人中心藏起来后会剩一条孤零零的线 -->
        <li class="nav-section-label" data-auth-only aria-hidden="true">账户</li>
        <li class="nav-divider" data-auth-only role="separator"></li>
        <li class="nav-item" data-auth-only>
            <a class="nav-link" th:classappend="${active == 'profile'} ? 'active' : ''" href="/profile">
                <i class="bi bi-person"></i> <span>个人中心</span>
            </a>
        </li>

    </ul>
</div>

<!-- ============================================================
     移动端遮罩
     必须是 .sidebar 的兄弟节点，不能嵌进 .sidebar：
     .sidebar 上的 transform 会成为 position:fixed 后代的包含块，
     加上它已有的 overflow-y:auto，嵌套的遮罩会被裁剪并错位。
     调用：th:replace="~{fragments/layout :: backdrop}"
     ============================================================ -->
<div th:fragment="backdrop" class="sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- ============================================================
     顶栏
     汉堡按钮与标题包在 .topbar-left 中：.topbar 是 space-between
     的两子元素布局，直接加第三个子元素会把整条顶栏摊开。
     调用：th:replace="~{fragments/layout :: topbar('📄 文档管理')}"

     【外层这个 div 是必要的】fragment 只包含 th:fragment 标在**那个元素自身**，
     写在它后面的兄弟节点不会被渲染 —— 到期提醒横幅就是因此"代码写了但页面上没有"。
     所以横幅必须放进 fragment 内部；又不能塞进 .topbar（那会破坏它的两列布局），
     于是多包一层容器。
     ============================================================ -->
<div th:fragment="topbar(pageTitle)">
    <div class="topbar">
        <div class="topbar-left">
            <button type="button" class="drawer-toggle" id="drawerToggle"
                    aria-controls="sidebar" aria-expanded="false" aria-label="打开菜单">
                <i class="bi bi-list"></i>
            </button>
            <span class="topbar-title" id="pageTitle" th:text="${pageTitle}">页面</span>
        </div>
        <!--
          两种状态的显隐由 CSS 按 body.is-authed 切换，不写 JS：
          body 上的那个类已经由 sidebar 片段开头的内联脚本尽早写好了
          （见上面"菜单显隐的判定只有一处"），这里复用它，不再多一处判定。
          未登录时显示"登录/注册"而不是"退出" —— 游客根本没有可退的登录态。
        -->
        <div class="user-info">
            <span class="auth-only">
                <i class="bi bi-person-circle"></i>
                <span id="currentUser">用户</span>
                <a href="#" class="logout-btn ms-3" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> 退出</a>
            </span>
            <span class="guest-only">
                <a href="/login" class="btn btn-sm btn-primary">登录</a>
                <!-- 自助注册已关闭（A4），这个链接落到"联系我们开通"说明页 -->
                <a href="/register" class="btn btn-sm btn-outline-primary">开通账号</a>
            </span>
        </div>
    </div>

    <!--
      服务到期横幅（B1 站内提醒）。内容由 /js/app.js 填充 —— 到期日与剩余天数
      是登录态相关的，服务端渲染不出来。默认 d-none，只有确实进入提醒窗口才显示。
    -->
    <div id="contractBanner" class="contract-banner d-none"></div>
</div>

</body>
</html>
