<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修改初始密码 - 知行信咨询助手</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* 与 login.html 同一套视觉（独立页，不引 app.css，沿用同样的回退变量） */
        body {
            background: var(--pa-bg, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -20%; right: -10%;
            width: 70%; height: 70%;
            background: radial-gradient(circle, rgba(99, 91, 255, 0.08) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -20%; left: -10%;
            width: 60%; height: 60%;
            background: radial-gradient(circle, rgba(10, 37, 64, 0.05) 0%, transparent 60%);
            pointer-events: none; z-index: 0;
        }
        .pwd-card {
            position: relative;
            z-index: 1;
            max-width: 460px;
            width: 100%;
            padding: 40px 36px 32px;
            background: #fff;
            border-radius: 20px;
            box-shadow:
                0 24px 60px rgba(10, 37, 64, 0.12),
                0 8px 24px rgba(10, 37, 64, 0.06),
                0 0 0 1px rgba(99, 91, 255, 0.04);
            border: 1px solid var(--pa-border, #E5E7EB);
        }
        .pwd-card .brand-mark {
            width: 56px; height: 56px;
            margin: 0 auto 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #635BFF 0%, #4F47D6 100%);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(99, 91, 255, 0.32), 0 2px 6px rgba(99, 91, 255, 0.16);
        }
        .pwd-card h3 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 22px;
            font-weight: 700;
            color: var(--pa-ink, #0A2540);
            letter-spacing: -0.4px;
        }
        .pwd-card .subtitle {
            text-align: center;
            color: var(--pa-text-muted, #8898AA);
            font-size: 13px;
            margin-bottom: 24px;
            font-weight: 500;
            line-height: 1.7;
        }
        .pwd-card .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--pa-ink, #0A2540);
            margin-bottom: 8px;
        }
        .pwd-card .form-control {
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--pa-border, #E5E7EB);
            border-radius: 8px;
            background: var(--pa-surface-2, #FAFBFC);
            transition: border-color .14s ease, box-shadow .14s ease, background .14s ease;
            color: var(--pa-ink, #0A2540);
        }
        .pwd-card .form-control:focus {
            border-color: var(--pa-primary, #635BFF);
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.14);
            background: #fff;
            outline: none;
        }
        .pwd-card .hint {
            font-size: 12px;
            color: var(--pa-text-faint, #B0BCC8);
            margin-top: 6px;
        }
        .pwd-card .btn-primary {
            width: 100%;
            padding: 13px 16px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            background: var(--pa-primary, #635BFF);
            border-color: var(--pa-primary, #635BFF);
            color: #fff;
            box-shadow: 0 8px 20px rgba(99, 91, 255, 0.28), 0 2px 6px rgba(99, 91, 255, 0.16);
            transition: all .18s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .pwd-card .btn-primary:hover:not(:disabled) {
            background: var(--pa-primary-600, #5A52E0);
            border-color: var(--pa-primary-600, #5A52E0);
            transform: translateY(-1px);
        }
        .pwd-card .links {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
        }
        .pwd-card .links a { color: var(--pa-text-muted, #8898AA); text-decoration: none; }
        .pwd-card .links a:hover { color: var(--pa-primary, #635BFF); }
        .pwd-card .alert-danger {
            background: #FFF1F0;
            border: 1px solid rgba(214, 72, 61, 0.24);
            color: #B03A30;
            font-size: 13px;
            border-radius: 8px;
            padding: 10px 14px;
        }
        @media (max-width: 480px) {
            .pwd-card { padding: 32px 24px 24px; border-radius: 16px; }
        }
    </style>
</head>
<body>

<div class="pwd-card">
    <div class="brand-mark"><i class="bi bi-shield-lock"></i></div>
    <h3>请先修改初始密码</h3>
    <div class="subtitle">
        您使用的是管理员分配的初始密码。<br>
        为保障账号安全，修改后才可以继续使用平台。
    </div>

    <div id="pwdError" class="alert alert-danger d-none mb-3" role="alert"></div>

    <form id="pwdForm" autocomplete="off">
        <div class="mb-3">
            <label class="form-label">当前密码</label>
            <input type="password" class="form-control" id="oldPassword"
                   placeholder="请输入初始密码" autocomplete="current-password" required>
        </div>
        <div class="mb-3">
            <label class="form-label">新密码</label>
            <input type="password" class="form-control" id="newPassword"
                   placeholder="至少 8 位" minlength="8" autocomplete="new-password" required>
            <div class="hint">不能与当前密码相同</div>
        </div>
        <div class="mb-3">
            <label class="form-label">确认新密码</label>
            <input type="password" class="form-control" id="confirmPassword"
                   placeholder="请再次输入新密码" minlength="8" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">确认修改</button>
    </form>

    <div class="links">
        <a href="#" id="logoutLink">不是我的账号？退出登录</a>
    </div>
</div>

<script>
    // ================================================================
    // 修改初始密码（批量导入的账号首次登录用）
    //
    // 这个页面是独立页（不引 app.js），所以 Authorization 头要自己加。
    // 服务端虽然放行了本页对应的接口（PasswordChangeGuardFilter 的白名单），
    // 但请求仍然必须是已登录状态 —— 否则改的是谁都不知道。
    // ================================================================
    var MIN_LEN = 8;

    var errorBox = document.getElementById('pwdError');
    var form = document.getElementById('pwdForm');
    var submitBtn = document.getElementById('submitBtn');

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.remove('d-none');
    }

    function clearError() {
        errorBox.classList.add('d-none');
    }

    // 没有 token 直接回登录页：本页所有请求都要带认证，留着也没用
    var token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login';
    }

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        clearError();

        var oldPwd = document.getElementById('oldPassword').value;
        var newPwd = document.getElementById('newPassword').value;
        var confirmPwd = document.getElementById('confirmPassword').value;

        // 纯输入校验全放在发请求之前（顺序同服务端：先跑完没有副作用的检查）。
        // 服务端也有一份同样的校验 —— 这里只是让用户不用等一个来回。
        if (!oldPwd) { showError('请输入当前密码'); return; }
        if (newPwd.length < MIN_LEN) { showError('新密码至少 ' + MIN_LEN + ' 位'); return; }
        if (newPwd !== confirmPwd) { showError('两次输入的新密码不一致'); return; }
        if (newPwd === oldPwd) { showError('新密码不能与当前密码相同'); return; }

        submitBtn.disabled = true;
        submitBtn.textContent = '提交中…';

        try {
            var resp = await fetch('/api/users/me/password', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd })
            });
            var data = await resp.json();

            if (!data.success) {
                // 服务端的错误文案（旧密码错误 / 太短 / 不能与当前相同）直接展示，
                // 不要在这里改写 —— 后端是唯一知道真实原因的地方
                showError(data.errMessage || '修改失败，请重试');
                return;
            }

            await Swal.fire({
                icon: 'success',
                title: '密码已修改',
                text: '正在进入平台…',
                timer: 1500,
                showConfirmButton: false
            });
            // **不需要重新登录**：权限标记是每次请求重新查库得到的
            // （见 UserDetailsServiceImpl），改完这一次请求之后就自动解除了。
            window.location.href = '/chat';
        } catch (err) {
            showError('请求失败：' + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = '确认修改';
        }
    });

    // 退出登录：清掉本地登录态即可（token 是自包含的 JWT，服务端没有会话要清）
    document.getElementById('logoutLink').addEventListener('click', function (e) {
        e.preventDefault();
        localStorage.clear();
        window.location.href = '/login';
    });
</script>
</body>
</html>
